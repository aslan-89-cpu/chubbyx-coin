<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChubbyX - Farm Game</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .farm-container {
            background-color: #1f2833;
            border: 2px solid #45f3ff;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 20px rgba(69, 243, 255, 0.2);
            box-sizing: border-box;
        }

        h1 {
            color: #45f3ff;
            margin-bottom: 5px;
            text-transform: uppercase;
            font-size: 26px;
            letter-spacing: 1px;
        }

        .subtitle {
            font-size: 14px;
            color: #c5c6c7;
            margin-bottom: 25px;
        }

        .stat-box {
            background-color: #0b0c10;
            border: 1px solid #7c2cbf;
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
        }

        .stat-label {
            font-size: 14px;
            color: #c5c6c7;
            text-transform: uppercase;
        }

        .stat-value {
            font-size: 24px;
            font-weight: bold;
            color: #15eff2;
            margin-top: 5px;
        }

        .claim-btn {
            display: block;
            width: 100%;
            background: #7c2cbf;
            color: #ffffff;
            border: 2px solid #45f3ff;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 4px 15px rgba(124, 44, 191, 0.4);
            transition: background 0.2s;
        }

        .claim-btn:hover {
            background: #5a189a;
        }

        .back-btn {
            display: inline-block;
            background: #15eff2;
            color: #0b0c10;
            border: none;
            padding: 12px 30px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            width: 100%;
            margin-top: 15px;
            box-sizing: border-box;
            text-align: center;
        }

        .back-btn:hover {
            background: #0bc3c6;
        }
    </style>
</head>
<body>

    <div class="farm-container">
        <h1>CHUBBYX FARM</h1>
        <div class="subtitle">Harvest your tokens in real-time</div>

        <!-- Total Saved Balance -->
        <div class="stat-box">
            <div class="stat-label">Total Balance</div>
            <div class="stat-value"><span id="total-coins">0</span> 🪙</div>
        </div>

        <!-- Live Farming Production -->
        <div class="stat-box" style="border-color: #15eff2;">
            <div class="stat-label">Farming Pool</div>
            <div class="stat-value" style="color: #45f3ff;"><span id="farm-pool">0.000</span> 🪙</div>
        </div>

        <button class="claim-btn" onclick="claimFarmedCoins()">CLAIM COINS</button>
        <button class="back-btn" onclick="goToMainMenu()">BACK TO MAIN</button>
    </div>

    <script>
        let totalCoins = parseInt(localStorage.getItem('chubby_coins')) || 0;
        let farmPool = parseFloat(localStorage.getItem('farm_pool')) || 0.0;
        
        // Farming speed: 1 coin per second (0.01 coins every 10ms for smooth animation)
        const farmSpeed = 0.01; 

        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }

            document.getElementById('total-coins').innerText = totalCoins.toLocaleString();
            
            // Start the real-time farming loop
            setInterval(runFarming, 10);
        };

        function runFarming() {
            farmPool += farmSpeed;
            document.getElementById('farm-pool').innerText = farmPool.toFixed(3);
            // Save current pending pool to avoid losing it on refresh
            localStorage.setItem('farm_pool', farmPool);
        }

        function claimFarmedCoins() {
            if (farmPool < 1) {
                alert("Minimum 1 coin required to claim!");
                return;
            }

            let gained = Math.floor(farmPool);
            totalCoins += gained;
            farmPool -= gained; // Keep the decimal remainder

            localStorage.setItem('chubby_coins', totalCoins);
            localStorage.setItem('farm_pool', farmPool);

            document.getElementById('total-coins').innerText = totalCoins.toLocaleString();
            document.getElementById('farm-pool').innerText = farmPool.toFixed(3);

            alert("Successfully claimed " + gained.toLocaleString() + " coins!");
        }

        function goToMainMenu() {
            window.location.href = "index.html"; 
        }
    </script>
</body>
</html>
