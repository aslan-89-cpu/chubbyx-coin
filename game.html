<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Games Menu</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #090514;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }
        h1 { font-size: 26px; font-weight: bold; color: #a855f7; margin-bottom: 5px; text-transform: uppercase; }
        .subtitle { font-size: 13px; color: #9ca3af; margin-bottom: 40px; }
        .menu-container { width: 100%; max-width: 400px; display: flex; flex-direction: column; gap: 20px; }
        .menu-card {
            background: #150f2e;
            border: 2px solid #2e1f5e;
            border-radius: 20px;
            padding: 25px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
        }
        .menu-card:hover { transform: translateY(-3px); border-color: #7b2cbf; }
        .menu-card h2 { font-size: 18px; font-weight: bold; color: #eab308; margin-bottom: 6px; }
        .menu-card p { font-size: 13px; color: #9ca3af; }
        .back-btn {
            margin-top: auto; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1);
            color: white; padding: 12px 35px; border-radius: 12px; font-size: 15px; cursor: pointer; font-weight: bold;
        }
    </style>
</head>
<body>

    <h1>ChubbyX Arcade</h1>
    <div class="subtitle">Choose a game to play and earn rewards!</div>

    <div class="menu-container">
        <!-- دوگمەی کردنەوەی یاری یەکەم -->
        <div class="menu-card" onclick="location.href='spin.html'">
            <h2>🎰 Daily Lucky Spin</h2>
            <p>Spin the lucky wheel once every 24 hours to win mega bonuses!</p>
        </div>

        <!-- دوگمەی کردنەوەی یاری دووەم -->
        <div class="menu-card" onclick="location.href='catcher.html'">
            <h2>🧺 Coin Catcher</h2>
            <p>Catch falling golden coins with your basket in a 60s arcade loop!</p>
        </div>
    </div>

    <button class="back-btn" onclick="goBack()">Back to Main</button>

    <script>
        function goBack() { window.parent.postMessage('closePage', '*'); }
    </script>
</body>
</html>
