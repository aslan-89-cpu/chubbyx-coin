<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Lucky Chests</title>
    <script src="https://telegram.org"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #090514;
            font-family: sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        .game-box {
            background: #150f2e;
            border: 1px solid #2e1f5e;
            border-radius: 20px;
            padding: 30px 15px;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-top: 40px;
        }
        h2 { font-size: 22px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; text-align: center; color: #eab308;}
        .info-text { font-size: 14px; color: #9ca3af; margin-bottom: 35px; text-align: center; }
        
        /* CHESTS DESIGN */
        .chests-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-bottom: 40px;
            gap: 15px;
        }
        .chest {
            background: #241a49;
            border: 2px solid #7c2cbf;
            border-radius: 15px;
            width: 30%;
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            position: relative;
            z-index: 999 !important;
            pointer-events: auto !important;
            -webkit-tap-highlight-color: transparent;
        }
        .chest:hover {
            transform: scale(1.05);
            background: #2e225d;
        }
        
        .back-btn {
            margin-top: auto;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 14px 35px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            max-width: 480px;
            text-align: center;
            position: relative;
            z-index: 999 !important;
            pointer-events: auto !important;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <div class="game-box">
        <h2>CHUBBYX LUCKY CHESTS</h2>
        <div class="info-text" id="gamestatus">Tap on any lucky chest to claim your daily reward!</div>
        
        <div class="chests-container">
            <div class="chest" onclick="openChest(1)">🎁</div>
            <div class="chest" onclick="openChest(2)">🎁</div>
            <div class="chest" onclick="openChest(3)">🎁</div>
        </div>
    </div>

    <button class="back-btn" onclick="goBack()">Back to Game</button>

    <script>
        const rewards =;
        let canPlay = true;

        function checkDailyLimit() {
            const lastPlay = localStorage.getItem('chubby_last_chest_timestamp');
            const txt = document.getElementById('gamestatus');
            const twentyFourHours = 24 * 60 * 60 * 1000;

            if (lastPlay && (new Date().getTime() - parseInt(lastPlay)) < twentyFourHours) {
                canPlay = false;
                const timeLeft = twentyFourHours - (new Date().getTime() - parseInt(lastPlay));
                const hoursLeft = Math.floor(timeLeft / (1000 * 60 * 60));
                const minutesLeft = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                
                if(txt) txt.innerText = Already opened a chest today! Come back in ${hoursLeft}h ${minutesLeft}m.;
                document.querySelectorAll('.chest').forEach(c => c.style.opacity = "0.4");
                return false;
            }
            
            canPlay = true;
            document.querySelectorAll('.chest').forEach(c => c.style.opacity = "1");
            if(txt) txt.innerText = "Tap on any lucky chest to claim your daily reward!";
            return true;
        }

        function openChest(chestNumber) {
            if (!canPlay) return;
            canPlay = false;

            const txt = document.getElementById('gamestatus');
            const randomReward = rewards[Math.floor(Math.random() * rewards.length)];

            if(txt) txt.innerText = "Opening chest...";

            setTimeout(() => {
                let coins = parseInt(localStorage.getItem('chubby_coins')) || 0;
                localStorage.setItem('chubby_coins', coins + randomReward);
                localStorage.setItem('chubby_last_chest_timestamp', new Date().getTime());

                // ناردنی بڕی خەڵاتەکە بۆ باکئێند ئەگەر فەرمانەکە بوونی هەبێت
                if (typeof sendPrizeToBackend === "function") {
                    sendPrizeToBackend(randomReward);
                }

                alert(Congratulations! You found +${randomReward.toLocaleString()} ChubbyX Coins!);
                checkDailyLimit();
            }, 500);
        }

        function sendPrizeToBackend(prizeValue) {
            fetch('/api/save-prize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prize: prizeValue, timestamp: new Date().getTime() })
            })
            .then(res => res.json())
            .then(data => console.log('Prize saved:', data))
            .catch(err => console.error('Error:', err));
        }

        function goBack() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.close();
            } else {
                window.location.href = "index.html";
            }
        }

        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            checkDailyLimit();
        };
    </script>
</body>
</html>
