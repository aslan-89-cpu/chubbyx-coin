<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChubbyX Hub & Lucky Spin</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            box-sizing: border-box;
        }

        /* بەشی لاپەڕەی ناوەندی یارییەکان (ئەگەر پێویستت پێی بێت) */
        #main-hub {
            background-color: #1f2833;
            border: 2px solid #45f3ff;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 20px rgba(69, 243, 255, 0.2);
            box-sizing: border-box;
            display: none; /* گۆڕدرا بۆ شاراوە بۆ ئەوەی یەکەمجار ڕاستەوخۆ سپینەکە بکاتەوە */
        }

        h1 {
            color: #45f3ff;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .coin-status {
            font-size: 18px;
            color: #c5c6c7;
            margin-bottom: 30px;
        }

        .hub-btn {
            display: block;
            width: 100%;
            background: #7c2cbf;
            color: #ffffff;
            border: 2px solid #45f3ff;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-bottom: 15px;
            box-sizing: border-box;
            transition: background 0.2s;
        }

        /* بەشی چەرخی بەخت */
        #spin-section {
            background-color: #1f2833;
            border: 2px solid #45f3ff;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 20px rgba(69, 243, 255, 0.2);
            box-sizing: border-box;
            display: block; /* بە شێوازی بنەڕەتی سپینەکە لۆد دەبێت */
        }

        h2 {
            color: #45f3ff;
            margin-bottom: 5px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-size: 24px;
        }

        .info-text {
            font-size: 15px;
            color: #c5c6c7;
            margin-bottom: 25px;
            min-height: 40px;
        }

        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 30px auto;
        }

        #lucky-canvas {
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(124, 44, 191, 0.6);
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #15eff2;
            z-index: 10;
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: #15eff2;
            border-radius: 50%;
            border: 4px solid #ffffff;
            z-index: 5;
        }

        .spin-btn {
            display: inline-block;
            background: #7c2cbf;
            color: #ffffff;
            border: 2px solid #45f3ff;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            box-shadow: 0 4px 15px rgba(124, 44, 191, 0.4);
            width: 80%;
            margin-bottom: 15px;
        }

        .back-btn {
            display: inline-block;
            background: #15eff2;
            color: #0b0c10;
            border: none;
            padding: 10px 30px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            width: 80%;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- بەشی ناوەندی یاری (شاراوەیە) -->
    <div id="main-hub">
        <h1>ChubbyX Hub</h1>
        <div class="coin-status">
            Your Coins: <span id="hub-coin-count">0</span> 🪙
        </div>
        <button class="hub-btn" onclick="showSpinSection()">🎰 Open Lucky Spin</button>
    </div>

    <!-- بەشی چەرخی بەخت (یەکەمجار ئەمە دەکرێتەوە) -->
    <div id="spin-section">
        <h2>CHUBBYX LUCKY SPIN</h2>
        <div class="info-text" id="gamestatus">Spin the lucky wheel to claim your ChubbyX coins!</div>

        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="center-circle"></div>
            <canvas id="lucky-canvas" width="280" height="280"></canvas>
        </div>

        <button class="spin-btn" id="spin-trigger" onclick="startSpinning()">SPIN NOW</button>
        <br>
        <button class="back-btn" onclick="goToMainMenu()">Back to Game</button>
    </div>

    <script>
        const segments = ["500", "1000", "3000", "5000", "10000", "25000"];
        const colors = ["#241a49", "#3c165a", "#1f2833", "#241a49", "#3c165a", "#1f2833"];

        const canvas = document.getElementById("lucky-canvas");
        const ctx = canvas.getContext("2d");
        const radius = canvas.width / 2;

        function drawWheel() {
            const arc = (2 * Math.PI) / segments.length;
            for (let i = 0; i < segments.length; i++) {
                const angle = i * arc;
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.arc(radius, radius, radius, angle, angle + arc);
                ctx.lineTo(radius, radius);
                ctx.fill();

                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + arc / 2);
                ctx.fillStyle = "#45f3ff";
                if (i === 1 || i === 4) ctx.fillStyle = "#ffffff";
                if (i === 2 || i === 5) ctx.fillStyle = "#15eff2";
                ctx.font = "bold 16px Arial";
                ctx.textAlign = "right";
                ctx.fillText(segments[i], radius - 25, 6);
                ctx.restore();
            }
        }

        // فەنکشنی گەڕانەوە ڕاستەوخۆ بۆ لاپەڕەی سەرەکی کارەکتەرەکە (index.html)
        function goToMainMenu() {
            window.location.href = "index.html"; 
        }

        function showSpinSection() {
            document.getElementById("main-hub").style.display = "none";
            document.getElementById("spin-section").style.display = "block";
            drawWheel();
        }

        // لۆدبوونی تێلێگرام مینی ئەپ
        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            drawWheel(); // لەگەڵ لۆدبوون چەرخەکە دروست دەکات
        };

        let isSpinning = false;
        let currentRotation = 0;

        function startSpinning() {
            if (isSpinning) return;
            isSpinning = true;

            const txt = document.getElementById("gamestatus");
            const btn = document.getElementById("spin-trigger");
            if (btn) btn.style.opacity = "0.5";

            const randomDeg = Math.floor(Math.random() * 360);
            const totalSpins = 5 * 360; 
            currentRotation += totalSpins + randomDeg;

            canvas.style.transform = rotate(${currentRotation}deg);

            setTimeout(() => {
                const actualDeg = currentRotation % 360;
                const arcSize = 360 / segments.length;
                
                const correctedDeg = (360 - actualDeg + 270) % 360; 
                const selectedIndex = Math.floor(correctedDeg / arcSize) % segments.length;
                const finalReward = parseInt(segments[selectedIndex]);

                // خەزنکردنی کۆینەکان لە لۆکاڵ ستۆریج کە لەگەڵ لاپەڕەی سەرەکیدا هاوبەشە
                let coins = parseInt(localStorage.getItem('chubby_coins')) || 0;
                coins += finalReward;
                localStorage.setItem('chubby_coins', coins);

                if (txt) {
                    txt.innerText = "Congratulations! You won +" + finalReward.toLocaleString() + " coins!";
                    txt.style.color = "#45f3ff";
                }

                alert("Congratulations! You won " + finalReward.toLocaleString() + " coins!");

                isSpinning = false;
                if (btn) btn.style.opacity = "1";
            }, 5000);
        }
    </script>
</body>
</html>
