<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Game</title>
    <style>
        body { 
            background: #090314; 
            color: white; 
            font-family: sans-serif; 
            padding: 20px; 
            text-align: center; 
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            user-select: none;
        }
        h2 { color: #a48fff; margin-top: 20px; text-transform: uppercase; letter-spacing: 1px; }
        #zone { 
            position: relative; 
            width: 100%; 
            max-width: 400px;
            height: 380px; 
            background: #130a24; 
            border: 2px dashed #a48fff; 
            border-radius: 15px; 
            overflow: hidden; 
            margin-top: 20px; 
            touch-action: none;
        }
        .falling-coin { 
            position: absolute; 
            width: 50px; 
            height: 50px; 
            background: url('image_okkb6u.png.jpeg') no-repeat center; 
            background-size: cover; 
            border-radius: 50%; 
            cursor: pointer; 
            touch-action: manipulation;
        }
        .btn-play { 
            background: #ff9800; 
            color: white; 
            border: none; 
            padding: 12px 30px; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px;
            margin-top: 10px;
            box-shadow: 0 4px 10px rgba(255, 152, 0, 0.3);
        }
        .back-btn { 
            background: #1c103a; 
            color: white; 
            padding: 12px 35px; 
            border-radius: 10px; 
            border: 1px solid #a48fff; 
            margin-top: 25px; 
            cursor: pointer; 
            font-weight: bold; 
        }
    </style>
</head>
<body>
    <h2>Chubby Catch Game</h2>
    <!-- لێرەدا نووسینە کوردییەکە گۆڕدرا بۆ ئینگلیزی فەرمی -->
    <p style="opacity: 0.8; font-size: 14px; margin-bottom: 5px;">Coins are falling! Catch them quickly!</p>
    
    <button class="btn-play" id="start-btn" onclick="startGame()">Start Game (30s)</button>
    
    <div id="zone"></div>
    
    <button class="back-btn" onclick="window.location.href='index.html'">Back to Game</button>

    <script>
        let count = parseInt(localStorage.getItem('chubby_coins')) || 0;
        let gameInterval;
        
        function startGame() {
            document.getElementById('start-btn').disabled = true;
            document.getElementById('start-btn').style.background = '#444';
            document.getElementById('start-btn').innerText = "Playing...";
            const zone = document.getElementById('zone'); 
            zone.innerHTML = '';
            
            gameInterval = setInterval(() => {
                let coin = document.createElement('div'); 
                coin.classList.add('falling-coin');
                coin.style.left = Math.floor(Math.random() * (zone.clientWidth - 50)) + 'px'; 
                coin.style.top = '0px';
                zone.appendChild(coin);
                
                let top = 0;
                let fall = setInterval(() => {
                    if (top > zone.clientHeight - 50) { 
                        clearInterval(fall); 
                        coin.remove(); 
                    } else { 
                        top += 4; 
                        coin.style.top = top + 'px'; 
                    }
                }, 20);
                
                // بەکارهێنانی touchstart بۆ کارکردنی خێرا لەسەر ئایفۆن
                coin.addEventListener('touchstart', function(e) {
                    e.preventDefault();
                    count += 5; 
                    localStorage.setItem('chubby_coins', count); 
                    clearInterval(fall); 
                    coin.remove(); 
                });
                
            }, 750);
            
            setTimeout(() => { 
                clearInterval(gameInterval); 
                zone.innerHTML = ''; 
                document.getElementById('start-btn').disabled = false; 
                document.getElementById('start-btn').style.background = '#ff9800';
                document.getElementById('start-btn').innerText = "Start Game (30s)";
                alert("Game Over! Your coins have been saved."); 
            }, 30000);
        }
    </script>
</body>
</html>
