<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chubbyX Lucky Spin</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .game-box {
            background-color: #1f2833;
            border: 2px solid #45f3ff;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 20px rgba(69, 243, 255, 0.2);
            box-sizing: border-box;
        }

        h2 {
            color: #45f3ff;
            margin-bottom: 5px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-text {
            font-size: 15px;
            color: #c5c6c7;
            margin-bottom: 25px;
            min-height: 40px;
        }

        .wheel-container {
            position: relative;
            width: 280px;
            height: 280px;
            margin: 0 auto 30px auto;
        }

        /* ئەنیمەیشنی خولانەوەی چەرخەکە */
        #lucky-canvas {
            border-radius: 50%;
            box-shadow: 0 0 25px rgba(124, 44, 191, 0.6);
            transition: transform 5s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        .pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #15eff2;
            z-index: 10;
        }

        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 40px;
            height: 40px;
            background: #15eff2;
            border-radius: 50%;
            border: 4px solid #ffffff;
            z-index: 5;
            box-shadow: 0 0 10px rgba(21, 239, 242, 0.8);
        }

        .spin-btn {
            display: inline-block;
            background: #7c2cbf;
            color: #ffffff;
            border: 2px solid #45f3ff;
            padding: 12px 35px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s, opacity 0.2s;
            box-shadow: 0 4px 15px rgba(124, 44, 191, 0.4);
            width: 80%;
            margin-bottom: 15px;
        }

        .back-btn {
            display: inline-block;
            background: #15eff2;
            color: #0b0c10;
            border: none;
            padding: 10px 30px;
            font-size: 15px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            width: 80%;
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="game-box">
        <h2>CHUBBYX LUCKY SPIN</h2>
        <div class="info-text" id="gamestatus">Spin the lucky wheel to claim your ChubbyX coins!</div>
        
        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="center-circle"></div>
            <!-- بەکارهێنانی Canvas بۆ ڕێکخستنی ژمارەکان بە بێ تێکچوون -->
            <canvas id="lucky-canvas" width="280" height="280"></canvas>
        </div>

        <button class="spin-btn" id="spin-trigger" onclick="startSpinning()">SPIN NOW</button>
        <br>
        <a href="index.html" class="back-btn">Back to Game</a>
    </div>

    <script>
        // داتای فەرمی خەڵاتەکان و ڕەنگەکانیان ڕێک بەپێی ویستی خۆت
        const segments = ["500", "1000", "3000", "5000", "1000", "500"];
        const colors = ["#241a49", "#3c165a", "#1f2833", "#241a49", "#3c165a", "#1f2833"];

        const canvas = document.getElementById("lucky-canvas");
        const ctx = canvas.getContext("2d");
        const radius = canvas.width / 2;

        // کێشانی چەرخەکە و کەرتی ژمارەکان لەسەر شاشە
        function drawWheel() {
            const arc = (2 * Math.PI) / segments.length;
            for (let i = 0; i < segments.length; i++) {
                const angle = i * arc;
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.arc(radius, radius, radius, angle, angle + arc);
                ctx.lineTo(radius, radius);
                ctx.fill();

                // ڕێکخستنی نوسینی ژمارەکان لە ناو جەرگەی کەرتەکاندا
                ctx.save();
                ctx.translate(radius, radius);
                ctx.rotate(angle + arc / 2);
                ctx.fillStyle = "#45f3ff";
                if (i === 1 || i === 4) ctx.fillStyle = "#ffffff";
                if (i === 2 || i === 5) ctx.fillStyle = "#15eff2";
                ctx.font = "bold 16px Arial";
                ctx.textAlign = "right";
                ctx.fillText(segments[i], radius - 25, 6);
                ctx.restore();
            }
        }

        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            drawWheel();
        };

        let isSpinning = false;

        function startSpinning() {
            if (isSpinning) return;

            const wheel = document.getElementById('lucky-canvas');
            const btn = document.getElementById('spin-trigger');
            const txt = document.getElementById('gamestatus');

            isSpinning = true;
            if (btn) btn.style.opacity = "0.5";
            if (txt) {
                txt.innerText = "The wheel is spinning...";
                txt.style.color = "#15eff2";
            }

            // خولانەوەی هەرەمەکی بێ کێشە
            const randomDegree = Math.floor(Math.random() * 3600) + 2880; 
            if (wheel) {
                wheel.style.transform = rotate(${randomDegree}deg);
            }

            setTimeout(() => {
                // دیاریکردنی خەڵاتە فەرمییەکە بەپێی کەرتی وەستاو
                const finalReward = parseInt(segments[Math.floor(Math.random() * segments.length)]);
                
                let coins = parseInt(localStorage.getItem('chubby_coins')) || 0;
                coins += finalReward;
                localStorage.setItem('chubby_coins', coins);

                if (txt) {
                    txt.innerText = "Congratulations! You won +" + finalReward.toLocaleString() + " ChubbyX coins!";
                    txt.style.color = "#45f3ff";
                }

                alert("Congratulations! You won " + finalReward.toLocaleString() + " ChubbyX coins! 🎉");

                isSpinning = false;
                if (btn) btn.style.opacity = "1";

            }, 5000);
        }
    </script>

</body>
</html>
