<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Lucky Chests</title>
    <script src="https://telegram.org"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #090514;
            font-family: sans-serif;
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            overflow: hidden;
        }
        .game-box {
            background: #150f2e;
            border: 1px solid #2e1f5e;
            border-radius: 20px;
            padding: 30px 15px;
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            margin-top: 40px;
        }
        h2 { font-size: 22px; font-weight: bold; margin-bottom: 8px; text-transform: uppercase; text-align: center; color: #eab308;}
        .info-text { font-size: 14px; color: #9ca3af; margin-bottom: 35px; text-align: center; }
        
        /* CHESTS DESIGN */
        .chests-container {
            display: flex;
            justify-content: space-around;
            width: 100%;
            margin-bottom: 40px;
            gap: 10px;
        }
        .chest {
            background: #241a49;
            border: 2px solid #7c2cbf;
            border-radius: 15px;
            width: 30%;
            height: 100px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 35px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s;
            position: relative;
            z-index: 999 !important;
            pointer-events: auto !important;
        }
        .chest:hover {
            transform: scale(1.05);
            background: #2e225d;
        }
        .chest.opened {
            background: #eab308;
            border-color: #ffffff;
            animation: pop 0.3s ease-in-out;
        }
        @keyframes pop {
            0% { transform: scale(1); }
            50% { transform: scale(1.15); }
            100% { transform: scale(1); }
        }
        
        .back-btn {
            margin-top: auto;
            margin-bottom: 20px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            padding: 14px 35px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            max-width: 480px;
            text-align: center;
            position: relative;
            z-index: 999 !important;
            pointer-events: auto !important;
        }
    </style>
</head>
<body>

    <div class="game-box">
        <h2>CHUBBYX LUCKY CHESTS</h2>
        <div class="info-text" id="gamestatus">Tap on any lucky chest to claim your daily reward!</div>
        
        <div class="chests-container">
            <div class="chest" id="chest1" onclick="openChest(1)">🎁</div>
            <div class="chest" id="chest2" onclick="openChest(2)">🎁</div>
            <div class="chest" id="chest3" onclick="openChest(3)">🎁</div>
        </div>
    </div>

    <button class="back-btn" onclick="goBack()">Back to Game</button>

    <script>
        // خەڵاتەکان بۆ سەر سندوقەکان
        const rewards =;
        let canPlay = true;

        function checkDailyLimit() {
            const lastPlay = localStorage.getItem('chubby_last_chest_timestamp');
            const txt = document.getElementById('gamestatus');
            const twentyFourHours = 24 * 60 * 60 * 1000;

            if (lastPlay && (new Date().getTime() - parseInt(lastPlay)) < twentyFourHours) {
                canPlay = false;
                const timeLeft = twentyFourHours - (new Date().getTime() - parseInt(lastPlay));
                const hoursLeft = Math.floor(timeLeft / (1000 * 60 * 60));
                const minutesLeft = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                
                txt.innerText = You already opened a chest today! Come back in ${hoursLeft}h ${minutesLeft}m.;
                // کاڵکردنەوەی سندوقەکان چونکە کاتی نەهاتووە
                document.querySelectorAll('.chest').forEach(c => c.style.opacity = "0.4");
                return false;
            }
            return true;
        }

        function openChest(chestNumber) {
            if (!canPlay || !checkDailyLimit()) return;
            canPlay = false;

            const selectedChest = document.getElementById(chest${chestNumber});
            const txt = document.getElementById('gamestatus');

            // دیاریکردنی خەڵاتێکی هەڕەمەکی
            const randomReward = rewards[Math.floor(Math.random() * rewards.length)];

            // گۆڕینی شێوازی سندوقەکە بە ئەنیمەیشن
            selectedChest.classList.add('opened');
            selectedChest.innerText = "⭐";

            setTimeout(() => {
                // پاشەکەوتکردنی داتاکان لە مۆبایلەکەدا
                let coins = parseInt(localStorage.getItem('chubby_coins')) || 0;
                localStorage.setItem('chubby_coins', coins + randomReward);
                localStorage.setItem('chubby_last_chest_timestamp', new Date().getTime());

                alert(Congratulations! You found +${randomReward.toLocaleString()} ChubbyX Coins!);
                txt.innerText = You won ${randomReward.toLocaleString()} coins today!;
                checkDailyLimit();
            }, 300);
        }

        function goBack() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.close();
            } else {
                window.location.href = "index.html";
            }
        }

        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            checkDailyLimit();
        };
    </script>
</body>
</html>
