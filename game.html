<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Lucky Spin</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #090514;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        
        .tabs { display: flex; gap: 10px; width: 100%; max-width: 400px; margin-bottom: 25px; }
        .tab-btn {
            flex: 1;
            background: rgba(123, 44, 191, 0.2);
            border: 1px solid #7b2cbf;
            color: #9ca3af;
            padding: 12px;
            border-radius: 12px;
            font-weight: bold;
            cursor: pointer;
            font-size: 14px;
        }
        .tab-btn.active { background: #7b2cbf; color: white; }

        .game-box {
            background: #150f2e;
            border: 1px solid #2e1f5e;
            border-radius: 20px;
            padding: 25px 15px;
            width: 100%;
            max-width: 400px;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        h2 { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .info-text { font-size: 13px; color: #9ca3af; margin-bottom: 25px; text-align: center; }

        /* ─── دیزاینی خەرۆکەی بەختەکە (Lucky Wheel) ─── */
        .wheel-wrapper { position: relative; width: 280px; height: 280px; margin-bottom: 25px; }
        
        /* دەرزی ئاڕاستەکەر لە سەرەوەی خەرۆکەکە */
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 25px solid #a855f7;
            z-index: 100;
        }

        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #7b2cbf;
            position: relative;
            overflow: hidden;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
            background: conic-gradient(
                #5a189a 0deg 60deg,
                #7b2cbf 60deg 120deg,
                #9d4edd 120deg 180deg,
                #5a189a 180deg 240deg,
                #7b2cbf 240deg 300deg,
                #9d4edd 300deg 360deg
            );
            box-shadow: 0 0 20px rgba(123, 44, 191, 0.5);
        }

        /* لۆگۆی ناوەڕاستی خەرۆکەکە */
        .center-circle {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background: #090514;
            border: 3px solid #eab308;
            border-radius: 50%;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .center-circle img { width: 30px; height: 30px; object-fit: contain; }

        /* نووسینی ژمارەی خەڵاتەکان لەسەر سێگۆشەکان */
        .segment-text {
            position: absolute;
            width: 100%;
            height: 100%;
            text-align: center;
            font-weight: bold;
            font-size: 14px;
            color: white;
            transform-origin: 50% 50%;
            padding-top: 20px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.8);
        }

        .spin-btn {
            background: #7b2cbf;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .spin-btn:disabled { background: rgba(255, 255, 255, 0.05); color: #6b7280; cursor: not-allowed; border: 1px solid rgba(255, 255, 255, 0.1); }

        .back-btn {
            margin-top: 30px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 35px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <!-- TOP NAVIGATION TABS -->
    <div class="tabs">
        <button class="tab-btn active">Daily Spin</button>
        <button class="tab-btn" onclick="alert('Coin Catcher game is coming soon in the next update!')">Coin Catcher</button>
    </div>

    <!-- LUCKY SPIN ARENA -->
    <div class="game-box">
        <h2>ChubbyX Lucky Spin</h2>
        <div class="info-text" id="statusText">Spin the purple wheel to win mega rewards!</div>

        <div class="wheel-wrapper">
            <div class="pointer"></div>
            <div class="center-circle">
                <img src="image.png.jpeg" alt="Center">
            </div>
            <!-- Dynamic Prize Segments Wheel -->
            <div class="wheel" id="wheel">
                <div class="segment-text" style="transform: rotate(30deg);">5,000</div>
                <div class="segment-text" style="transform: rotate(90deg);">500</div>
                <div class="segment-text" style="transform: rotate(150deg);">1,000</div>
                <div class="segment-text" style="transform: rotate(210deg);">2,000</div>
                <div class="segment-text" style="transform: rotate(270deg);">500</div>
                <div class="segment-text" style="transform: rotate(330deg);">1,000</div>
            </div>
        </div>

        <button class="spin-btn" id="spinBtn" onclick="startSpin()">Spin Now</button>
    </div>

    <button class="back-btn" onclick="goBack()">Back to Game</button>

    <script>
        // List of prizes mapped to exact angles on the circle
        const prizes = [
            { text: "5,000", value: 5000, minAngle: 0, maxAngle: 60 },
            { text: "1,000", value: 1000, minAngle: 60, maxAngle: 120 },
            { text: "500", value: 500, minAngle: 120, maxAngle: 180 },
            { text: "2,000", value: 2000, minAngle: 180, maxAngle: 240 },
            { text: "1,000", value: 1000, minAngle: 240, maxAngle: 300 },
            { text: "500", value: 500, minAngle: 300, maxAngle: 360 }
        ];

        let isSpinning = false;

        function checkDailyLimit() {
            const lastSpin = localStorage.getItem('chubby_last_spin');
            const spinBtn = document.getElementById('spinBtn');
            const statusText = document.getElementById('statusText');

            if (lastSpin) {
                const now = new Date().getTime();
                const timePassed = now - parseInt(lastSpin);
                const cooldown = 24 * 60 * 60 * 1000; // 24 hours lock timer

                if (timePassed < cooldown) {
                    spinBtn.disabled = true;
                    
                    // Calculate remaining cooldown time
                    const timeLeft = cooldown - timePassed;
                    const hours = Math.floor(timeLeft / (1000 * 60 * 60));
                    const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    
                    statusText.innerText = Come back in ${hours}h ${minutes}m for your next daily spin!;
                    return false;
                }
            }
            spinBtn.disabled = false;
            statusText.innerText = "Spin the purple wheel to win mega rewards!";
            return true;
        }

        function startSpin() {
            if (isSpinning || !checkDailyLimit()) return;

            isSpinning = true;
            const wheel = document.getElementById('wheel');
            const spinBtn = document.getElementById('spinBtn');

            // Generate a random win prize sector index
            const prizeIndex = Math.floor(Math.random() * prizes.length);
            const selectedPrize = prizes[prizeIndex];

            // Math algorithm to center the needle pointer inside the sector box
            const targetAngle = 360 - ((selectedPrize.minAngle + selectedPrize.maxAngle) / 2);
            const totalRotation = (360 * 5) + targetAngle; // 5 full starter rounds plus target degree

            wheel.style.transform = rotate(${totalRotation}deg);
            spinBtn.disabled = true;

            setTimeout(() => {
                // Credit won coins directly into the master balance database
                let currentCoins = parseInt(localStorage.getItem('chubby_coins')) || 0;
                currentCoins += selectedPrize.value;
                localStorage.setItem('chubby_coins', currentCoins);
                
                // Save current timestamp lock token
                localStorage.setItem('chubby_last_spin', new Date().getTime());

                alert(Congratulations! You won +${selectedPrize.text} ChubbyX Coins!);
                
                isSpinning = false;
                checkDailyLimit();
            }, 4000); // exact match with CSS cubic-bezier transition time
        }

        function goBack() {
            window.parent.postMessage('closePage', '*');
        }

        window.onload = checkDailyLimit;
    </script>
</body>
</html>
