<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Mini Game</title>
    <style>
        body { 
            background: #090314; 
            color: white; 
            font-family: sans-serif; 
            padding: 20px; 
            text-align: center; 
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #a48fff; margin-top: 20px; }
        #zone { 
            position: relative; 
            width: 100%; 
            max-width: 400px;
            height: 350px; 
            background: #130a24; 
            border: 2px dashed #a48fff; 
            border-radius: 15px; 
            overflow: hidden; 
            margin-top: 20px; 
        }
        .falling-coin { 
            position: absolute; 
            width: 45px; 
            height: 45px; 
            background: url('image_okkb6u.png.jpeg') no-repeat center; 
            background-size: cover; 
            border-radius: 50%; 
            cursor: pointer; 
        }
        .btn-play { 
            background: #ff9800; 
            color: white; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 8px; 
            font-weight: bold; 
            cursor: pointer; 
            font-size: 16px;
            margin-top: 10px;
        }
        .back-btn { 
            background: #331a5e; 
            color: white; 
            padding: 12px 30px; 
            border-radius: 10px; 
            border: 1px solid #a48fff; 
            margin-top: 30px; 
            cursor: pointer; 
            font-weight: bold; 
            text-decoration: none;
        }
    </style>
</head>
<body>
    <h2>Chubby Catch Game</h2>
    <p style="opacity: 0.8; font-size: 14px;">سکە زەردەکان دەبارێن! خێرا کلیکیان لێ بکە!</p>
    
    <button class="btn-play" id="start-btn" onclick="startGame()">Start Game (30s)</button>
    
    <div id="zone"></div>
    
    <br>
    <button class="back-btn" onclick="window.location.href='index.html'">Back to Game</button>

    <script>
        let count = parseInt(localStorage.getItem('chubby_coins')) || 0;
        let gameInterval;
        
        function startGame() {
            document.getElementById('start-btn').disabled = true;
            document.getElementById('start-btn').style.background = '#444';
            const zone = document.getElementById('zone'); 
            zone.innerHTML = '';
            
            gameInterval = setInterval(() => {
                let coin = document.createElement('div'); 
                coin.classList.add('falling-coin');
                coin.style.left = Math.floor(Math.random() * (zone.clientWidth - 45)) + 'px'; 
                coin.style.top = '0px';
                zone.appendChild(coin);
                
                let top = 0;
                let fall = setInterval(() => {
                    if (top > zone.clientHeight - 45) { 
                        clearInterval(fall); 
                        coin.remove(); 
                    } else { 
                        top += 4; 
                        coin.style.top = top + 'px'; 
                    }
                }, 20);
                
                coin.onclick = function() { 
                    count += 5; 
                    localStorage.setItem('chubby_coins', count); 
                    clearInterval(fall); 
                    coin.remove(); 
                };
            }, 700);
            
            setTimeout(() => { 
                clearInterval(gameInterval); 
                zone.innerHTML = ''; 
                document.getElementById('start-btn').disabled = false; 
                document.getElementById('start-btn').style.background = '#ff9800';
                alert("یارییەکە کۆتایی هات! خاڵەکانت پاشەکەوت کران."); 
            }, 30000);
        }
    </script>
</body>
</html>
