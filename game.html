<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>chubbyX Lucky Chests</title>
    <!-- ئەسکریپتی فەرمی مینی ئەپی تێلیگرام -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }

        .game-box {
            background-color: #1f2833;
            border: 2px solid #45f3ff;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 0 20px rgba(69, 243, 255, 0.2);
            box-sizing: border-box;
        }

        h2 {
            color: #45f3ff;
            margin-bottom: 10px;
            font-size: 24px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-text {
            font-size: 16px;
            color: #c5c6c7;
            margin-bottom: 30px;
            min-height: 40px;
        }

        .chests-container {
            display: flex;
            justify-content: space-around;
            gap: 15px;
            margin-bottom: 40px;
        }

        /* 💜 پاراستنی ڕەنگە وەنەوشەییە ڕەسەنەکەی خۆت بۆ سندوقەکان 💜 */
        .chest {
            background: #241a49;
            border: 2px solid #7c2cbf;
            border-radius: 15px;
            width: 30%;
            height: 110px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
            transition: transform 0.2s, background 0.2s, box-shadow 0.2s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        .chest:hover {
            transform: scale(1.05);
            background: #2e225d;
            box-shadow: 0 0 15px rgba(124, 44, 191, 0.5);
        }

        .chest:active {
            transform: scale(0.95);
        }

        .back-btn {
            display: inline-block;
            background: #15eff2;
            color: #0b0c10;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s, transform 0.1s;
            box-shadow: 0 4px 10px rgba(21, 239, 242, 0.3);
            margin-top: 20px;
            width: 80%;
            text-align: center;
        }

        .back-btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>

    <div class="game-box">
        <h2>CHUBBYX LUCKY CHESTS</h2>
        <div class="info-text" id="gamestatus">Tap on any lucky chest to claim your daily reward!</div>
        
        <div class="chests-container">
            <div class="chest" onclick="openchest(1)">🎁</div>
            <div class="chest" onclick="openchest(2)">🎁</div>
            <div class="chest" onclick="openchest(3)">🎁</div>
        </div>
    </div>

    <!-- دوگمەی گەڕانەوەی ڕەسەن -->
    <a href="index.html" class="back-btn">Back to Game</a>

    <!-- لایبڕەرییەکانی فایربەیس لە پشتەوە بۆ کارکردنی داتابەیس -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>

    <script>
        // زانیارییەکانی فایربەیسەکەت بەستراوە
        const firebaseConfig = {
            apiKey: "AIzaSyAs-ExampleKeyPleaseReplaceIfNeeded", 
            authDomain: "://firebaseapp.com",
            projectId: "chubbyx-db",
            storageBucket: "://appspot.com",
            messagingSenderId: "384729104829", 
            appId: "1:384729104829:web:abcdef123456" 
        };
        
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let userId = "test_player";
        if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.initDataUnsafe && window.Telegram.WebApp.initDataUnsafe.user) {
            userId = window.Telegram.WebApp.initDataUnsafe.user.id.toString();
        }

        let currentBalance = 0;

        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            // وەرگرتنی خاڵی کۆنی بەکارهێنەر لە داتابەیسەوە
            db.collection("users").doc(userId).get().then((doc) => {
                if (doc.exists) {
                    currentBalance = doc.data().chubby_coins || 0;
                }
            }).catch((err) => {
                console.log("Firebase load fallback:", err);
            });
        };

        const rewards =;

        function openchest(chestNumber) {
            const txt = document.getElementById('gamestatus');
            if (txt) {
                txt.innerText = "Opening chest...";
                txt.style.color = "#15eff2";
            }

            document.querySelectorAll('.chest').forEach(c => {
                c.style.pointerEvents = "none";
                c.style.opacity = "0.5";
            });

            const randomReward = rewards[Math.floor(Math.random() * rewards.length)];

            setTimeout(() => {
                currentBalance += randomReward;
                
                // 💾 ناردنی ڕاستەوخۆی خاڵەکان بۆ داتابەیسی ئۆنلاین 💾
                db.collection("users").doc(userId).set({
                    chubby_coins: currentBalance
                }, { merge: true }).then(() => {
                    if (txt) {
                        txt.innerText = "Congratulations! You won +" + randomReward.toLocaleString() + " ChubbyX coins!";
                        txt.style.color = "#45f3ff";
                    }
                    alert("Congratulations! You found " + randomReward.toLocaleString() + " ChubbyX coins! 🎉");
                }).catch((error) => {
                    // ئەگەر پەیوەندی داتابەیس کێشەی کاتی هەبوو، هەر خەڵاتەکەی پێدەدات بە ئۆفلاین
                    if (txt) txt.innerText = "Congratulations! You won +" + randomReward.toLocaleString() + " coins!";
                    alert("Congratulations! You found " + randomReward.toLocaleString() + " ChubbyX coins! 🎉");
                });

                localStorage.setItem('chubby_coins', currentBalance);

                document.querySelectorAll('.chest').forEach(c => {
                    c.style.pointerEvents = "auto";
                    c.style.opacity = "1";
                });
            }, 800);
        }
    </script>

</body>
</html>
