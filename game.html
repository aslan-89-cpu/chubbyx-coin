<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChubbyX - Game Section</title>
    <!-- لۆدکردنی کتێبخانەی تێلێگرام مینی ئەپ -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }

        .game-container {
            background-color: #1f2833;
            border: 2px solid #45f3ff;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 20px rgba(69, 243, 255, 0.2);
            box-sizing: border-box;
        }

        h1 {
            color: #45f3ff;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .back-btn {
            display: inline-block;
            background: #15eff2;
            color: #0b0c10;
            border: none;
            padding: 12px 30px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            text-decoration: none;
            transition: background 0.2s;
            width: 80%;
            margin-top: 20px;
        }

        .back-btn:hover {
            background: #0bc3c6;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>ChubbyX Farm Game</h1>
        <p style="color: #c5c6c7;">لێرەدا دەتوانیت کۆدی یارییە نوێیەکەت یان سیستەمی فارمەکە دابنێیت.</p>
        
        <!-- ئەم دوگمەیە یاریزانەکە ڕاستەوخۆ دەباتەوە بۆ لاپەڕەی سەرەکی کارەکتەرەکە -->
        <button class="back-btn" onclick="goToMainMenu()">Back to Main</button>
    </div>

    <script>
        // لۆدبوونی تێلێگرام مینی ئەپ
        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        };

        // فەنکشنی گەڕانەوە بۆ لاپەڕەی سەرەکی کارەکتەرەکە
        function goToMainMenu() {
            window.location.href = "index.html"; 
        }
    </script>
</body>
</html>
