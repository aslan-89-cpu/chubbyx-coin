<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Mini Game</title>
    <style>
        body {
            background: #090514;
            color: white;
            font-family: sans-serif;
            margin: 0;
            padding: 15px;
            text-align: center;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        .game-header {
            font-size: 16px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        .score-color { color: #eab308; }
        .start-btn {
            background: #eab308;
            color: #090514;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            font-size: 15px;
            box-shadow: 0 4px 10px rgba(234, 179, 8, 0.3);
        }
        .game-area {
            position: relative;
            width: 100%;
            height: 70vh;
            background: rgba(255, 255, 255, 0.02);
            border: 2px dashed #7b2cbf;
            margin-top: 15px;
            border-radius: 12px;
            overflow: hidden;
            display: none;
        }
        .target-chubby {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            cursor: pointer;
            display: none;
            box-shadow: 0 0 15px #7b2cbf;
            -webkit-tap-highlight-color: transparent;
        }
    </style>
</head>
<body>

    <div class="game-header">
        Time: <span id="timer">30</span>s | Score: <span id="score" class="score-color">0</span>
    </div>
    
    <button id="startBtn" class="start-btn" onclick="startGame()">Start Catch Game</button>
    
    <div id="area" class="game-area">
        <img id="chubby" src="image_okKb6u.png.jpeg" class="target-chubby" onclick="hitChubby()">
    </div>

    <script>
        var interval, countdown;
        var timeLeft = 30;
        var gameScore = 0;
        var isRunning = false;

        function startGame() {
            if (isRunning) return;
            isRunning = true;
            timeLeft = 30;
            gameScore = 0;
            
            document.getElementById('timer').innerText = timeLeft;
            document.getElementById('score').innerText = gameScore;
            document.getElementById('startBtn').style.display = 'none';
            document.getElementById('area').style.display = 'block';
            
            moveChubby();
            interval = setInterval(moveChubby, 850); // جوڵانی کارەکتەرەکە
            
            countdown = setInterval(function() {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    endGame();
                }
            }, 1000);
        }

        function moveChubby() {
            var area = document.getElementById('area');
            var target = document.getElementById('chubby');
            
            var maxX = area.clientWidth - 70;
            var maxY = area.clientHeight - 70;
            
            var randomX = Math.floor(Math.random() * maxX);
            var randomY = Math.floor(Math.random() * maxY);
            
            target.style.left = randomX + 'px';
            target.style.top = randomY + 'px';
            target.style.display = 'block';
        }

        function hitChubby() {
            if (!isRunning) return;
            gameScore += 50; // زیادکردنی ٥٠ کوین بۆ هەر لێدانێک
            document.getElementById('score').innerText = gameScore;
            document.getElementById('chubby').style.display = 'none';
            moveChubby();
            
            // ناردنی خاڵەکان بۆ باڵانسی سەرەکی ناو فایلی index.html
            if (window.parent) {
                window.parent.postMessage({ type: 'ADD_COINS', amount: 50 }, '*');
            }
        }

        function endGame() {
            clearInterval(interval);
            clearInterval(countdown);
            isRunning = false;
            
            document.getElementById('chubby').style.display = 'none';
            document.getElementById('startBtn').style.display = 'inline-block';
            document.getElementById('startBtn').innerText = "Play Again";
            
            alert("Game Over! You earned " + gameScore + " CHUB coins!");
        }
    </script>
</body>
</html>
