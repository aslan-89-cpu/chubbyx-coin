<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChubbyX Game Hub</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .hub-box {
            background-color: #1f2833;
            border: 2px solid #45f3ff;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 20px rgba(69, 243, 255, 0.2);
            box-sizing: border-box;
        }
        h1 {
            color: #45f3ff;
            margin-bottom: 20px;
            text-transform: uppercase;
        }
        .coin-status {
            font-size: 18px;
            color: #c5c6c7;
            margin-bottom: 30px;
        }
        .menu-btn {
            display: block;
            width: 100%;
            background: #7c2cbf;
            color: #ffffff;
            border: 2px solid #45f3ff;
            padding: 15px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-decoration: none;
            margin-bottom: 15px;
            box-sizing: border-box;
            transition: background 0.2s;
        }
        .menu-btn:hover {
            background: #5a189a;
        }
    </style>
</head>
<body>

    <div class="hub-box">
        <h1>ChubbyX Game Hub</h1>
        
        <!-- لێرە کۆینی بەکارهێنەر پیشان دەدرێت کە لە لۆکاڵ ستۆریج پاشەکەوت کراوە -->
        <div class="coin-status">
            Your Coins: <span id="coin-count">0</span> 🪙
        </div>

        <!-- ئەم دوگمەیە بەکارهێنەر دەبات بۆ لاپەڕەی چەرخی بەختەکە -->
        <a href="spin.html" class="menu-btn">🎰 Play Lucky Spin</a>
        
        <!-- لێرە دەتوانیت دوگمەی تریش زیاد بکەیت بۆ بەشەکانی تری یارییەکەت -->
        <button class="menu-btn" style="background:#15eff2; color:#0b0c10; border:none;">🎮 Start Main Game</button>
    </div>

    <script>
        // چالاککردنی تێلێگرام مینی ئەپ
        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            
            // خوێندنەوەی ژمارەی کۆینەکان لە لۆکاڵ ستۆریج
            let coins = localStorage.getItem('chubby_coins') || 0;
            document.getElementById('coin-count').innerText = parseInt(coins).toLocaleString();
        };
    </script>
</body>
</html>
