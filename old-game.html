<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>chubbyX - Cyber Farm & Lucky Chests</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #1c1437 url('background.png.jpeg') no-repeat center top fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .farm-container {
            background-color: rgba(31, 20, 51, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid #45f3ff;
            border-radius: 25px;
            padding: 25px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 30px rgba(69, 243, 255, 0.3);
        }
        h1 {
            color: #45f3ff;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            font-size: 26px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(69, 243, 255, 0.5);
        }
        .subtitle {
            font-size: 13px;
            color: #c5c6c7;
            margin-bottom: 20px;
        }
        .balance-box {
            background: rgba(11, 12, 16, 0.8);
            border: 2px solid #7c2cbf;
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 20px;
        }
        .balance-label {
            font-size: 12px;
            color: #c5c6c7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .balance-value {
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            margin-top: 5px;
        }
        .character-box {
            width: 110px;
            height: 110px;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #15eff2;
            border-radius: 50%;
            overflow: hidden;
            background: rgba(11, 12, 16, 0.6);
        }
        .spinning-character {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }
        .pool-text {
            font-size: 22px;
            font-weight: bold;
            color: #15eff2;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        .upgrade-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .upgrade-card {
            background-color: rgba(11, 12, 16, 0.8);
            border: 1px solid #7c2cbf;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .upgrade-card.available {
            border-color: #45f3ff;
        }
        .up-title {
            font-size: 11px;
            font-weight: bold;
            color: #45f3ff;
            text-transform: uppercase;
        }
        .up-desc {
            font-size: 13px;
            margin: 4px 0;
            color: #ffffff;
        }
        .up-cost {
            font-size: 11px;
            color: #e5b323;
            font-weight: bold;
        }

        /* 📦 ڕێکخستنی شیکی سندوقەکان 📦 */
        .chests-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            margin: 20px 0 10px 0;
        }
        .lucky-chest {
            background: rgba(11, 12, 16, 0.9);
            border: 2px solid #7c2cbf;
            border-radius: 15px;
            height: 100px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            box-shadow: 0 4px 10px rgba(0,0,0,0.4);
        }
        .lucky-chest:hover {
            transform: scale(1.05);
            border-color: #45f3ff;
        }
        .chest-icon {
            font-size: 32px;
            margin-bottom: 5px;
            transition: transform 0.3s;
        }
        .chest-label {
            font-size: 11px;
            color: #c5c6c7;
            font-weight: bold;
            text-transform: uppercase;
        }
        .lucky-chest.opened {
            background: #110b29;
            border-color: #e5b323;
            cursor: default;
            transform: none;
        }
        .lucky-chest.opened .chest-icon {
            transform: scale(1.1);
        }
        .lucky-chest.opened .chest-label {
            color: #ffffff;
            font-size: 13px;
        }

        .claim-btn {
            display: block;
            width: 100%;
            background-color: #7c2cbf;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 0 15px rgba(124, 44, 191, 0.4);
        }
        .back-btn {
            display: block;
            width: 100%;
            background-color: #15eff2;
            color: #0b0c10;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 12px;
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="farm-container">
        <h1>CHUBBYX CYBER FARM</h1>
        <div class="subtitle">Upgrade your grid & harvest assets</div>
        
        <div class="balance-box">
            <div class="balance-label">Total Balance</div>
            <div class="balance-value"><span id="total-coins">0</span> X</div>
        </div>

        <div class="character-box">
            <img src="image.png.jpeg" class="spinning-character" alt="Character" onerror="this.src='background.png.jpeg'">
        </div>

        <div style="font-size: 13px; color: #c5c6c7;">Farming Pool</div>
        <div class="pool-text"><span id="farm-pool">0.00</span> / <span id="max-capacity">100</span> X</div>

        <div class="upgrade-grid">
            <div class="upgrade-card" id="up-speed-card" onclick="buyUpgrade('speed')">
                <div class="up-title">⚡ Speed Rate</div>
                <div class="up-desc">Lvl <span id="speed-lvl">1</span> (+<span id="speed-val">1</span>/s)</div>
                <div class="up-cost">Cost: <span id="speed-cost">200</span> X</div>
            </div>
            <div class="upgrade-card" id="up-cap-card" onclick="buyUpgrade('capacity')">
                <div class="up-title">🔋 Tank Cap</div>
                <div class="up-desc">Lvl <span id="cap-lvl">1</span></div>
                <div class="up-cost">Cost: <span id="cap-cost">300</span> X</div>
            </div>
        </div>

        <!-- 📦 بەشی سندوقەکانی بەخت 📦 -->
        <div class="balance-box" style="margin-top: 20px; padding: 15px 10px;">
            <div class="balance-label" id="chest-status-title">LUCKY CHEST OPENER</div>
            
            <div class="chests-grid">
                <div class="lucky-chest" id="chest0" onclick="openChest(0)">
                    <div class="chest-icon" id="icon0">📦</div>
                    <div class="chest-label" id="label0">Chest 1</div>
                </div>
                <div class="lucky-chest" id="chest1" onclick="openChest(1)">
                    <div class="chest-icon" id="icon1">📦</div>
                    <div class="chest-label" id="label1">Chest 2</div>
                </div>
                <div class="lucky-chest" id="chest2" onclick="openChest(2)">
                    <div class="chest-icon" id="icon2">📦</div>
                    <div class="chest-label" id="label2">Chest 3</div>
                </div>
            </div>

            <div id="chest-cost-msg" style="font-size: 12px; color: #e5b323; font-weight: bold; margin-top: 5px;">Loading settings...</div>
        </div>

        <button class="claim-btn" onclick="claimFarmedCoins()">CLAIM COINS</button>
        <button class="back-btn" onclick="goToMainMenu()">BACK TO MAIN</button>
    </div>

    <script>
        var totalCoins = parseInt(localStorage.getItem('chubby_coins')) || 0;
        var farmPool = parseFloat(localStorage.getItem('farm_pool')) || 0.0;
        var speedLvl = parseInt(localStorage.getItem('farm_speed_lvl')) || 1;
        var capLvl = parseInt(localStorage.getItem('farm_cap_lvl')) || 1;

        var userType = localStorage.getItem('user_type') || "VIP"; 
        var vipSpinsCount = parseInt(localStorage.getItem('vip_spins_count')) || 0;
        var lastNormalSpinDate = localStorage.getItem('last_normal_spin_date') || "";

        // چاککردنی کۆدەکە: لێرەدا نرخەکان بە دروستی دانران بۆ ڕێگری لە بلۆکبوون
        var prizes =;
        var isGameLocked = false;

        function getSpeedProd() { return speedLvl * 1; }
        function getMaxCap() { return capLvl * 100; }
        function getUpgradeCost(type, lvl) { return type === 'speed' ? lvl * 200 : lvl * 300; }

        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            updateUI();
            checkChestStatus();
            setInterval(executeFarmingGrid, 100);
        };
