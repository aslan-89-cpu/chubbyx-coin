<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX - Lucky Spin</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #1c1437 url('background.png.jpeg') no-repeat center top fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .spin-container {
            background-color: rgba(31, 20, 51, 0.9);
            backdrop-filter: blur(8px);
            border: 2px solid #45f3ff;
            border-radius: 25px;
            padding: 25px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 30px rgba(69, 243, 255, 0.3);
        }
        h1 {
            color: #45f3ff;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            font-size: 24px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(69, 243, 255, 0.5);
        }
        .subtitle {
            font-size: 13px;
            color: #c5c6c7;
            margin-bottom: 20px;
        }
        .balance-box {
            background: rgba(11, 12, 16, 0.8);
            border: 2px solid #7c2cbf;
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 25px;
        }
        .balance-label {
            font-size: 12px;
            color: #c5c6c7;
            text-transform: uppercase;
        }
        .balance-value {
            font-size: 26px;
            font-weight: bold;
            color: #ffffff;
            margin-top: 5px;
        }
        .wheel-wrapper {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 0 auto 25px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .wheel-pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 25px;
            height: 25px;
            background-color: #ff007f;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 10;
        }
        .wheel-img {
            width: 180px;
            height: 180px;
            object-fit: cover;
            border-radius: 50%;
            border: 5px solid #7c2cbf;
            background-color: #1c1437;
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.3, 1);
        }
        .btn-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 10px;
        }
        .spin-btn {
            width: 100%;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.2s;
        }
        .normal-btn {
            background-color: #7c2cbf;
            box-shadow: 0 0 15px rgba(124, 44, 191, 0.4);
        }
        .vip-btn {
            background: linear-gradient(45deg, #e5b323, #ff007f);
            box-shadow: 0 0 15px rgba(229, 179, 35, 0.4);
        }
        .spin-btn:disabled {
            background: #4a3b63 !important;
            box-shadow: none !important;
            cursor: not-allowed;
            opacity: 0.5;
        }
        .back-btn {
            display: block;
            width: 100%;
            background-color: #15eff2;
            color: #0b0c10;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 12px;
            text-align: center;
            text-decoration: none;
            text-transform: uppercase;
        }
        .reward-popup {
            color: #e5b323;
            font-weight: bold;
            font-size: 17px;
            margin-top: 10px;
            min-height: 24px;
            text-shadow: 0 0 5px rgba(229, 179, 35, 0.3);
        }
    </style>
</head>
<body>
    <div class="spin-container">
        <h1>LUCKY SPIN</h1>
        <div class="subtitle">Choose your wheel and win rewards</div>
        
        <div class="balance-box">
            <div class="balance-label">Total Balance</div>
            <div class="balance-value"><span id="total-coins">0</span> X</div>
        </div>

        <div class="wheel-wrapper">
            <div class="wheel-pointer"></div>
            <img src="image.png.jpeg" id="wheel" class="wheel-img" alt="Wheel">
        </div>

        <div class="reward-popup" id="reward-text"></div>

        <div class="btn-group">
            <button class="spin-btn normal-btn" id="normal-button" onclick="startSpinning('normal')">⚡ Normal Spin (300-2K)</button>
            <button class="spin-btn vip-btn" id="vip-button" onclick="startSpinning('vip')">👑 VIP Spin (5K-50K)</button>
        </div>
        
        <button class="back-btn" onclick="goToMainMenu()">BACK TO MAIN</button>
    </div>

    <script>
        const tg = window.Telegram?.WebApp;
        const userId = tg?.initDataUnsafe?.user?.id || 0;
        const serverUrl = "https://railway.app";

        var totalCoins = parseInt(localStorage.getItem('chubby_coins')) || 0;
        var isSpinning = false;

        window.onload = async function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            
            if (userId) {
                try {
                    const response = await fetch(${serverUrl}/api/user-stats?userId=${userId});
                    const data = await response.json();
                    if (data.success) {
                        totalCoins = data.balance;
                        localStorage.setItem('chubby_coins', totalCoins);
                    }
                } catch (err) { console.error("Error loading stats:", err); }
            }
            document.getElementById('total-coins').innerText = totalCoins.toLocaleString();
        };

        function startSpinning(type) {
            if (isSpinning) return;
            isSpinning = true;
            
            document.getElementById('normal-button').disabled = true;
            document.getElementById('vip-button').disabled = true;
            document.getElementById('reward-text').innerText = "🔮 Spinning the wheel...";

            const randomDegree = Math.floor(Math.random() * 360) + 2160; 
            const wheel = document.getElementById('wheel');
            wheel.style.transform = rotate(${randomDegree}deg);

            // لێرەدا بڕی خەڵاتەکانم بە تەواوی بۆ چاککردوویت
            let rewards = [];
            if (type === 'normal') {
                rewards =;
            } else if (type === 'vip') {
                rewards =;
            }
            
            const finalReward = rewards[Math.floor(Math.random() * rewards.length)];

            setTimeout(() => {
                isSpinning = false;
                document.getElementById('normal-button').disabled = false;
                document.getElementById('vip-button').disabled = false;
                
                if (type === 'vip') {
                    document.getElementById('reward-text').innerText = 🔥 JACKPOT VIP: +${finalReward.toLocaleString()} X!;
                } else {
                    document.getElementById('reward-text').innerText = 🎉 You Won: +${finalReward.toLocaleString()} X!;
                }
                
                syncBalanceWithServer(finalReward);
            }, 4000);
        }

        async function syncBalanceWithServer(scoreToAdd) {
            if (!userId) {
                totalCoins += scoreToAdd;
                localStorage.setItem('chubby_coins', totalCoins);
                document.getElementById('total-coins').innerText = totalCoins.toLocaleString();
                return;
            }
            try {
                const response = await fetch(${serverUrl}/api/save-score, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ userId: userId, score: scoreToAdd })
                });
                const data = await response.json();
                if (data.success) {
                    totalCoins = data.newBalance;
                    localStorage.setItem('chubby_coins', totalCoins);
                    document.getElementById('total-coins').innerText = totalCoins.toLocaleString();
                }
            } catch (err) { console.error("Error syncing score:", err); }
        }

        function goToMainMenu() {
            window.location.href = "index.html";
        }
    </script>
</body>
</html>
