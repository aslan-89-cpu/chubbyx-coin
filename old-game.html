<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telegram Mini Game - Spin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: sans-serif; }
        
        .game-container {
            width: 100vw;
            height: 100vh;
            background-image: url('Background.png.jpeg');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .game-image {
            width: 140px;
            height: 140px;
            object-fit: contain;
            margin-bottom: 20px;
            touch-action: manipulation;
        }
        .btn {
            background-color: #ffcc00;
            color: #000;
            font-weight: bold;
            padding: 12px 25px;
            margin: 8px;
            border: none;
            border-radius: 25px;
            font-size: 15px;
            cursor: pointer;
            touch-action: manipulation;
            pointer-events: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            width: 220px;
        }
        .btn:active { transform: scale(0.95); }
        .vip-btn { background-color: #9c27b0; color: #fff; }
        .back-btn { background-color: #f44336; color: #fff; }
        
        #status {
            color: #fff;
            margin-top: 15px;
            font-size: 14px;
            text-align: center;
            background: rgba(0,0,0,0.6);
            padding: 8px 15px;
            border-radius: 10px;
            max-width: 90%;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <img src="image.png.jpeg" alt="Game Image" class="game-image">

        <button class="btn" onclick="spinNormal()">Normal Spin (500 - 4000)</button>
        <button class="btn vip-btn" onclick="spinVip()">VIP Spin (6000 - 50000)</button>
        <button class="btn back-btn" onclick="goBackMenu()">Back Menu</button>

        <div id="status">Ready to spin!</div>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        tg.BackButton.show();
        tg.BackButton.onClick(() => {
            goBackMenu();
        });

        function goBackMenu() {
            window.location.href = 'index.html'; 
        }

        // نۆرمال: ڕۆژی یەک جار، بڕ لە نێوان 500 بۆ 4000
        function spinNormal() {
            let lastSpin = localStorage.getItem('last_normal_spin');
            let today = new Date().toDateString();

            if (lastSpin === today) {
                document.getElementById('status').innerText = "تۆ ئەمڕۆ سپینی نۆرمالت بەکارهێناوە! سبەی تاقی بکەرەوە.";
                return;
            }

            // دروستکردنی بڕێکی هەڕەمەکی لە نێوان 500 بۆ 4000 بە شێوازێکی تەواو
            let reward = Math.floor(Math.random() * (4000 - 500 + 1)) + 500;

            localStorage.setItem('last_normal_spin', today);
            document.getElementById('status').innerText = سپینی نۆرمال سەرکەوتوو بوو! بڕی ${reward} بەدەستهێنرا.;
            // لێرەدا کۆدی داتابەیسی خۆت دابنە بۆ زیادکردنی reward بۆ یاریزانەکە
        }

        // ڤی ئای پی: سیستەمی یەکەم (0.5، 0.75، 1) گۆڕدرا بۆ: یەکەم جار 6000، دووەم جار 28000، سێیەم جار 50000 و پاشان دووبارە دەستپێدەکاتەوە
        function spinVip() {
            let vipStep = parseInt(localStorage.getItem('vip_step')) || 1;
            let lastVipDate = localStorage.getItem('last_vip_date');
            let today = new Date().toDateString();

            if (lastVipDate === today) {
                document.getElementById('status').innerText = "تۆ ئەمڕۆ سپینی VIP ت بەکارهێناوە!";
                return;
            }

            let reward = 0;
            if (vipStep === 1) {
                reward = 6000;   // جاری یەکەم
            } else if (vipStep === 2) {
                reward = 28000;  // جاری دووەم (ڕێژەی ناوەڕاست)
            } else if (vipStep === 3) {
                reward = 50000;  // جاری سێیەم
            }

            document.getElementById('status').innerText = سپینی VIP سەرکەوتوو بوو! بڕی ${reward} وەرگیرا.;

            let nextStep = vipStep + 1;
            if (nextStep > 3) {
                nextStep = 1; // دەگەڕێتەوە سەر 6000
            }

            localStorage.setItem('vip_step', nextStep);
            localStorage.setItem('last_vip_date', today);
            // لێرەدا کۆدی داتابەیسی خۆت دابنە بۆ ناردنی بڕی reward بۆ یاریزانەکە
        }
    </script>
</body>
</html>
