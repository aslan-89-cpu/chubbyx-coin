<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>chubbyX - Cyber Farm</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #1c1437 url('background.png.jpeg') no-repeat center top fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .farm-container {
            background-color: rgba(31, 20, 51, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid #45f3ff;
            border-radius: 25px;
            padding: 25px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 30px rgba(69, 243, 255, 0.3);
        }
        h1 {
            color: #45f3ff;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            font-size: 26px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(69, 243, 255, 0.5);
        }
        .subtitle {
            font-size: 13px;
            color: #c5c6c7;
            margin-bottom: 20px;
        }
        .balance-box {
            background: rgba(11, 12, 16, 0.8);
            border: 2px solid #7c2cbf;
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 20px;
        }
        .balance-label {
            font-size: 12px;
            color: #c5c6c7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .balance-value {
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            margin-top: 5px;
        }
        
        /* چاککردنی بازنەی وێنەی ناوەڕاست بۆ ئەوەی خڕ بێت و تێکنەچێت */
        .character-box {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 3px solid #15eff2;
            border-radius: 50%;
            overflow: hidden;
            background: rgba(11, 12, 16, 0.6);
            box-shadow: 0 0 15px rgba(21, 239, 242, 0.4);
        }
        .spinning-character {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* ستایلی فیزیکی و گرافیکی عەجەلەکە */
        .wheel-wrapper {
            position: relative;
            width: 240px;
            height: 240px;
            margin: 15px auto;
        }
        .wheel-pointer {
            position: absolute;
            top: -12px;
            left: 50%;
            transform: translateX(-50%);
            width: 26px;
            height: 26px;
            background: #ff0055;
            clip-path: polygon(50% 100%, 0 0, 100% 0);
            z-index: 10;
        }
        .wheel-canvas {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid #45f3ff;
            box-shadow: 0 0 20px rgba(69, 243, 255, 0.5);
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1);
            background: #0b0c10;
        }

        .pool-text {
            font-size: 22px;
            font-weight: bold;
            color: #15eff2;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        .upgrade-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .upgrade-card {
            background-color: rgba(11, 12, 16, 0.8);
            border: 1px solid #7c2cbf;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .upgrade-card.available {
            border-color: #45f3ff;
        }
        .up-title {
            font-size: 11px;
            font-weight: bold;
            color: #45f3ff;
            text-transform: uppercase;
        }
        .up-desc {
            font-size: 13px;
            margin: 4px 0;
            color: #ffffff;
        }
        .up-cost {
            font-size: 11px;
            color: #e5b323;
            font-weight: bold;
        }
        .claim-btn {
            display: block;
            width: 100%;
            background-color: #7c2cbf;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 0 15px rgba(124, 44, 191, 0.4);
        }
        .back-btn {
            display: block;
            width: 100%;
            background-color: #15eff2;
            color: #0b0c10;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 12px;
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="farm-container">
        <h1>CHUBBYX CYBER FARM</h1>
        <div class="subtitle">Upgrade your grid & harvest assets</div>
        
        <div class="balance-box">
            <div class="balance-label">Total Balance</div>
            <div class="balance-value"><span id="total-coins">0</span> X</div>
        </div>

        <div class="character-box">
            <img src="image_okkB6u.png.jpeg" class="spinning-character" alt="Character">
        </div>

        <div style="font-size: 13px; color: #c5c6c7;">Farming Pool</div>
        <div class="pool-text"><span id="farm-pool">0.00</span> / <span id="max-capacity">100</span> X</div>

        <div class="upgrade-grid">
            <div class="upgrade-card" id="up-speed-card" onclick="buyUpgrade('speed')">
                <div class="up-title">⚡ Speed Rate</div>
                <div class="up-desc">Lvl <span id="speed-lvl">1</span> (+<span id="speed-val">1</span>/s)</div>
                <div class="up-cost">Cost: <span id="speed-cost">200</span> X</div>
            </div>
            <div class="upgrade-card" id="up-cap-card" onclick="buyUpgrade('capacity')">
                <div class="up-title">🔋 Tank Cap</div>
                <div class="up-desc">Lvl <span id="cap-lvl">1</span></div>
                <div class="up-cost">Cost: <span id="cap-cost">300</span> X</div>
            </div>
        </div>

        <!-- عەجەلەی خەڵاتەکان لەناو خودی فایلی سەرەکیدا -->
        <div class="balance-box" style="margin-top: 20px; padding: 15px 10px;">
            <div class="balance-label">Daily Lucky Spin</div>
            
            <div class="wheel-wrapper">
                <div class="wheel-pointer"></div>
                <canvas id="wheelCanvas" class="wheel-canvas" width="300" height="300"></canvas>
            </div>

            <button id="spin-btn" class="claim-btn" style="background-color: #e5b323; color: #0b0c10; margin-top: 5px;" onclick="startDailySpin()">SPIN NOW (FREE)</button>
            <div id="spin-timer" style="font-size: 11px; color: #ef4444; margin-top: 8px; display: none;">You already used your spin! Come back tomorrow.</div>
        </div>

        <button class="claim-btn" onclick="claimFarmedCoins()">CLAIM COINS</button>
        <button class="back-btn" onclick="goToMainMenu()">BACK TO MAIN</button>
    </div>

    <script>
        var totalCoins = parseInt(localStorage.getItem('chubby_coins')) || 0;
        var farmPool = parseFloat(localStorage.getItem('farm_pool')) || 0.0;
        
        var speedLvl = parseInt(localStorage.getItem('farm_speed_lvl')) || 1;
        var capLvl = parseInt(localStorage.getItem('farm_cap_lvl')) || 1;

        // مەرجەکانی تایبەت بە سپینی ڕۆژانە
        var userType = localStorage.getItem('user_type') || "VIP"; // دەتوانیت بیگوڕیت بۆ Normal یان VIP
        var dailySpinsUsed = parseInt(localStorage.getItem('daily_spins_used')) || 0;
        var lastSpinDate = localStorage.getItem('last_spin_date') || "";

        // خەڵاتەکان و ڕەنگەکانی عەجەلەکە کە داوات کردبوو
        const prizes =; 
        const colors = ["#7c2cbf", "#110b29", "#15eff2", "#0b0c10", "#e5b323"];
        let isSpinning = false;
        let currentRotation = 0;

        function getSpeedProd() { return speedLvl * 1; }
        function getMaxCap() { return capLvl * 100; }
        function getUpgradeCost(type, lvl) {
            return type === 'speed' ? lvl * 200 : lvl * 300;
        }

        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            drawWheel();
            updateUI();
            checkSpinStatus();
            setInterval(executeFarmingGrid, 100);
        };

        // لۆژیکی کێشانی عەجەلەکە لەسەر شاشە
        function drawWheel() {
            const canvas = document.getElementById("wheelCanvas");
            const ctx = canvas.getContext("2d");
            const numSegments = prizes.length;
            const anglePerSegment = (2 * Math.PI) / numSegments;
            const radius = canvas.width / 2;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            for (let i = 0; i < numSegments; i++) {
                ctx.beginPath();
                ctx.moveTo(radius, radius);
                ctx.arc(radius, radius, radius - 5, i * anglePerSegment, (i + 1) * anglePerSegment);
                ctx.fillStyle = colors[i % colors.length];
