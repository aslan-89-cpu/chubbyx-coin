<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>chubbyX - Cyber Farm</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #1c1437 url('background.png.jpeg') no-repeat center top fixed;
            background-size: cover;
            color: #ffffff;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .farm-container {
            background-color: rgba(31, 20, 51, 0.85);
            backdrop-filter: blur(8px);
            border: 2px solid #45f3ff;
            border-radius: 25px;
            padding: 25px;
            text-align: center;
            max-width: 400px;
            width: 100%;
            box-shadow: 0 0 30px rgba(69, 243, 255, 0.3);
        }
        h1 {
            color: #45f3ff;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            font-size: 26px;
            letter-spacing: 1px;
            text-shadow: 0 0 10px rgba(69, 243, 255, 0.5);
        }
        .subtitle {
            font-size: 13px;
            color: #c5c6c7;
            margin-bottom: 20px;
        }
        .balance-box {
            background: rgba(11, 12, 16, 0.8);
            border: 2px solid #7c2cbf;
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 20px;
        }
        .balance-label {
            font-size: 12px;
            color: #c5c6c7;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .balance-value {
            font-size: 28px;
            font-weight: bold;
            color: #ffffff;
            margin-top: 5px;
        }
        .character-box {
            width: 120px;
            height: 120px;
            margin: 0 auto 15px auto;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .spinning-character {
            width: 100px;
            height: 100px;
            object-fit: contain;
            border-radius: 50%;
            animation: spinToken 4s linear infinite;
        }
        @keyframes spinToken {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }
        .pool-text {
            font-size: 22px;
            font-weight: bold;
            color: #15eff2;
            margin-top: 5px;
            margin-bottom: 15px;
        }
        .upgrade-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-top: 15px;
        }
        .upgrade-card {
            background-color: rgba(11, 12, 16, 0.8);
            border: 1px solid #7c2cbf;
            border-radius: 12px;
            padding: 12px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .upgrade-card.available {
            border-color: #45f3ff;
        }
        .up-title {
            font-size: 11px;
            font-weight: bold;
            color: #45f3ff;
            text-transform: uppercase;
        }
        .up-desc {
            font-size: 13px;
            margin: 4px 0;
            color: #ffffff;
        }
        .up-cost {
            font-size: 11px;
            color: #e5b323;
            font-weight: bold;
        }
        .claim-btn {
            display: block;
            width: 100%;
            background-color: #7c2cbf;
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 20px;
            box-shadow: 0 0 15px rgba(124, 44, 191, 0.4);
        }
        .back-btn {
            display: block;
            width: 100%;
            background-color: #15eff2;
            color: #0b0c10;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            margin-top: 12px;
            text-align: center;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="farm-container">
        <h1>CHUBBYX CYBER FARM</h1>
        <div class="subtitle">Upgrade your grid & harvest assets</div>
        
        <div class="balance-box">
            <div class="balance-label">Total Balance</div>
            <div class="balance-value"><span id="total-coins">0</span> X</div>
        </div>

        <div class="character-box">
            <img src="background.png.jpeg" class="spinning-character" alt="Character">
        </div>

        <div style="font-size: 13px; color: #c5c6c7;">Farming Pool</div>
        <div class="pool-text"><span id="farm-pool">0.00</span> / <span id="max-capacity">100</span> X</div>

        <div class="upgrade-grid">
            <div class="upgrade-card" id="up-speed-card" onclick="buyUpgrade('speed')">
                <div class="up-title">⚡ Speed Rate</div>
                <div class="up-desc">Lvl <span id="speed-lvl">1</span> (+<span id="speed-val">1</span>/s)</div>
                <div class="up-cost">Cost: <span id="speed-cost">200</span> X</div>
            </div>
            <div class="upgrade-card" id="up-cap-card" onclick="buyUpgrade('capacity')">
                <div class="up-title">🔋 Tank Cap</div>
                <div class="up-desc">Lvl <span id="cap-lvl">1</span></div>
                <div class="up-cost">Cost: <span id="cap-cost">300</span> X</div>
            </div>
        </div>

        <!-- DAILY LUCKY SPIN BOX -->
        <div class="balance-box" style="margin-top: 20px;">
            <div class="balance-label">Daily Lucky Spin</div>
            <button id="spin-btn" class="claim-btn" style="background-color: #e5b323; color: #0b0c10; margin-top: 10px;" onclick="startDailySpin()">SPIN NOW</button>
            <div id="spin-timer" style="font-size: 11px; color: #ef4444; margin-top: 6px; display: none;">You already used your free spin today!</div>
        </div>

        <button class="claim-btn" onclick="claimFarmedCoins()">CLAIM COINS</button>
        <button class="back-btn" onclick="goToMainMenu()">BACK TO MAIN</button>
    </div>

    <script>
        var totalCoins = parseInt(localStorage.getItem('chubby_coins')) || 0;
        var farmPool = parseFloat(localStorage.getItem('farm_pool')) || 0.0;
        
        var speedLvl = parseInt(localStorage.getItem('farm_speed_lvl')) || 1;
        var capLvl = parseInt(localStorage.getItem('farm_cap_lvl')) || 1;

        // لیستی خەڵاتەکانی سەر سپینەکە کە داوات کردبوون
        var prizes =;

        // لۆژیکی بەکارهێنەران: Normal تەنها ڕۆژی ١ جار، VIP بەردەوامە
        var userType = localStorage.getItem('user_type') || "VIP"; // دەتوانی لێرە بیگۆڕی بۆ Normal یان VIP
        var vipSpinsCount = parseInt(localStorage.getItem('vip_spins_count')) || 0;
        var lastNormalSpinDate = localStorage.getItem('last_normal_spin_date') || "";

        function getSpeedProd() { return speedLvl * 1; }
        function getMaxCap() { return capLvl * 100; }
        function getUpgradeCost(type, lvl) {
            return type === 'speed' ? lvl * 200 : lvl * 300;
        }

        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
            updateUI();
            checkSpinStatus();
            setInterval(executeFarmingGrid, 100);
        };

        function executeFarmingGrid() {
            var max = getMaxCap();
            if (farmPool < max) {
                var productionPerTick = (getSpeedProd() / 10);
                farmPool = Math.min(max, farmPool + productionPerTick);
                document.getElementById('farm-pool').innerText = farmPool.toFixed(2);
                localStorage.setItem('farm_pool', farmPool);
            }
            refreshUpgradeCardStatus();
        }

        function updateUI() {
            document.getElementById('total-coins').innerText = totalCoins.toLocaleString();
            document.getElementById('farm-pool').innerText = farmPool.toFixed(2);
            document.getElementById('max-capacity').innerText = getMaxCap();
            
            document.getElementById('speed-lvl').innerText = speedLvl;
            document.getElementById('speed-val').innerText = getSpeedProd();
            document.getElementById('speed-cost').innerText = getUpgradeCost('speed', speedLvl);
            
            document.getElementById('cap-lvl').innerText = capLvl;
            document.getElementById('cap-cost').innerText = getUpgradeCost('capacity', capLvl);
        }

        function refreshUpgradeCardStatus() {
            toggleCardClass('up-speed-card', totalCoins >= getUpgradeCost('speed', speedLvl));
            toggleCardClass('up-cap-card', totalCoins >= getUpgradeCost('capacity', capLvl));
        }

        function toggleCardClass(id, isAvailable) {
            var el = document.getElementById(id);
            if (el) {
                if (isAvailable) el.classList.add('available');
                else el.classList.remove('available');
            }
        }

        function buyUpgrade(type) {
            if (type === 'speed') {
                var costSpeed = getUpgradeCost('speed', speedLvl);
                if (totalCoins >= costSpeed) {
                    totalCoins -= costSpeed;
                    speedLvl++;
