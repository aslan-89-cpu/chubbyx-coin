
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ChubbyX Hub</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://www.unpkg.com/web-animations-js@latest/web-animations.min.js"></script>
<script src="https://unpkg.com/@tonconnect/ui@5.0.1/dist/tonconnect-ui.min.js"></script>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{background:#130f26;color:#fff;display:flex;flex-direction:column;align-items:center;height:100vh;overflow:hidden;user-select:none;-webkit-user-select:none}
#home-layout{display:flex;flex-direction:column;align-items:center;width:100%;height:100%;background:url('background.jpg') no-repeat center top -120px;background-size:cover}
.header-bar{width:100%;display:flex;justify-content:space-between;align-items:center;padding:20px 20px 0;z-index:2500}
.btn-top{background:rgba(255,255,255,.1);backdrop-filter:blur(5px);border:1px solid rgba(255,255,255,.2);color:white;padding:8px 16px;border-radius:20px;font-size:14px;font-weight:bold;cursor:pointer}
.header{margin-top:25px;text-align:center;z-index:10;pointer-events:none}
.header div{font-size:14px;opacity:.8;letter-spacing:1px}
.header h1{font-size:38px;font-weight:bold;margin-top:5px}
.coin-container{flex:1;display:flex;justify-content:center;align-items:center;width:100%;position:relative;z-index:5}
.transparent-tap-zone{position:absolute;top:25%;width:270px;height:270px;border-radius:50%;background:transparent;cursor:pointer;-webkit-tap-highlight-color:transparent;z-index:999;touch-action:manipulation;transition:transform .05s ease}
.transparent-tap-zone:active{transform:scale(.93)!important}
.floating-text{position:absolute;color:#eeb308;font-weight:bold;font-size:28px;pointer-events:none;z-index:1000;animation:FloatUp .6s ease-out forwards;text-shadow:0 5px 10px rgba(234,179,8,.3)}
@keyframes FloatUp{0%{opacity:1;transform:translateY(0) scale(1)}100%{opacity:0;transform:translateY(-120px) scale(1.3)}}
.dynamic-page{display:none;position:fixed;top:0;left:0;width:100vw;height:calc(100vh - 85px);z-index:1500;background:#130f26;padding:40px 20px 20px;flex-direction:column;align-items:center}
.dynamic-page.active{display:flex}
.page-title{font-size:26px;font-weight:bold;margin-bottom:25px;color:#eeb308;margin-top:20px}
.page-content{width:100%;flex:1;overflow-y:auto}
.bottom-nav{width:100%;border-top:1px solid rgba(255,255,255,.1);background:#05030a;display:flex;position:fixed;bottom:0;padding:15px 15px calc(15px + env(safe-area-inset-bottom));z-index:2000}
.nav-link{flex:1;text-align:center;font-size:13px;color:#666;text-decoration:none;cursor:pointer;display:flex;flex-direction:column;align-items:center}
.nav-link.active{color:#eeb308;font-weight:bold}
.nav-icon{font-size:20px;margin-bottom:4px}
.task-card{background:rgba(255,255,255,.06);padding:16px;border-radius:14px;margin-bottom:12px;display:flex;justify-content:space-between;align-items:center}
.task-btn{background:#eeb308;color:#000;border:none;padding:10px 18px;border-radius:10px;font-weight:bold;cursor:pointer}
.cx-card{width:100%;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.08);border-radius:16px;padding:20px;margin-bottom:14px;text-align:center}
.cx-card h3{color:#fff;margin-bottom:12px;font-size:19px}
.cx-card p{color:#c9c5d6;line-height:1.6;margin-bottom:15px}
.cx-btn{width:100%;border:none;background:#eeb308;color:#130f26;font-size:15px;font-weight:bold;border-radius:11px;padding:13px 16px;margin-top:8px;cursor:pointer}
.cx-btn:disabled{opacity:.6;cursor:not-allowed}
.cx-message{font-size:13px;margin-top:12px;overflow-wrap:anywhere}
.cx-number{font-size:32px;font-weight:bold;color:#eeb308;margin:10px 0 18px}
#balance-sync-message{font-size:12px!important;margin-top:5px;color:#eeb308;letter-spacing:0!important}
</style>
</head>
<body>

<div id="home-layout">
    <div class="header-bar">
        <button class="btn-top" onclick="switchPage('menu')">≡ Menu</button>
        <button class="btn-top" onclick="switchPage('airdrop')">🎁 Airdrop</button>
    </div>
    <div class="header">
        <div>CHUBBYX BALANCE</div>
        <h1 id="main-score">0</h1>
        <div id="balance-sync-message">Connecting...</div>
    </div>
    <div class="coin-container" id="coincontainer">
        <div class="transparent-tap-zone" id="clickcoin" aria-label="Tap to earn coins"></div>
    </div>
</div>

<div id="tasks-page" class="dynamic-page"></div>
<div id="invites-page" class="dynamic-page"></div>
<div id="games-page" class="dynamic-page"></div>
<div id="wallet-page" class="dynamic-page"></div>
<div id="menu-page" class="dynamic-page"></div>
<div id="airdrop-page" class="dynamic-page"></div>

<div class="bottom-nav">
    <div class="nav-link" onclick="switchPage('tasks',this)"><span class="nav-icon">📋</span>Tasks</div>
    <div class="nav-link" onclick="switchPage('invites',this)"><span class="nav-icon">👥</span>Invites</div>
    <div class="nav-link active" id="default-nav" onclick="switchPage('home',this)"><span class="nav-icon">🏠</span>Home</div>
    <div class="nav-link" onclick="switchPage('games',this)"><span class="nav-icon">🎮</span>Games</div>
    <div class="nav-link" onclick="switchPage('wallet',this)"><span class="nav-icon">💎</span>Wallet</div>
</div>

<script>
(function(){
"use strict";

const API="https://chubbyx-server.aslan89aslan1.workers.dev";
const tg=window.Telegram?.WebApp||null;
if(tg){tg.ready();tg.expand();}

const score=document.getElementById("main-score");
const tap=document.getElementById("clickcoin");
const container=document.getElementById("coincontainer");
const status=document.getElementById("balance-sync-message");

let count=Number.parseInt(localStorage.getItem("chubby_coins")||"0",10);
if(!Number.isFinite(count)||count<0)count=0;
score.textContent=count.toLocaleString();

let serverReady=false;
let syncPromise=null;
let pendingTaps=0;
let processing=false;

function showCoins(value){
    const n=Number(value);
    if(!Number.isFinite(n)||n<0)return;
    count=Math.floor(n);
    score.textContent=count.toLocaleString();
    localStorage.setItem("chubby_coins",String(count));
}

async function apiPost(path){
    if(!tg||!tg.initData)throw new Error("Open ChubbyX inside Telegram to sync your balance.");
    const response=await fetch(API+path,{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({initData:tg.initData})
    });
    const data=await response.json().catch(()=>({}));
    if(!response.ok||data.ok===false){
        const err=new Error(data.message||data.error||"Server request failed.");
        err.status=response.status;
        err.data=data;
        throw err;
    }
    return data;
}

function syncBalance(){
    if(syncPromise)return syncPromise;
    syncPromise=(async()=>{
        try{
            const data=await apiPost("/api/me");
            if(data.coins===undefined||!Number.isFinite(Number(data.coins))){
                throw new Error("The server did not return a valid balance.");
            }
            showCoins(data.coins);
            serverReady=true;
            status.textContent="";
            return true;
        }catch(error){
            console.error("Balance sync failed:",error);
            status.textContent="Balance sync failed. Open from Telegram.";
            return false;
        }finally{
            syncPromise=null;
        }
    })();
    return syncPromise;
}

function floatingText(e){
    const node=document.createElement("div");
    node.className="floating-text";
    node.textContent="+1";
    const rect=container.getBoundingClientRect();
    node.style.left=((e.clientX-rect.left)-15)+"px";
    node.style.top=((e.clientY-rect.top)-30)+"px";
    container.appendChild(node);
    setTimeout(()=>node.remove(),650);
}

function sayChub(){
    if(!("speechSynthesis"in window))return;
    window.speechSynthesis.cancel();
    const voice=new SpeechSynthesisUtterance("Chub");
    voice.lang="en-US";
    voice.pitch=1.4;
    voice.rate=1.6;
    window.speechSynthesis.speak(voice);
}

async function processTaps(){
    if(processing)return;
    processing=true;
    try{
        while(pendingTaps>0){
            pendingTaps--;
            try{
                // This endpoint must exist in the Cloudflare Worker.
                const data=await apiPost("/api/tap");
                if(data.coins===undefined||!Number.isFinite(Number(data.coins))){
                    throw new Error("Tap endpoint did not return the balance.");
                }
                showCoins(data.coins);
                status.textContent="";
            }catch(error){
                console.error("Tap was not credited:",error);
                if(error.data&&Number.isFinite(Number(error.data.coins))){
                    showCoins(error.data.coins);
                }
                pendingTaps=0;
                status.textContent=error.status===404
                    ?"Tap API is not installed on the server yet."
                    :error.status===401
                    ?"Please reopen ChubbyX from Telegram."
                    :error.status===429
                    ?"Daily tap limit reached."
                    :"Tap failed to sync. Try again.";
                break;
            }
        }
    }finally{
        processing=false;
    }
}

tap.addEventListener("pointerdown",async function(e){
    e.preventDefault();
    floatingText(e);
    sayChub();

    if(!serverReady){
        status.textContent="Connecting to server...";
        const ready=await syncBalance();
        if(!ready)return;
    }

    pendingTaps++;
    processTaps();
});

window.chubbyxSyncBalance=syncBalance;
syncBalance();
})();

function renderInviteFallback(){
    const page=document.getElementById("invites-page");
    if(!page)return;
    const user=window.Telegram?.WebApp?.initDataUnsafe?.user;
    const code=user?.id?String(user.id):"";
    const link=code
        ?"https://t.me/ChubbyX_Coin_bot?start="+encodeURIComponent(code)
        :"https://t.me/ChubbyX_Coin_bot";

    page.innerHTML=`<h2 class="page-title">👥 Invite Friends</h2>
    <div class="page-content"><div class="cx-card">
    <h3>Invite Friends</h3><p>Invite your friends to join ChubbyX.</p>
    <button class="cx-btn" id="invite-share">Invite Friends</button>
    <button class="cx-btn" id="invite-copy">Copy Invite Link</button>
    <div class="cx-message" id="invite-message"></div>
    </div></div>`;

    document.getElementById("invite-share").onclick=()=>{
        const url="https://t.me/share/url?url="+encodeURIComponent(link)+"&text="+encodeURIComponent("Join me on ChubbyX!");
        if(window.Telegram?.WebApp?.openTelegramLink)window.Telegram.WebApp.openTelegramLink(url);
        else window.open(url,"_blank");
    };
    document.getElementById("invite-copy").onclick=async()=>{
        const msg=document.getElementById("invite-message");
        try{await navigator.clipboard.writeText(link);msg.textContent="Invite link copied!";}
        catch(e){msg.textContent=link;}
    };
}

function renderGameFallback(){
    const page=document.getElementById("games-page");
    if(!page)return;
    page.innerHTML=`<h2 class="page-title">🎮 ChubbyX Games</h2>
    <div class="page-content"><div class="cx-card">
    <h3>Games</h3><p>Open the Daily Spin game.</p>
    <button class="cx-btn" onclick="if(window.gamePage)window.gamePage()">Daily Spin</button>
    </div></div>`;
}

function renderAirdropFallback(){
    const page=document.getElementById("airdrop-page");
    if(!page)return;
    page.innerHTML=`<h2 class="page-title">🎁 Airdrop</h2>
    <div class="page-content"><div class="cx-card">
    <h3>ChubbyX Airdrop</h3>
    <p>Follow official ChubbyX announcements for task details and eligibility.</p>
    <button class="cx-btn" id="airdrop-open">Open Telegram Channel</button>
    </div></div>`;
    document.getElementById("airdrop-open").onclick=()=>{
        const url="https://t.me/chubbyx_coin";
        if(window.Telegram?.WebApp?.openTelegramLink)window.Telegram.WebApp.openTelegramLink(url);
        else window.open(url,"_blank");
    };
}

function switchPage(id,element){
    if(id!=="wallet"&&window.tonConnectUI?.closeModal){
        try{window.tonConnectUI.closeModal();}catch(e){}
    }

    document.getElementById("home-layout").style.display="none";
    document.querySelectorAll(".dynamic-page").forEach(p=>p.classList.remove("active"));
    document.querySelectorAll(".nav-link").forEach(n=>n.classList.remove("active"));

    if(element)element.classList.add("active");
    else{
        const indexes={invites:1,home:2,games:3,wallet:4,tasks:0};
        if(indexes[id]!==undefined)document.querySelectorAll(".nav-link")[indexes[id]].classList.add("active");
    }

    if(id==="home"){
        document.getElementById("home-layout").style.display="flex";
        window.chubbyxSyncBalance?.();
        return;
    }

    const page=document.getElementById(id+"-page");
    if(!page)return;
    page.classList.add("active");

    if(id==="invites"){
        if(typeof window.updateInviteUI==="function")window.updateInviteUI();
        else if(typeof window.renderInvitePage==="function")window.renderInvitePage();
        else renderInviteFallback();
    }
    if(id==="games"){
        if(typeof window.gamePage==="function")window.gamePage();
        else if(typeof window.renderGame==="function")window.renderGame();
        else renderGameFallback();
    }
    if(id==="airdrop"){
        if(typeof window.renderAirdrop==="function")window.renderAirdrop();
        else renderAirdropFallback();
    }
    if(id==="wallet"&&typeof window.walletPage==="function")window.walletPage();
    if(id==="menu"&&typeof window.renderMenu==="function")window.renderMenu();
}
window.switchPage=switchPage;
window.renderInviteFallback=renderInviteFallback;
window.renderGameFallback=renderGameFallback;
window.renderAirdropFallback=renderAirdropFallback;
</script>

<script src="game.js"></script>
<script src="tasks.js"></script>
<script src="invite.js"></script>
<script src="airdrop.js"></script>
<script src="wallet.js?v=100"></script>
<script src="menu.js"></script>
</body>
</html>
