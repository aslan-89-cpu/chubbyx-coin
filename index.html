<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Coin</title>
    <style>
        html, body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: #090514 url('image.png.jpeg') no-repeat center fixed; 
            background-size: cover; 
            color: white; 
            font-family: sans-serif; 
            user-select: none;
            -webkit-user-select: none;
            touch-action: none; /* ڕێگری لە تەواوی جوڵانی شاشە لەسەر مۆبایل */
        }
        
        .header { 
            margin-top: 50px; 
            text-align: center; 
            position: relative;
            z-index: 100; 
        }
        
        .coin-container { 
            position: relative;
            width: 100%;
            height: calc(100% - 180px);
        }
        
        /* دانانی سکە بچووکەکە ڕێک لەسەر زگی کارەکتەرە وەنەوشەیییەکە */
        .tap-zone { 
            width: 140px !important; 
            height: 140px !important; 
            border-radius: 50%; 
            cursor: pointer; 
            background: url('image_okKb6u.png.jpeg') no-repeat center center; 
            background-size: 155% !important; 
            box-shadow: 0 0 25px rgba(234, 179, 8, 0.6); 
            position: absolute;
            top: 48%; /* گۆڕینی شوێن بۆ سەر زگی کارەکتەرەکە */
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 500 !important;
            -webkit-tap-highlight-color: transparent;
        }
        
        .energy-container { 
            position: absolute;
            top: 66%;
            left: 50%;
            transform: translateX(-50%);
            width: 220px; 
            text-align: center; 
            z-index: 600 !important; 
        }
        .energy-bar-bg { width: 100%; height: 12px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; border: 1px solid #7b2cbf; }
        .energy-bar-fill { width: 100%; height: 100%; background: #eab308; }
        
        /* ناو-باری خوارەوە بە بەرزترین ئاستی کلیککردن */
        .nav-bar { 
            width: 100%; 
            background: rgba(13, 8, 27, 0.98); 
            border-top: 2px solid #7b2cbf; 
            display: flex; 
            position: fixed; 
            bottom: 0; 
            left: 0;
            padding: 20px 0; 
            z-index: 99999 !important; 
        }
        .nav-item { 
            font-size: 14px; 
            color: #9d4edd; 
            cursor: pointer; 
            flex: 1; 
            text-align: center; 
            font-weight: bold; 
            z-index: 100000 !important; 
            -webkit-tap-highlight-color: transparent;
        }
        
        .page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #090514; padding: 20px; box-sizing: border-box; z-index: 3000 !important; overflow-y: auto; }
        .page-header { display: flex; justify-content: space-between; border-bottom: 1px solid #7b2cbf; padding-bottom: 10px; }
        .close-btn { background: #7b2cbf; color: white; border: none; padding: 5px 15px; border-radius: 5px; cursor: pointer; }
        
        .task-list { margin-top: 20px; display: flex; flex-direction: column; gap: 15px; }
        .task-item { background: rgba(255, 255, 255, 0.05); border: 1px solid #7b2cbf; border-radius: 12px; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        .task-details h4 { margin: 0; font-size: 15px; }
        .task-details p { margin: 5px 0 0 0; font-size: 13px; color: #eab308; font-weight: bold; }
        .task-claim-btn { background: #eab308; color: #090514; border: none; padding: 8px 15px; border-radius: 6px; font-weight: bold; cursor: pointer; font-size: 13px; }
        .invite-box { background: rgba(255, 255, 255, 0.05); border: 1px solid #7b2cbf; border-radius: 12px; padding: 15px; margin-top: 20px; text-align: center; }
        .invite-counter { font-size: 18px; color: #eab308; font-weight: bold; margin: 10px 0; }
        .invite-btn { background: #eab308; color: #090514; border: none; padding: 10px 20px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; font-size: 15px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="header"><div>ChubbyX Balance</div><h1 id="score">0</h1></div>
    <div class="coin-container">
        <div class="tap-zone" id="tapCoin"></div>
        <div class="energy-container">
            <div style="margin-bottom: 5px;"><span id="energyText">500</span>/500</div>
            <div class="energy-bar-bg"><div class="energy-bar-fill" id="energyFill"></div></div>
        </div>
    </div>
    
    <div id="tasksPage" class="page">
        <div class="page-header"><h2>Tasks</h2><button class="close-btn" onclick="showMainGame()">X</button></div>
        <div class="task-list">
            <div class="task-item">
                <div class="task-details"><h4>Join Telegram Channel</h4><p>+5,000 CHUB</p></div>
                <button class="task-claim-btn" id="task1" onclick="completeTask('task1', 5000, 'https://t.me')">Claim</button>
            </div>
            <div class="task-item">
                <div class="task-details"><h4>Follow us on X</h4><p>+3,000 CHUB</p></div>
                <button class="task-claim-btn" id="task2" onclick="completeTask('task2', 3000, 'https://x.com')">Claim</button>
            </div>
        </div>
    </div>
    
    <div id="invitePage" class="page">
        <div class="page-header"><h2>Invite Friends</h2><button class="close-btn" onclick="showMainGame()">X</button></div>
        <div class="invite-box">
            <h3>Your Referrals</h3>
            <div class="invite-counter"><span id="friendCount">0</span> / 10 Invited</div>
            <button class="invite-btn" onclick="copyInviteLink()">Copy Invite Link</button>
        </div>
    </div>
    
    <div id="gamesPage" class="page" style="padding: 10px; overflow: hidden;">
        <div class="page-header"><h2>Chubby Games</h2><button class="close-btn" onclick="showMainGame()">X</button></div>
        <iframe src="game.html" style="width: 100%; height: 85vh; border: none; margin-top: 10px;"></iframe>
    </div>
    
    <div id="walletPage" class="page"><div class="page-header"><h2>Wallet</h2><button class="close-btn" onclick="showMainGame()">X</button></div><p style="padding-top:20px;">Connect Wallet coming soon!</p></div>
    
    <div class="nav-bar">
        <div class="nav-item" id="btn-tasks">Tasks</div>
        <div class="nav-item" id="btn-invite">Invite</div>
        <div class="nav-item" id="btn-games">Games</div>
        <div class="nav-item" id="btn-wallet">Wallet</div>
    </div>
    
    <script>
        // ڕاگرتنی تەواوی جوڵانی پەڕەکە بۆ ئەوەی دوگمەکان لە کار نەکەون
        document.addEventListener('touchmove', function(e) {
            e.preventDefault();
        }, { passive: false });

        var count = parseInt(localStorage.getItem('chubby_coins')) || 0;
        var invitedFriends = parseInt(localStorage.getItem('chubby_invites')) || 0;
        var energy = 500;
        
        document.getElementById('score').innerText = count;
        document.getElementById('friendCount').innerText = invitedFriends;
        
        window.onload = function() {
            checkTaskStatus('task1');
            checkTaskStatus('task2');
        };

        var tapElement = document.getElementById('tapCoin');
        
        function doTap(e) {
            if(e) e.preventDefault();
            if (energy > 0) { 
                count++; energy--; 
                document.getElementById('score').innerText = count; 
                updateUI(); 
                localStorage.setItem('chubby_coins', count); 
            }
        }
        
        tapElement.addEventListener('touchstart', doTap);
        tapElement.addEventListener('click', doTap);

        function updateUI() { 
            document.getElementById('energyText').innerText = energy; 
            document.getElementById('energyFill').style.width = (energy / 500 * 100) + '%'; 
        }
        
        setInterval(function() { 
            if (energy < 500) { energy += 3; if (energy > 500) energy = 500; updateUI(); } 
        }, 1000);
        
        function openPage(id) { 
            document.querySelectorAll('.page').forEach(p => p.style.display = 'none'); 
            document.getElementById(id).style.display = 'block'; 
        }
        function showMainGame() { document.querySelectorAll('.page').forEach(p => p.style.display = 'none'); }
        
        // جێگیرکردنی دوگمەکانی خوارەوە بە شێوازی دەست لێدانی خێرا (Touchstart)
        document.getElementById('btn-tasks').addEventListener('touchstart', function() { openPage('tasksPage'); });
        document.getElementById('btn-tasks').addEventListener('click', function() { openPage('tasksPage'); });
        
        document.getElementById('btn-invite').addEventListener('touchstart', function() { openPage('invitePage'); });
        document.getElementById('btn-invite').addEventListener('click', function() { openPage('invitePage'); });
        
        document.getElementById('btn-games').addEventListener('touchstart', function() { openPage('gamesPage'); });
        document.getElementById('btn-games').addEventListener('click', function() { openPage('gamesPage'); });
        
        document.getElementById('btn-wallet').addEventListener('touchstart', function() { openPage('walletPage'); });
        document.getElementById('btn-wallet').addEventListener('click', function() { openPage('walletPage'); });

        function copyInviteLink() {
            navigator.clipboard.writeText("https://t.me").then(function() {
                alert("Link copied!");
