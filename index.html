<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Coin</title>
    <style>
        body {
            /* وێنە وەنەوشەییەکە وەک پاشبنەمای سەرەکی جێگیر کرا */
            background: #090314 url('image.png.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            font-family: sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        .header { margin-top: 40px; text-align: center; z-index: 10; }
        .coin-container { flex: 1; display: flex; justify-content: center; align-items: center; width: 100%; position: relative; }
        
        /* شوێنی لێدان ڕێک لەسەر زکی بوونەوەرە وەنەوشەییەکە داندرا */
        .tap-zone {
            width: 240px; 
            height: 240px; 
            border-radius: 50%; 
            cursor: pointer;
            /* بەکارهێنانی وێنەی سکە زەردەکە وەک دوگمەی سەرەکی */
            background: url('image_okkb6u.png.jpeg') no-repeat center center;
            background-size: cover; 
            box-shadow: 0 0 30px rgba(164, 143, 255, 0.6);
            border: 4px solid #a48fff;
            -webkit-tap-highlight-color: transparent; 
            touch-action: manipulation;
            z-index: 10;
            /* ئامادەکردنی ئەنیمەیشنی جوڵانی زک */
            transition: transform 0.05s ease;
        }
        
        /* کاتێک دەست لە زکی دەدەیت، کەمێک بچووک دەبێتەوە (دەچێتە ناوەوە) */
        .tap-zone.pulse-effect {
            transform: scale(0.9);
        }
        
        .energy-container { width: 100%; text-align: center; margin-bottom: 20px; z-index: 10; }
        .energy-bar-bg { width: 80%; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; border: 1px solid #a48fff; margin: 10px auto; }
        .energy-bar-fill { width: 100%; height: 12px; background: #a48fff; transition: width 0.1s ease; }
        .nav-bar { position: fixed; bottom: 0; width: 100%; display: flex; justify-content: space-around; background: rgba(20, 10, 35, 0.95); padding: 15px 0; border-top: 1px solid #331a5e; z-index: 20; }
        .nav-item { color: #a48fff; text-decoration: none; font-size: 14px; cursor: pointer; font-weight: bold; opacity: 0.7; }
        .nav-item.active { opacity: 1; color: white; }
    </style>
</head>
<body>

    <div class="header">
        <div style="opacity: 0.8; font-size: 14px; letter-spacing: 1px;">CHUBBYX BALANCE</div>
        <h1 id="score" style="margin: 5px 0; font-size: 48px;">0</h1>
    </div>

    <div class="coin-container">
        <div class="tap-zone" id="tapcoin"></div>
    </div>

    <div class="energy-container">
        <div>⚡ <span id="energyText">500</span> / 500</div>
        <div class="energy-bar-bg"><div class="energy-bar-fill" id="energyFill"></div></div>
    </div>

    <div class="nav-bar">
        <div class="nav-item" onclick="window.location.href='tasks.html'">Tasks</div>
        <div class="nav-item" onclick="window.location.href='game.html'">Mini-Game</div>
        <div class="nav-item active">Games</div>
        <div class="nav-item" onclick="window.location.href='invite.html'">Invite</div>
        <div class="nav-item" onclick="window.location.href='wallet.html'">Wallet</div>
    </div>

    <script>
        let count = parseInt(localStorage.getItem('chubby_coins')) || 0;
        let energy = 500;
        document.getElementById('score').innerText = count;

        // دروستکردنی دەنگی ئەلیکترۆنی نەرمی Pop بە بێ پێویستی بە فایلی mp3
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        function playTapSound() {
            if (audioCtx.state === 'suspended') { audioCtx.resume(); }
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(587.33, audioCtx.currentTime); // دەنگی نۆتی D5 خێرا
            osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.08); // بەرزبوونەوەی خێرا
            gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08); // کەمبوونەوەی خێرا
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.08);
        }

        var tapElement = document.getElementById('tapcoin');
        tapElement.addEventListener('touchstart', function(e) {
            e.preventDefault();
            if (energy > 0) {
                count++; energy--;
                document.getElementById('score').innerText = count;
                document.getElementById('energyText').innerText = energy;
                document.getElementById('energyFill').style.width = (energy / 500 * 100) + '%';
                localStorage.setItem('chubby_coins', count);
                
                // چالاککردنی دەنگی پۆپ
                playTapSound();
                
                // جێبەجێکردنی ئەنیمەیشنی لێدانی زک (بۆ پێش و دوا ناچێت، تەنها کەمێک دەچێتە ناوەوە و دێتەوە دەرەوە)
                tapElement.classList.add('pulse-effect');
                setTimeout(() => {
                    tapElement.classList.remove('pulse-effect');
                }, 50);
            }
        });

        setInterval(function() {
            if (energy < 500) {
                energy++;
                document.getElementById('energyText').innerText = energy;
                document.getElementById('energyFill').style.width = (energy / 500 * 100) + '%';
            }
        }, 1500);
    </script>
</body>
</html>
