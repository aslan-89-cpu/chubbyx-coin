<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>ChubbyX</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            width: 100vw;
            height: 100vh;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            user-select: none;
            touch-action: none;
            /* ڕەنگی بنەڕەتی پشتەوە دەکرێتە وەنەوشەیی تۆخ بۆ ئەوەی لەگەڵ سەرەوەی شاشە یەکبگرێت */
            background: #231942 url('background.png.jpeg') no-repeat center center fixed;
            background-size: 100% 100%;
        }
        .header { 
            margin-top: 20px; 
            text-align: center; 
            z-index: 10; 
        }
        .coin-container { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            width: 100%; 
            position: relative; 
        }
        .tap-zone {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            cursor: pointer;
            background: url('image_okkb6u.png.jpeg') no-repeat center center;
            background-size: cover;
            box-shadow: 0 0 30px rgba(164, 143, 255, 0.6);
            border: 4px solid #a48fff;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            z-index: 10;
            transition: transform 0.05s ease;
        }
        .tap-zone.pulse-effect {
            transform: scale(0.9);
        }
        .energy-container {
            width: 100%;
            text-align: center;
            margin-bottom: 75px; /* کەمێک بەرزکرایەوە بۆ ئەوەی نەچێتە پشتی مینیو */
            z-index: 10;
        }
        .energy-bar-bg { 
            width: 80%; 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 10px; 
            overflow: hidden; 
            border: 1px solid #a48fff; 
            margin: 10px auto; 
        }
        .energy-bar-fill { 
            width: 100%; 
            height: 12px; 
            background: #a48fff; 
            transition: width 0.1s ease; 
        }
        .nav-bar { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-around; 
            background: rgba(20, 10, 35, 0.95); 
            padding: 15px 0 calc(15px + env(safe-area-inset-bottom)); 
            border-top: 1px solid #331a5e; 
            z-index: 20; 
        }
        .nav-item { 
            color: #a48fff; 
            text-decoration: none; 
            font-size: 14px; 
            cursor: pointer; 
            font-weight: bold; 
            opacity: 0.7; 
        }
        .nav-item.active { 
            opacity: 1; 
            color: white; 
        }
    </style>
</head>
<body>

    <!-- گەڕاندنەوەی بەشەکانی HTML یارییەکە بۆ سەر شاشە -->
    <div class="header">
        <h2 style="font-size: 16px; opacity: 0.8;">CHUBBYX BALANCE</h2>
        <h1 style="font-size: 42px; font-weight: bold; margin-top: 5px;">713</h1>
    </div>

    <div class="coin-container">
        <div class="tap-zone" id="tapBtn"></div>
    </div>

    <div class="energy-container">
        <div style="font-size: 16px; margin-bottom: 5px;">⚡ 500 / 500</div>
        <div class="energy-bar-bg">
            <div class="energy-bar-fill"></div>
        </div>
    </div>

    <div class="nav-bar">
        <a class="nav-item" href="#">Tasks</a>
        <a class="nav-item" href="#">Mini-Game</a>
        <a class="nav-item" href="#">Games</a>
        <a class="nav-item active" href="#">Invite</a>
        <a class="nav-item" href="#">Airdrop</a>
        <a class="nav-item" href="#">Wallet</a>
    </div>

    <script>
        // چالاککردنی ڕێکخستنەکانی تێلیگرام
        window.Telegram.WebApp.ready();
        window.Telegram.WebApp.expand();
        
        // گۆڕینی ڕەنگی سەرەوەی شاشە بۆ وەنەوشەیی پەمەیی بۆ ئەوەی ڕەشییەکە نەمێنێت و تێکەڵ بە ئاسمانی وێنەکە بێت
        window.Telegram.WebApp.setHeaderColor('#231942'); 
        window.Telegram.WebApp.setBackgroundColor('#231942');

        // ئەنیمەیشنی کلیککردنی سەر کۆینەکە
        const tapBtn = document.getElementById('tapBtn');
        if(tapBtn) {
            tapBtn.addEventListener('touchstart', () => {
                tapBtn.classList.add('pulse-effect');
            });
            tapBtn.addEventListener('touchend', () => {
                setTimeout(() => {
                    tapBtn.classList.remove('pulse-effect');
                }, 50);
            });
        }
    </script>
</body>
</html>
