<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChubbyX</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            width: 100vw;
            height: 100vh;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            user-select: none;
            touch-action: none;
            /* ڕەنگی پشتەوە کرا بە وەنەوشەیی تۆخی هاوشێوەی وێنەکە */
            background: #231942 url('background.png.jpeg?v=2') no-repeat center center fixed;
            background-size: 100% 100%;
        }
        .header { 
            margin-top: 15px; 
            text-align: center; 
            z-index: 10; 
            pointer-events: none;
        }
        .coins-container { 
            flex: 1; 
            width: 100%; 
            position: relative; 
            z-index: 5;
        }
        /* لێرەدا شوێنی دوگمەکان ڕێکخرایەوە بۆ سەر دوو کۆینە زەردەکەی خوارەوە */
        .tap-coin-left {
            position: absolute;
            left: 10%;
            bottom: 22%;
            width: 115px;
            height: 115px;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
            z-index: 30;
            transition: transform 0.05s ease;
        }
        .tap-coin-right {
            position: absolute;
            right: 10%;
            bottom: 26%;
            width: 115px;
            height: 115px;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
            z-index: 30;
            transition: transform 0.05s ease;
        }
        .tap-coin-left:active, .tap-coin-right:active {
            transform: scale(0.92);
        }
        .energy-container {
            width: 100%;
            text-align: center;
            margin-bottom: 85px; 
            z-index: 10;
            pointer-events: none;
        }
        .energy-bar-bg { 
            width: 80%; 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 10px; 
            overflow: hidden; 
            border: 1px solid #a48fff; 
            margin: 10px auto; 
        }
        .energy-bar-fill { 
            width: 100%; 
            height: 12px; 
            background: #a48fff; 
            transition: width 0.1s ease; 
        }
        .nav-bar { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-around; 
            background: rgba(20, 10, 35, 0.95); 
            padding: 15px 0 calc(15px + env(safe-area-inset-bottom)); 
            border-top: 1px solid #331a5e; 
            z-index: 40; 
        }
        .nav-item { 
            color: #a48fff; 
            text-decoration: none; 
            font-size: 14px; 
            cursor: pointer; 
            font-weight: bold; 
            opacity: 0.7; 
            z-index: 50;
        }
        .nav-item.active { 
            opacity: 1; 
            color: white; 
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="font-size: 14px; opacity: 0.8; letter-spacing: 1px;">CHUBBYX BALANCE</h2>
        <h1 style="font-size: 42px; font-weight: bold; margin-top: 2px;">713</h1>
    </div>

    <div class="coins-container">
        <div class="tap-coin-left" id="coinLeft"></div>
        <div class="tap-coin-right" id="coinRight"></div>
    </div>

    <div class="energy-container">
        <div style="font-size: 16px; margin-bottom: 5px;">⚡ 500 / 500</div>
        <div class="energy-bar-bg">
            <div class="energy-bar-fill"></div>
        </div>
    </div>

    <div class="nav-bar">
        <a class="nav-item" href="#">Tasks</a>
        <a class="nav-item" href="#">Mini-Game</a>
        <a class="nav-item" href="#">Games</a>
        <a class="nav-item active" href="#">Invite</a>
        <a class="nav-item" href="#">Airdrop</a>
        <a class="nav-item" href="#">Wallet</a>
    </div>

    <script>
        // دڵنیابوون لە لۆدبوونی تەواوی ئەپەکە
        window.Telegram.WebApp.ready();
window.Telegram.WebApp.expand();
window.Telegram.WebApp.setHeaderColor('#231942');
window.Telegram.WebApp.setBackgroundColor('#231942');

    const coinLeft = document.getElementById('coinLeft');
    const coinRight = document.getElementById('coinRight');

    function handleTap(e) {
        e.preventDefault();
        console.log("Tapped!");
    }

    if (coinLeft) {
        coinLeft.addEventListener('touchstart', handleTap);
    }
    if (coinRight) {
        coinRight.addEventListener('touchstart', handleTap);
    }
    </script>
</body>
</html>
