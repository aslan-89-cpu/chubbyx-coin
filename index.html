<!DOCTYPE html>
<html lang="ku">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChubbyX Coin</title>
    <style>
        body {
            /* 🌌 وێنە گەورەکەت لێرە بە فەرمی دەکرێتە باگراوندی گشتی بۆ تەواوی شاشەکە */
            background: url('image_okKb6u.png.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* بەشی سەرەوەی خاڵەکان */
        .header {
            margin-top: 40px;
            text-align: center;
            z-index: 5;
            background: rgba(13, 8, 27, 0.5);
            padding: 10px 30px;
            border-radius: 15px;
            backdrop-filter: blur(5px);
        }
        .coin-count {
            font-size: 48px;
            font-weight: bold;
            color: #ffffff;
            text-shadow: 0px 4px 15px rgba(234, 179, 8, 0.6);
            margin: 5px 0;
        }
        .rank {
            font-size: 14px;
            color: #bfaaff;
            letter-spacing: 1px;
        }

        /* 🎯 لۆجیکی جیاکردنەوە: بازنەی تەپ-تەپ بە بچووکی لە ناوەڕاست */
        .coin-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1;
        }
        
        /* لێرەدا قەبارەی تەپ-تەپەکە کراوەتە بازنەیەکی بچووکی ٢٠٠ پێکسڵی جێگیر */
        .tap-zone {
            width: 200px; 
            height: 200px;
            border-radius: 50%;
            cursor: pointer;
            /* وێنەی سکە زێڕینەکەت لێرەدا دەبێتە دوگمە بچووکەکە */
            background: url('chubbyx_coin.png') no-repeat center center;
            background-size: contain;
            box-shadow: 0 0 30px rgba(234, 179, 8, 0.5);
            transition: transform 0.05s ease;
        }
        
        /* کاتێک دەستی لێدەدەیت کەمێک دێت و دەچێت */
        .tap-zone:active {
            transform: scale(0.92);
        }

        /* مێنیۆی خوارەوە */
        .nav-bar {
            width: 100%;
            background: rgba(13, 8, 27, 0.95);
            border-top: 2px solid #372365;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            position: absolute;
            bottom: 0;
            z-index: 5;
        }
        .nav-item {
            font-size: 12px;
            color: #9b8cc4;
            cursor: pointer;
            text-align: center;
            flex: 1;
        }
        .nav-item.active {
            color: #eab308;
            font-weight: bold;
        }
        .nav-item span {
            display: block;
            font-size: 24px;
            margin-bottom: 4px;
        }

        /* لاپەڕەکانی تری ناو یارییەکە */
        .page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: #0d081b;
            box-sizing: border-box;
            padding: 20px;
            padding-bottom: 90px;
            overflow-y: auto;
            z-index: 10;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #372365;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .close-btn {
            background: #eab308;
            color: black;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .item-list {
            background: #1c1236;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .action-btn {
            background: #22c55e;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="rank">ChubbyX بیلۆنس</div>
        <div class="coin-count" id="score">0</div>
    </div>

    <!-- 📌 ئێستا تەنها ئەم بازنە بچووکە لە ناوەڕاستدا دەبێتە شوێنی تەپ تەپ لەسەر باگراوندەکە -->
    <div class="coin-container">
        <div class="tap-zone" id="tapCoin"></div>
    </div>

    <div id="tasksPage" class="page">
        <div class="page-header">
            <h2>ئەرکەکان (Tasks)</h2>
            <button class="close-btn" onclick="closePage('tasksPage')">X</button>
        </div>
        <div class="item-list">
            <div>عەینەکردنی چەناڵی تێلیگرام (+1,000 CHUB)</div>
            <button class="action-btn" onclick="addCoins(1000)">Check</button>
        </div>
    </div>

    <div id="invitePage" class="page">
        <div class="page-header">
            <h2>داوەتکردنی هاوڕێیان</h2>
            <button class="close-btn" onclick="closePage('invitePage')">X</button>
        </div>
        <p>بۆ هەر هاوڕێیەک کە داوەتی دەکەیت ٥,٠٠٠ سکە وەربگرە!</p>
        <button class="action-btn" style="width:100%; padding:15px; font-size:16px;" onclick="alert('لینکەکە کۆپی بوو!')">کۆپیکردنی لینی داوەتکردن 🔗</button>
    </div>

    <div id="gamesPage" class="page">
        <div class="page-header">
            <h2>یارییەکان (Mini Games)</h2>
            <button class="close-btn" onclick="closePage('gamesPage')">X</button>
        </div>
        <div class="item-list">
            <div>یاری کەرەوزی خێرا (Jar Jar Mod)</div>
            <button class="action-btn" style="background:#eab308; color:black;" onclick="alert('بەم زووانە بەردەست دەبێت!')">Start 🎮</button>
        </div>
    </div>

    <div id="walletPage" class="page">
        <div class="page-header">
            <h2>جزدان (Wallet)</h2>
            <button class="close-btn" onclick="closePage('walletPage')">X</button>
        </div>
        <p>جزدانی خۆت ببەستەوە بۆ کاتی ئێردرۆپ:</p>
        <button class="action-btn" style="width:100%; background:#0098ea; padding:15px;" onclick="alert('سیستەمی TON بەم زووانە دەبەسرێتەوە')">Connect TON Wallet 💎</button>
    </div>

    <div class="nav-bar">
        <div class="nav-item active" onclick="closeAllPages()"><span>🪙</span>Tap</div>
        <div class="nav-item" onclick="openPage('tasksPage')"><span>📋</span>Tasks</div>
        <div class="nav-item" onclick="openPage('invitePage')"><span>👥</span>Friends</div>
        <div class="nav-item" onclick="openPage('gamesPage')"><span>🎮</span>Games</div>
        <div class="nav-item" onclick="openPage('walletPage')"><span>💼</span>Wallet</div>
    </div>

    <script>
        let count = 0;
        const scoreDisplay = document.getElementById('score');
        const tapCoin = document.getElementById('tapCoin');

        tapCoin.addEventListener('click', () => {
            count += 1;
            scoreDisplay.innerText = count;
        });

        // لۆجیکی کردنەوەی لاپەڕەکان
        function openPage(pageId) {
            closeAllPages();
            document.getElementById(pageId).style.display = 'block';
        }

        function closePage(pageId) {
            document.getElementById(pageId).style.display = 'none';
        }

        function closeAllPages() {
            const pages = document.querySelectorAll('.page');
            pages.forEach(page => page.style.display = 'none');
        }

        function addCoins(amount) {
            count += amount;
            scoreDisplay.innerText = count;
            alert('سکەکان زیادکران!');
        }
    </script>
</body>
</html>
