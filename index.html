<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Mining Hub</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            /* ⬇️ گەڕانەوە بۆ وێنە ئەسڵییەکەی خۆت و جێگیرکردنی لە ناوەڕاستی شاشەدا */
            background: #1c1437 url('background.jpg') no-repeat center top -120px fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .header-status {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 0 20px;
            z-index: 10;
        }
        .user-badge {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .user-name { font-weight: bold; font-size: 16px; color: #fff; }
        .lvl-tag {
            background: rgba(234, 179, 8, 0.15);
            border: 1px solid #eab308;
            color: #eab308;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
            width: fit-content;
        }
        
        .main-layout {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            position: relative;
        }

        .assets-title { font-size: 11px; color: #bbb; letter-spacing: 1.5px; text-transform: uppercase; margin-top: 10px; }
        .balance-display { font-size: 34px; font-weight: 800; color: #fff; margin: 5px 0 15px 0; }
        .balance-display span { color: #eab308; font-size: 20px; font-weight: 600; }

        .pool-box {
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 16px;
            border-radius: 12px;
            font-size: 13px;
            color: #aaa;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
        }
        .pool-box span { color: #fff; font-weight: bold; }

        .mining-profit {
            font-size: 36px;
            font-weight: bold;
            color: #22c55e;
            text-shadow: 0 0 15px rgba(34, 197, 94, 0.3);
            margin-bottom: 25px;
        }

        /* ⬇️ گۆڕینی بازنە زێڕینەکە بۆ ناوچەی کلیکی شەفاف ڕێک لەسەر بووکەڵە مۆرەکەت */
        .coin-wrapper {
            position: relative;
            width: 280px;
            height: 280px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .transparent-tap-zone {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.05s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .transparent-tap-zone:active { 
            transform: scale(0.93) !important; 
        }

        .floating-text {
            position: absolute;
            color: #22c55e;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            z-index: 1000;
            animation: floatUp 0.6s ease-out forwards;
            text-shadow: 0 0 8px rgba(34, 197, 94, 0.5);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0); }
            100% { opacity: 0; transform: translateY(-100px); }
        }

        .claim-btn {
            width: 100%;
            max-width: 340px;
            background: #eab308;
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.3);
            margin-bottom: 100px;
        }
        .claim-btn:active { transform: scale(0.98); }

        /* لاپەڕە داینامیکییەکان */
        .dynamic-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: calc(100vh - 75px);
            background: #090611;
            z-index: 1500;
            padding: 40px 20px;
            flex-direction: column;
            align-items: center;
        }
        .dynamic-page.active { display: flex; }
        .page-title { font-size: 26px; font-weight: bold; margin-bottom: 25px; color: #eab308; }

        .bottom-nav {
            width: 100%;
            background: #05030a;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            position: fixed;
            bottom: 0;
            padding: 12px 10px calc(12px + env(safe-area-inset-bottom));
            z-index: 2000;
        }
        .nav-link { flex: 1; text-align: center; font-size: 12px; color: #666; text-decoration: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 500; }
        .nav-link.active { color: #eab308; font-weight: bold; }
        .nav-icon { font-size: 20px; }
    </style>
</head>
<body>

    <!-- بەشی سەرەوەی ناسنامە (ناونیشانی جزدانەکە لابرا) -->
    <div class="header-status">
        <div class="user-badge">
            <span class="user-name">ChubbyX Miner</span>
            <span class="lvl-tag">Lvl 1 • READY</span>
        </div>
    </div>

    <!-- 🏠 ڕوونمای سەرەکی ماینینگ -->
    <div class="main-layout" id="mine-layout">
        <span class="assets-title">Assets</span>
        <div class="balance-display"><span id="main-balance">0</span> <span>ChubbyX</span></div>
        
        <div class="pool-box">POOL WALLET: <span id="pool-balance">0.0000</span></div>
        
        <div class="mining-profit" id="mining-live">+0.0000</div>

        <!-- ناوچەی کلیکی شەفاف ڕێک لەسەر بووکەڵە ئەسڵییەکەت -->
        <div class="coin-wrapper" id="coinContainer">
            <div class="transparent-tap-zone" id="clickCoin"></div>
        </div>

        <button class="claim-btn" id="claimAction">Claim</button>
    </div>

    <!-- لاپەڕە داینامیکییەکانی تر -->
    <div id="tasks-page" class="dynamic-page"><h2 class="page-title">Tasks List</h2></div>
    <div id="miners-page" class="dynamic-page"><h2 class="page-title">Miners Upgrade</h2></div>
    <div id="friends-page" class="dynamic-page"><h2 class="page-title">Friends Referral</h2></div>
    <div id="profile-page" class="dynamic-page"><h2 class="page-title">User Profile</h2></div>

    <div class="bottom-nav">
        <div class="nav-link active" id="default-nav" onclick="switchPage('mine', this)">
            <span class="nav-icon">⛏️</span><span>Mine</span>
        </div>
        <div class="nav-link" onclick="switchPage('tasks', this)">
            <span class="nav-icon">📋</span><span>Tasks</span>
        </div>
        <div class="nav-link" onclick="switchPage('miners', this)">
            <span class="nav-icon">⚡</span><span>Miners</span>
        </div>
        <div class="nav-link" onclick="switchPage('friends', this)">
            <span class="nav-icon">👥</span><span>Friends</span>
        </div>
        <div class="nav-link" onclick="switchPage('profile', this)">
            <span class="nav-icon">👤</span><span>Profile</span>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        let mainBalance = parseFloat(localStorage.getItem('cx_main_balance')) || 0;
        let poolBalance = parseFloat(localStorage.getItem('cx_pool_balance')) || 0;
        
        document.getElementById('main-balance').innerText = mainBalance.toFixed(4);
        document.getElementById('pool-balance').innerText = poolBalance.toFixed(4);

        // ماینینگی ئۆتۆماتیکی
        setInterval(() => {
            let pendingProfit = Math.random() * 0.0005; 
            poolBalance += pendingProfit;
            
            document.getElementById('mining-live').innerText = "+" + pendingProfit.toFixed(4);
            document.getElementById('pool-balance').innerText = poolBalance.toFixed(4);
            
            localStorage.setItem('cx_pool_balance', poolBalance);
        }, 1500);

        // دوگمەی CLAIM
        document.getElementById('claimAction').addEventListener('click', () => {
            if (poolBalance > 0) {
                mainBalance += poolBalance;
                alert(Successfully Claimed +${poolBalance.toFixed(4)} ChubbyX! 🚀);
                poolBalance = 0;
                
                document.getElementById('main-balance').innerText = mainBalance.toFixed(4);
                document.getElementById('pool-balance').innerText = poolBalance.toFixed(4);
                
                localStorage.setItem('cx_main_balance', mainBalance);
                localStorage.setItem('cx_pool_balance', poolBalance);
            } else {
                alert("No balance available to claim!");
            }
        });

        // لێدانی تاپ-تاپ لەسەر بووکەڵەکە
        const coinBtn = document.getElementById('clickCoin');
