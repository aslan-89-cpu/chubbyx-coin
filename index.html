<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Coin</title>
    <style>
        :root {
            --purple-main: #a48fff;
            --purple-dark: #1c103a;
            --bg-color: #090314;
        }
        body {
            background: var(--bg-color) url('image.png.jpeg') no-repeat center fixed;
            background-size: cover;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }
        .app-container {
            width: 100%;
            max-width: 450px;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100%;
            position: relative;
        }
        #game-page {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            height: calc(100% - 70px);
            justify-content: space-around;
            padding-bottom: 20px;
            box-sizing: border-box;
        }
        .balance-container { text-align: center; margin-top: 20px; }
        .balance-title { font-size: 16px; opacity: 0.8; letter-spacing: 1px; text-transform: uppercase; }
        .balance-amount { font-size: 48px; font-weight: bold; color: white; margin-top: 5px; text-shadow: 0 0 15px var(--purple-main); }
        
        .coin-wrapper { cursor: pointer; position: relative; transition: transform 0.08s ease; }
        .coin-wrapper:active { transform: scale(0.92); }
        .coin-image {
            width: 230px;
            height: 230px;
            border-radius: 50%;
            box-shadow: 0 0 35px rgba(164, 143, 255, 0.6);
            border: 4px solid var(--purple-main);
        }
        
        .energy-wrapper {
            font-size: 18px;
            font-weight: bold;
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 25px;
            border-radius: 25px;
            backdrop-filter: blur(5px);
            border: 1px solid rgba(164, 143, 255, 0.3);
        }

        .sub-page {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: calc(100% - 70px);
            background: rgba(9, 3, 20, 0.98);
            z-index: 10;
            padding: 25px;
            box-sizing: border-box;
            flex-direction: column;
            overflow-y: auto;
        }
        .page-title {
            font-size: 28px;
            font-weight: bold;
            text-align: center;
            margin-top: 20px;
            margin-bottom: 30px;
            color: var(--purple-main);
        }
        .item-card {
            background: var(--purple-dark);
            padding: 18px;
            border-radius: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #331a5e;
        }
        
        .btn-action {
            background: var(--purple-main);
            color: black;
            border: none;
            padding: 10px 22px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
        }
        .btn-action:disabled { background: #555; color: #888; cursor: not-allowed; }
        
        #purple-catch-game {
            position: relative;
            width: 100%;
            height: 300px;
            background: #130a24;
            border-radius: 15px;
            overflow: hidden;
            border: 2px dashed var(--purple-main);
            margin-top: 10px;
        }
        .falling-obj {
            position: absolute;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            cursor: pointer;
        }

        .navigation-bar {
            position: fixed;
            bottom: 0;
            width: 100%;
            max-width: 450px;
            display: flex;
            justify-content: space-around;
            background: rgba(20, 10, 35, 0.98);
            padding: 18px 0;
            border-top: 1px solid #331a5e;
            z-index: 20;
        }
        .nav-link {
            color: var(--purple-main);
            text-decoration: none;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
            opacity: 0.6;
        }
        .nav-link.active, .nav-link:hover { opacity: 1; color: white; }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Main Game Page -->
        <div id="game-page">
            <div class="balance-container">
                <div class="balance-title">ChubbyX Balance</div>
                <!-- گۆڕینی ئایدی بۆ score بۆ ئەوەی لەگەڵ فەنکشنەکەت یەک بێتەوە -->
                <div class="balance-amount" id="score">0</div>
            </div>

            <div class="coin-wrapper" onclick="handleTapEvent(event)">
                <img class="coin-image" src="image_okkb6u.png.jpeg" alt="ChubbyX Coin">
            </div>

            <div class="energy-wrapper">
                <span id="live-energy">500</span>/500
            </div>
        </div>

        <!-- Tasks Page -->
        <div id="tasks-page" class="sub-page">
            <div class="page-title">Tasks</div>
            <div class="item-card">
                <div>
                    <div style="font-weight:bold;">Join Telegram Channel</div>
                    <div style="color:var(--purple-main);">+1,000 CHUB</div>
                </div>
                <!-- لێرەدا فەنکشنە کاتژمێرییەکەت بەستراوەتەوە بە ئایدی تەواو -->
                <button class="btn-action" id="task1" onclick="completeTask('task1', 1000, 'https://t.me')">Join</button>
            </div>
            <div class="item-card">
                <div>
                    <div style="font-weight:bold;">Follow ChubbyX on X</div>
                    <div style="color:var(--purple-main);">+2,500 CHUB</div>
                </div>
                <button class="btn-action" id="task2" onclick="completeTask('task2', 2500, 'https://x.com')">Join</button>
            </div>
        </div>

        <!-- Mini-Game Page -->
        <div id="minigame-page" class="sub-page">
            <div class="page-title">Chubby Catch Game</div>
            <div style="text-align: center; margin-bottom: 10px;">
                <button class="btn-action" id="start-game-btn" onclick="startCatchGame()">Start Play</button>
            </div>
            <div id="purple-catch-game"></div>
        </div>

        <!-- Invite Page -->
        <div id="invite-page" class="sub-page">
            <div class="page-title">Friends & Invite</div>
            <div style="text-align: center; margin-top: 30px;">
                <button class="btn-action" onclick="copyInviteLink()">Copy Invite Link</button>
            </div>
        </div>

        <!-- Wallet Page -->
        <div id="wallet-page" class="sub-page">
            <div class="page-title">Connect Wallet</div>
            <div style="text-align: center; margin-top: 30px;">
                <button class="btn-action" onclick="alert('Connecting TON Wallet...')">Connect Wallet</button>
            </div>
        </div>

        <!-- Nav Bar -->
        <div class="navigation-bar">
            <div class="nav-link" id="nav-tasks" onclick="changeTab('tasks-page', 'nav-tasks')">Tasks</div>
            <div class="nav-link" id="nav-minigame" onclick="changeTab('minigame-page', 'nav-minigame')">Mini-Game</div>
            <div class="nav-link active" id="nav-game" onclick="changeTab('game-page', 'nav-game')">Games</div>
            <div class="nav-link" id="nav-invite" onclick="changeTab('invite-page', 'nav-invite')">Invite</div>
            <div class="nav-link" id="nav-wallet" onclick="changeTab('wallet-page', 'nav-wallet')">Wallet</div>
        </div>
    </div>

    <script>
        // لۆدکردنی خاڵە پارێزراوەکانی پێشوو لە localStorage
        let count = parseInt(localStorage.getItem('chubby_coins')) || 0;
        let liveEnergy = 500;
        let gameInterval;

        // نیشاندانی خاڵە لۆدبووەکان لە کاتی کردنەوەی پەیج
        document.getElementById('score').innerText = count;

        // پشکنیینی دۆخی تاسکەکان لە کاتی دەستپێکردن
        window.onload = function() {
            checkTaskStatus('task1');
            checkTaskStatus('task2');
        };

        function handleTapEvent(event) {
            if (liveEnergy > 0) {
                count += 1;
                liveEnergy -= 1;
                document.getElementById('score').innerText = count;
                document.getElementById('live-energy').innerText = liveEnergy;
                localStorage.setItem('chubby_coins', count); // پاشەکەوتکردنی خاڵەکانی تاپ تاپ
                createFloatingTextEffect(event);
            }
        }

        function createFloatingTextEffect(event) {
            let effect = document.createElement('div');
            effect.innerText = '+1';
            effect.style.position = 'absolute';
            effect.style.left = (event.clientX - 10) + 'px';
            effect.style.top = (event.clientY - 25) + 'px';
            effect.style.color = '#a48fff';
            effect.style.fontWeight = 'bold';
            effect.style.fontSize = '26px';
            effect.style.pointerEvents = 'none';
            effect.style.transition = 'all 0.5s ease-out';
            effect.style.zIndex = '100';
            document.body.appendChild(effect);
            setTimeout(() => { effect.style.transform = 'translateY(-60px)'; effect.style.opacity = '0'; }, 10);
