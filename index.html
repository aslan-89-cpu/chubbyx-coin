<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <title>ChubbyX Coin</title>
    <style>
        body {
            /* 🌌 وێنەی باگراوندی مۆرە نوێیەکە */
            background: url('image_l86T2P.png') no-repeat center center fixed;
            background-size: cover;
            color: white;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* بەشی سەرەوەی خاڵەکان */
        .header {
            margin-top: 40px;
            text-align: center;
            z-index: 5;
            background: rgba(13, 8, 27, 0.65);
            padding: 10px 30px;
            border-radius: 15px;
            border: 1px solid #7b2cbf;
            backdrop-filter: blur(5px);
        }
        .coin-count {
            font-size: 48px;
            font-weight: bold;
            color: #00f0ff; 
            text-shadow: 0px 4px 15px rgba(0, 240, 255, 0.6);
            margin: 5px 0;
        }
        .rank {
            font-size: 14px;
            color: #d8bbff; 
            letter-spacing: 1px;
        }

        /* 🎯 بازنەی تەپ-تەپ لە ناوەڕاست */
        .coin-container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 1;
            gap: 20px; 
        }
        
        /* 🪙 قەبارەی سکە زێڕینەکە لێرەدا بە زۆر فێکس کراوە بۆ ئەوەی ڕێک بێت */
        .tap-zone {
            width: 140px !important; 
            height: 140px !important;
            border-radius: 50%;
            cursor: pointer;
            background: url('chubbyx_coin.png') no-repeat center center !important;
            background-size: contain !important;
            box-shadow: 0 0 35px rgba(234, 179, 8, 0.6); 
            transition: transform 0.05s ease-in-out;
            -webkit-tap-highlight-color: transparent;
        }
        
        .tap-zone:active {
            transform: scale(0.92) !important; 
        }

        /* ⚡ شێوازی هێڵی وزە */
        .energy-container {
            width: 220px;
            text-align: center;
        }
        .energy-text {
            font-size: 14px;
            color: #eab308;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .energy-bar-bg {
            width: 100%;
            height: 12px;
            background: rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            border: 1px solid #7b2cbf;
            overflow: hidden;
        }
        .energy-bar-fill {
            width: 100%; 
            height: 100%;
            background: linear-gradient(90deg, #eab308, #ffeb3b);
            border-radius: 10px;
            transition: width 0.1s ease;
        }

        /* مێنیۆی خوارەوە */
        .nav-bar {
            width: 100%;
            background: rgba(13, 8, 27, 0.95);
            border-top: 2px solid #7b2cbf; 
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            position: absolute;
            bottom: 0;
            z-index: 20; 
        }
        .nav-item {
            font-size: 12px;
            color: #9d4edd;
            cursor: pointer;
            text-align: center;
            flex: 1;
        }
        .nav-item.active {
            color: #00f0ff; 
            font-weight: bold;
        }
        .nav-item span {
            display: block;
            font-size: 24px;
            margin-bottom: 4px;
        }

        /* لاپەڕەکانی تری ناو یارییەکە */
        .page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: rgba(9, 5, 20, 0.96); 
            backdrop-filter: blur(10px);
            box-sizing: border-box;
            padding: 20px;
            padding-top: 60px; 
            padding-bottom: 90px;
            overflow-y: auto;
            z-index: 10;
        }
        .page-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #7b2cbf;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }
        .close-btn {
            background: #7b2cbf; 
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        .item-list {
            background: #180e29;
            border-radius: 10px;
            padding: 15px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #3c1661;
        }
        .action-btn {
            background: #9d4edd; 
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
        }
        .btn-group {
            display: flex;
            gap: 10px;
        }
        .join-btn {
            background: #0098ea;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
    </style>

    <script type="module">
        import { initializeApp } from "https://gstatic.com";
        import { getFirestore, doc, setDoc, getDoc } from "https://gstatic.com";

        // 🔥 زانیاری بەستنەوەی فەرمی پڕۆژەکەت
        const firebaseConfig = {
            apiKey: "AIzaSyCp--Gof48EWzxWSkiFB8B6mW-Qcsdaolw",
            authDomain: "://firebaseapp.com",
            projectId: "chubbyx-db",
            storageBucket: "chubbyx-db.firebasestorage.app",
            messagingSenderId: "469899376640",
            appId: "1:469899376640:web:dba28ce4d30c8c01ed0ae5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        let count = 0;
        let energy = 500;
        const maxEnergy = 500;
        let userId = "user_" + Math.floor(Math.random() * 100000); 
        let taskCompleted = false;

        const scoreDisplay = document.getElementById('score');
        const tapCoin = document.getElementById('tapCoin');
        const energyText = document.getElementById('energyText');
        const energyFill = document.getElementById('energyFill');

        const urlParams = new URLSearchParams(window.location.search);
        const referrerId = urlParams.get('ref');

        async function loadUserData() {
            try {
                const docRef = doc(db, "players", userId);
                const docSnap = await getDoc(docRef);
                
                if (docSnap.exists()) {
                    count = docSnap.data().coins || 0;
                    taskCompleted = docSnap.data().tgTask || false;
                    scoreDisplay.innerText = count;
                    if(taskCompleted) {
                        document.getElementById('taskBtnGroup').innerHTML = '<span style="color:#22c55e; font-weight:bold;">Completed ✓</span>';
                    }
                } else {
                    await setDoc(docRef, { coins: 0, username: userId, tgTask: false, invitedBy: referrerId || null });
                    
                    if (referrerId) {
                        const refRef = doc(db, "players", referrerId);
                        const refSnap = await getDoc(refRef);
                        if (refSnap.exists()) {
                            let currentRefCoins = refSnap.data().coins || 0;
                            await setDoc(refRef, { coins: currentRefCoins + 5000 }, { merge: true });
                        }
                    }
                }
            } catch (e) {
                console.error("Error loading data: ", e);
            }
        }
        loadUserData();

        async function saveCoinsToDB() {
            try {
                await setDoc(doc(db, "players", userId), { coins: count }, { merge: true });
            } catch (e) {
                console.error("Error saving data: ", e);
            }
        }

        tapCoin.addEventListener('click', () => {
            if (energy > 0) {
                count += 1;
                energy -= 1; 
                scoreDisplay.innerText = count;
                updateEnergyUI();
                saveCoinsToDB(); 
            }
        });

        setInterval(() => {
            if (energy < maxEnergy) {
                energy += 3;
                if (energy > maxEnergy) energy = maxEnergy;
                updateEnergyUI();
            }
        }, 1000);

        function updateEnergyUI() {
            energyText.innerText = energy;
            const percentage = (energy / maxEnergy) * 100;
            energyFill.style.width = percentage + '%';
        }

        window.openPage = function(pageId, btnId) {
            closeAllPages();
            document.getElementById(pageId).style.display = 'block';
            document.getElementById('mainGameContainer').style.display = 'none';
            document.getElementById('mainHeader').style.display = 'none';
            document.querySelectorAll('.nav-bar .nav-item').forEach(item => item.classList.remove('active'));
            document.getElementById(btnId).classList.add('active');
        }

        window.showMainGame = function() {
            closeAllPages();
