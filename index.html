<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Premium Hub</title>
    <!-- Core SDKs: Telegram & TON Connect -->
    <script src="https://telegram.org"></script>
    <script src="https://unpkg.com"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #0f0a24;
            color: white;
            font-family: 'Arial', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        .header { margin-top: 40px; text-align: center; }
        .header div { font-size: 14px; opacity: 0.7; letter-spacing: 2px; }
        .header h1 { font-size: 48px; font-weight: bold; color: #fff; margin-top: 5px; }
        
        /* Game Screen */
        .game-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
        }
        .coin-btn {
            width: 240px;
            height: 240px;
            border-radius: 50%;
            background: radial-gradient(circle, #facc15 0%, #ca8a04 100%);
            box-shadow: 0 0 30px rgba(250, 204, 21, 0.4);
            cursor: pointer;
            transition: transform 0.05s ease;
            -webkit-tap-highlight-color: transparent;
        }
        .coin-btn:active { transform: scale(0.92); }
        
        .energy-box { margin-top: 30px; text-align: center; width: 80%; }
        .bar-bg { width: 100%; height: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; margin-top: 8px; overflow: hidden; }
        .bar-fill { height: 100%; width: 100%; background: #facc15; transition: width 0.1s ease; }

        /* Wallet Screen (Hidden by default) */
        .wallet-screen {
            display: none;
            flex: 1;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            width: 100%;
            padding: 20px;
        }
        .wallet-screen h2 { font-size: 28px; margin-bottom: 10px; }
        .wallet-screen p { color: #a1a1aa; margin-bottom: 30px; }

        /* Navigation Bar */
        .nav-bar {
            width: 100%;
            background: #070412;
            border-top: 1px solid #27272a;
            display: flex;
            position: fixed;
            bottom: 0;
            padding: 15px 10px calc(15px + env(safe-area-inset-bottom));
        }
        .nav-item { flex: 1; text-align: center; font-size: 14px; color: #71717a; cursor: pointer; font-weight: bold; }
        .nav-item.active { color: #facc15; }
    </style>
</head>
<body>

    <!-- 1. GAME TAB -->
    <div id="gameTab" class="game-screen">
        <div class="header">
            <div>CHUBBYX BALANCE</div>
            <h1 id="score">0</h1>
        </div>
        <div style="flex:1; display:flex; align-items:center;">
            <div class="coin-btn" id="tapButton"></div>
        </div>
        <div class="energy-box">
            <div>⚡ <span id="energyText">500</span> / 500</div>
            <div class="bar-bg"><div class="bar-fill" id="energyFill"></div></div>
        </div>
    </div>

    <!-- 2. WALLET TAB -->
    <div id="walletTab" class="wallet-screen">
        <h2>Connect Wallet</h2>
        <p>Link your TON wallet to receive your airdrop tokens</p>
        <!-- TON Connect Button Renders Here Directly -->
        <div id="ton-connect-btn"></div>
    </div>

    <!-- NAVIGATION -->
    <div class="nav-bar">
        <div class="nav-item active" id="btnGame" onclick="switchTab('game')">Game</div>
        <div class="nav-item" id="btnWallet" onclick="switchTab('wallet')">Wallet</div>
    </div>

    <script>
        // Initialize Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Initialize TON Connect UI Directly inside the app!
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://netlify.app',
            buttonRootId: 'ton-connect-btn'
        });

        // Game Logic
        let count = parseInt(localStorage.getItem('chubby_coins')) || 0;
        let energy = 500;
        document.getElementById('score').innerText = count.toLocaleString();

        document.getElementById('tapButton').addEventListener('touchstart', function(e) {
            e.preventDefault();
            if (energy > 0) {
                count++;
                energy--;
                document.getElementById('score').innerText = count.toLocaleString();
                localStorage.setItem('chubby_coins', count);
                document.getElementById('energyText').innerText = energy;
                document.getElementById('energyFill').style.width = (energy / 500 * 100) + '%';
            }
        });

        // Energy Recovery
        setInterval(() => {
            if (energy < 500) {
                energy = Math.min(500, energy + 3);
                document.getElementById('energyText').innerText = energy;
                document.getElementById('energyFill').style.width = (energy / 500 * 100) + '%';
            }
        }, 1000);

        // Tab Switching Logic (No iframes, No Crashes!)
        function switchTab(tab) {
            const gameTab = document.getElementById('gameTab');
            const walletTab = document.getElementById('walletTab');
            const btnGame = document.getElementById('btnGame');
            const btnWallet = document.getElementById('btnWallet');

            if (tab === 'game') {
                gameTab.style.display = 'flex';
                walletTab.style.display = 'none';
                btnGame.classList.add('active');
                btnWallet.classList.remove('active');
            } else if (tab === 'wallet') {
                gameTab.style.display = 'none';
                walletTab.style.display = 'flex';
                btnGame.classList.remove('active');
                btnWallet.classList.add('active');
            }
        }
    </script>
</body>
</html>
