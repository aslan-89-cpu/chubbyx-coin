<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Mining Hub</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: #1c1437 url('background.jpg') no-repeat center top -120px fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .header-status {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 0 20px;
            z-index: 10;
        }
        .user-badge {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .user-name { font-weight: bold; font-size: 16px; color: #fff; }
        .lvl-tag {
            background: rgba(234, 179, 8, 0.15);
            border: 1px solid #eab308;
            color: #eab308;
            padding: 2px 8px;
            border-radius: 12px;
            font-size: 11px;
            font-weight: bold;
            display: inline-block;
            width: fit-content;
        }
        
        .main-layout {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            padding: 20px;
            position: relative;
        }

        .assets-title { font-size: 14px; color: #bbb; letter-spacing: 1px; margin-top: 10px; opacity: 0.8; }
        .balance-display { font-size: 32px; font-weight: bold; color: #fff; margin: 5px 0 15px 0; }

        .pool-box {
            background: rgba(0, 0, 0, 0.55);
            border: 1px solid rgba(255, 255, 255, 0.15);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            color: #aaa;
            margin-bottom: 20px;
            backdrop-filter: blur(5px);
        }
        .pool-box span { color: #fff; font-weight: bold; }

        .mining-profit {
            font-size: 36px;
            font-weight: bold;
            color: #22c55e;
            text-shadow: 0 0 15px rgba(34, 197, 94, 0.4);
            margin-bottom: 25px;
        }

        .coin-wrapper {
            position: relative;
            width: 300px;
            height: 300px;
            margin-bottom: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        /* گەڕانەوەی تەواوی ناوچەی کلیکی تاپ-تاپی ئەسڵی لەسەر بووکەڵەکەت */
        .transparent-tap-zone {
            width: 260px;
            height: 260px;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            z-index: 999;
            touch-action: manipulation;
            transition: transform 0.05s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .transparent-tap-zone-active { 
            transform: scale(0.93) !important; 
        }

        .floating-text {
            position: absolute;
            color: #eab308;
            font-weight: bold;
            font-size: 26px;
            pointer-events: none;
            z-index: 1000;
            animation: floatUp 0.6s ease-out forwards;
            text-shadow: 0 0 8px rgba(234, 179, 8, 0.7);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-130px) scale(1.2); }
        }

        .claim-btn {
            width: 100%;
            max-width: 340px;
            background: #eab308;
            color: #000;
            border: none;
            padding: 16px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(234, 179, 8, 0.3);
            margin-bottom: 100px;
        }
        .claim-btn:active { transform: scale(0.98); }

        /* لاپەڕە داینامیکییەکان */
        .dynamic-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: calc(100vh - 85px);
            background: #0d081b;
            z-index: 1500;
            padding: 40px 20px;
            flex-direction: column;
            align-items: center;
        }
        .dynamic-page.active { display: flex; }
        .page-title { font-size: 26px; font-weight: bold; margin-bottom: 25px; color: #eab308; }

        .bottom-nav {
            width: 100%;
            background: #05030a;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            position: fixed;
            bottom: 0;
            padding: 15px 15px calc(25px + env(safe-area-inset-bottom));
            z-index: 2000;
        }
        .nav-link { flex: 1; text-align: center; font-size: 13px; color: #666; text-decoration: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 500; }
        .nav-link.active { color: #eab308; font-weight: bold; }
        .nav-icon { font-size: 20px; }
    </style>
</head>
<body>

    <div class="header-status">
        <div class="user-badge">
            <span class="user-name">ChubbyX Miner</span>
            <span class="lvl-tag">Lvl 1 • READY</span>
        </div>
    </div>

    <!-- 🏠 ڕوونمای سەرەکی ماینینگ -->
    <div class="main-layout" id="mine-layout">
        <span class="assets-title">CHUBBYX BALANCE</span>
        <div class="balance-display" id="main-score">0</div>
        
        <div class="pool-box">POOL WALLET: <span id="pool-score">0.0000</span></div>
        
        <div class="mining-profit" id="mining-live">+0.0000</div>

        <!-- ناوچەی کلیکی گەشەسەندوو لەسەر بووکەڵەکەت -->
        <div class="coin-wrapper" id="coinContainer">
            <div class="transparent-tap-zone" id="clickCoin"></div>
        </div>

        <button class="claim-btn" id="claimAction">Claim</button>
    </div>

    <!-- لاپەڕە داینامیکییەکانی تر -->
    <div id="tasks-page" class="dynamic-page"><h2 class="page-title">Tasks List</h2></div>
    <div id="miners-page" class="dynamic-page"><h2 class="page-title">Miners Upgrade</h2></div>
    <div id="friends-page" class="dynamic-page"><h2 class="page-title">Friends Referral</h2></div>
    <div id="profile-page" class="dynamic-page"><h2 class="page-title">User Profile</h2></div>

    <div class="bottom-nav">
        <div class="nav-link active" id="default-nav" onclick="switchPage('mine', this)">
            <span class="nav-icon">⛏️</span><span>Mine</span>
        </div>
        <div class="nav-link" onclick="switchPage('tasks', this)">
            <span class="nav-icon">📋</span><span>Tasks</span>
        </div>
        <div class="nav-link" onclick="switchPage('miners', this)">
            <span class="nav-icon">⚡</span><span>Miners</span>
        </div>
        <div class="nav-link" onclick="switchPage('friends', this)">
            <span class="nav-icon">👥</span><span>Friends</span>
        </div>
        <div class="nav-link" onclick="switchPage('profile', this)">
            <span class="nav-icon">👤</span><span>Profile</span>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // ڕێکخستنی یەکجاری متغیرەکان بەو شێوازەی لە کۆدە ئەسڵییەکەتدا بێ کێشە کار دەکات
        var count = parseInt(localStorage.getItem('chubby_coins')) || 0;
        var poolBalance = parseFloat(localStorage.getItem('cx_pool_balance')) || 0;
        
        document.getElementById('main-score').innerText = count.toLocaleString();
        document.getElementById('pool-score').innerText = poolBalance.toFixed(4);

        // پرۆسەی ماینینگی کاتی
        setInterval(function() {
            var pendingProfit = Math.random() * 0.0005; 
            poolBalance += pendingProfit;
            
            document.getElementById('mining-live').innerText = "+" + pendingProfit.toFixed(4);
            document.getElementById('pool-score').innerText = poolBalance.toFixed(4);
            
            localStorage.setItem('cx_pool_balance', poolBalance);
        }, 1500);

        // دوگمەی CLAIM
        document.getElementById('claimAction').addEventListener('click', function() {
            if (poolBalance > 0) {
                count += Math.floor(poolBalance * 100); // گۆڕینی داتای پاشەکەوت بۆ کۆینی تەواو
                alert("Successfully Claimed ChubbyX Coins! 🚀");
                poolBalance = 0;
                
                document.getElementById('main-score').innerText = count.toLocaleString();
                document.getElementById('pool-score').innerText = poolBalance.toFixed(4);
                
                localStorage.setItem('chubby_coins', count);
                localStorage.setItem('cx_pool_balance', poolBalance);
            } else {
                alert("No balance available to claim!");
            }
        });

        // چالاککردنی لێدانی تاپ-تاپ و بەرکەوتنی فرە-پەنجە (Multi-touch) ڕێک وەک هۆکەکەی خۆت
        var tapElement = document.getElementById('clickCoin');
        var coinContainer = document.getElementById('coinContainer');
