<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Hub</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #1c1437 url('background.png.jpeg') no-repeat center center fixed;
            background-size: cover;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        .header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 0 20px;
            z-index: 10;
        }
        .btn-top {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .header {
            margin-top: 15px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        .header div { font-size: 13px; opacity: 0.8; letter-spacing: 1px; }
        .header h1 { font-size: 32px; font-weight: 900; margin-top: 5px; color: #ffd666; text-shadow: 0px 2px 4px rgba(0,0,0,0.5); }

        /* بەشی گشتی بۆ پیشاندانی یاری سەرەکی یان لاپەڕەکانی تر */
        .main-content {
            flex: 1;
            width: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            position: relative;
        }
        .coin-container {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 300px;
            position: relative;
        }
        .tap-zone {
            width: 270px;
            height: 270px;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
            transition: transform 0.05s ease;
        }
        .tap-zone-active {
            transform: scale(0.92) !important;
        }
        .floating-text {
            position: absolute;
            color: #ffd666;
            font-weight: bold;
            font-size: 26px;
            pointer-events: none;
            z-index: 1000;
            animation: floatUpAndFade 0.6s ease-out forwards;
            text-shadow: 0 0 8px rgba(234, 179, 8, 0.7);
        }
        @keyframes floatUpAndFade {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-130px) scale(1.2); }
        }
        .energy-container {
            width: 80%;
            text-align: center;
            margin-bottom: 40px;
            pointer-events: none;
        }
        .energy-bar-bg { width: 100%; height: 12px; background: rgba(255,255,255,0.2); border-radius: 6px; margin-top: 8px; overflow: hidden; }
        .energy-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #eab308, #ef4444); border-radius: 6px; transition: width 0.1s ease; }

        /* بەشی ڕووکاری ناوخۆیی بۆ فایلی ناو JSەکان */
        .dynamic-view {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            text-align: center;
        }
        .dynamic-view.active { display: flex; }

        .nav-bar {
            width: 100%;
            background: rgba(13, 8, 27, 0.96);
            border-top: 2px solid #7b2cbf;
            display: flex;
            padding: 12px 10px calc(12px + env(safe-area-inset-bottom));
            z-index: 2000;
            margin-top: auto;
        }
        .nav-item { flex: 1; text-align: center; font-size: 11px; color: #8d4add; text-decoration: none; cursor: pointer; padding: 5px 0; font-weight: bold; transition: color 0.2s; }
        .nav-item.active { color: white; }
    </style>
</head>
<body>

    <div class="header-bar">
        <button class="btn-top" onclick="showJSPage('menu')">☰ Menu</button>
        <button class="btn-top" onclick="showJSPage('airdrop')">🎁 Airdrop</button>
    </div>

    <!-- ئەم بەشە سەرەکییە ناوەڕۆکەکە دەگۆڕێت -->
    <div class="main-content" id="mainLayout">
        
        <!-- یاری سەرەکی (Tap Game) -->
        <div id="game-view" style="display: flex; flex-direction: column; align-items: center; width: 100%;">
            <div class="header">
                <div>CHUBBYX BALANCE</div>
                <h1 id="score">0</h1>
            </div>

            <div class="coin-container" id="coinContainer">
                <div class="tap-zone" id="tapCoin"></div>
            </div>

            <div class="energy-container">
                <div>⚡ <span id="energyText">500</span> / 500</div>
                <div class="energy-bar-bg"><div class="energy-bar-fill" id="energyFill"></div></div>
            </div>
        </div>

        <!-- بەشە داینامیکییەکان کە لە ناو فایلە JSەکانەوە کۆنترۆڵ دەکرێن -->
        <div id="tasks-view" class="dynamic-view"></div>
        <div id="invite-view" class="dynamic-view"></div>
        <div id="mini-games-view" class="dynamic-view"></div>
        <div id="wallet-view" class="dynamic-view"></div>
        <div id="airdrop-view" class="dynamic-view"></div>
        <div id="menu-view" class="dynamic-view"></div>

    </div>

    <div class="nav-bar">
        <div class="nav-item" onclick="showJSPage('tasks', this)">Tasks</div>
        <div class="nav-item" onclick="showJSPage('invite', this)">Invite</div>
        <div class="nav-item" onclick="showJSPage('home', this)">Games</div>
        <div class="nav-item" onclick="showJSPage('mini-games', this)">Mini Games</div>
        <div class="nav-item" onclick="showJSPage('wallet', this)">Wallet</div>
    </div>

    <!-- لۆجیکی سەرەکی یارییەکە و گۆڕینی لاپەڕەکان -->
    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        var count = parseInt(localStorage.getItem('chubby_coins')) || 0;
        var energy = parseInt(localStorage.getItem('chubby_energy')) || 500;

        document.getElementById('score').innerText = count.toLocaleString();
        updateUI();

        var tapElement = document.getElementById('tapCoin');
        var coinContainer = document.getElementById('coinContainer');

        if (tapElement) {
            tapElement.addEventListener('touchstart', function(e) {
                e.preventDefault();
                if (energy > 0) {
                    count++;
                    energy--;
                    document.getElementById('score').innerText = count.toLocaleString();
                    updateUI();
                    localStorage.setItem('chubby_coins', count);
                    localStorage.setItem('chubby_energy', energy);

                    playChubbVoice();
                    tapElement.classList.add('tap-zone-active');

                    var touch = e.touches[0];
                    var rect = coinContainer.getBoundingClientRect();
                    var x = touch.clientX - rect.left;
                    var y = touch.clientY - rect.top;

                    createFloatingText(x, y);
                }
            });

            tapElement.addEventListener('touchend', function(e) {
                setTimeout(() => { tapElement.classList.remove('tap-zone-active'); }, 50);
            });
        }

        function playChubbVoice() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                var utterance = new SpeechSynthesisUtterance('Chub');
                utterance.lang = 'en-US';
                utterance.pitch = 1.4;
                utterance.rate = 1.6;
                window.speechSynthesis.speak(utterance);
            }
        }

        function createFloatingText(x, y) {
            var textNode = document.createElement('div');
            textNode.className = 'floating-text';
            textNode.innerText = '+1';
            textNode.style.left = (x - 20) + 'px';
            textNode.style.top = (y - 20) + 'px';
            coinContainer.appendChild(textNode);
            setTimeout(() => { textNode.remove(); }, 600);
        }

        function updateUI() {
            document.getElementById('energyText').innerText = energy;
            document.getElementById('energyFill').style.width = (energy / 500 * 100) + '%';
        }

        setInterval(function() {
            if (energy < 500) { 
                energy += 3; 
                if (energy > 500) energy = 500; 
                updateUI(); 
                localStorage.setItem('chubby_energy', energy);
            }
        }, 1000);

        // فەنکشنی گۆڕینی لاپەڕەکان بە شێوازی داینامیکی لۆکاڵی
        function showJSPage(pageId, element) {
            // شاردنەوەی یاری سەرەکی و هەموو بەشەکانی تر
            document.getElementById('game-view').style.display = 'none';
            document.querySelectorAll('.dynamic-view').forEach(view => view.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));

            if (pageId === 'home') {
