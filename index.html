<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Mini App</title>
    <style>
        * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
        body, html { width: 100%; height: 100%; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #000; }
        .app-container { width: 100%; height: 100%; background: url('background.jpg') no-repeat center center; background-size: cover; position: relative; display: flex; flex-direction: column; justify-content: space-between; }
        .header-bar { display: flex; justify-content: space-between; align-items: center; padding: 20px 15px; z-index: 10; }
        .btn-top { background: rgba(255, 255, 255, 0.15); backdrop-filter: blur(5px); border: 1px solid rgba(255, 255, 255, 0.2); color: white; padding: 10px 18px; border-radius: 25px; font-weight: bold; font-size: 14px; cursor: pointer; }
        .btn-back-home { background: rgba(255, 68, 68, 0.2); border: 1px solid rgba(255, 68, 68, 0.4); color: #ff4444; padding: 8px 16px; border-radius: 20px; font-size: 13px; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
        .tab-content { display: none; flex-grow: 1; width: 100%; height: 100%; text-align: center; flex-direction: column; justify-content: center; align-items: center; padding: 20px; position: relative; }
        .tab-content.active { display: flex; }
        .game-main-layout { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; height: 100%; width: 100%; padding-top: 15px; }
        .score-box { background: rgba(0, 0, 0, 0.55); backdrop-filter: blur(8px); padding: 10px 25px; border-radius: 30px; border: 1px solid rgba(255,255,255,0.18); display: flex; align-items: center; gap: 10px; margin-top: 45px; margin-bottom: 20px; z-index: 5; }
        .score-display { font-size: 38px; font-weight: 900; color: #ffe066; text-shadow: 0px 2px 8px rgba(0,0,0,0.7); }
        .coin-title { font-size: 20px; color: #fff; font-weight: bold; }
        .coin-container { position: relative; cursor: pointer; width: 100%; flex-grow: 1; display: flex; justify-content: center; align-items: center; z-index: 4; }
        .tap-area-overlay { width: 100%; height: 100%; background: transparent; }
        .tab-title { font-size: 28px; margin-bottom: 5px; color: white; }
        .tab-desc { font-size: 16px; color: #ccc; margin-bottom: 25px; }
        .task-card { background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(10px); padding: 15px 20px; border-radius: 15px; width: 90%; max-width: 350px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; cursor: pointer; color: white; }
        .navbar-bottom { background: rgba(15, 15, 25, 0.9); backdrop-filter: blur(15px); display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid rgba(255, 255, 255, 0.1); z-index: 100; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: #888; font-size: 12px; cursor: pointer; width: 25%; }
        .nav-item.active { color: #0066ff; font-weight: bold; }
        .nav-icon { font-size: 22px; margin-bottom: 4px; }
    </style>
</head>
<body>
    <div class="app-container">
        <div class="header-bar">
            <button class="btn-top" onclick="alert('Menu Open')">☰ Menu</button>
            <button class="btn-top" onclick="showTab('airdrop')">🎁 Airdrop</button>
        </div>
        <div id="home" class="tab-content active">
            <div class="game-main-layout">
                <div class="score-box">
                    <span class="score-display" id="score">0</span>
                    <span class="coin-title">ChubbyX</span>
                </div>
                <div class="coin-container" id="tap-zone"><div class="tap-area-overlay"></div></div>
            </div>
        </div>
        <div id="invite" class="tab-content">
            <button class="btn-back-home" onclick="returnToHome()">⬅️ Back to Home</button>
            <h2 class="tab-title">Invite Friends</h2>
            <button class="btn-top" style="background:#0066ff;" onclick="copyInviteLink()">Copy Link</button>
        </div>
        <div id="tasks" class="tab-content">
            <button class="btn-back-home" onclick="returnToHome()">⬅️ Back to Home</button>
            <h2 class="tab-title">Tasks List</h2>
            <div class="task-card" onclick="completeTask('tg')"><span>🔹 Join Telegram</span><span style="color:#0066ff;">+5,000</span></div>
            <div class="task-card" onclick="completeTask('x')"><span>🔹 Follow X</span><span style="color:#0066ff;">+5,000</span></div>
        </div>
        <div id="wallet" class="tab-content">
            <button class="btn-back-home" onclick="returnToHome()">⬅️ Back to Home</button>
            <h2 class="tab-title">Connect Wallet</h2>
            <div style="background:white; color:black; padding:10px; border-radius:10px;" onclick="alert('Connecting...')">Connect TON Wallet</div>
        </div>
        <div id="airdrop" class="tab-content">
            <button class="btn-back-home" onclick="returnToHome()">⬅️ Back to Home</button>
            <h2 class="tab-title">Airdrop Listing Soon!</h2>
        </div>
        <nav class="navbar-bottom">
            <div class="nav-item active" id="nav-home" onclick="showTab('home', this)"><span class="nav-icon">🏠</span><span>Home</span></div>
            <div class="nav-item" id="nav-invite" onclick="showTab('invite', this)"><span class="nav-icon">👥</span><span>Invite</span></div>
            <div class="nav-item" id="nav-tasks" onclick="showTab('tasks', this)"><span class="nav-icon">📋</span><span>Tasks</span></div>
            <div class="nav-item" id="nav-wallet" onclick="showTab('wallet', this)"><span class="nav-icon">💼</span><span>Wallet</span></div>
        </nav>
    </div>
    <script>
        function showTab(t,e){document.querySelectorAll('.tab-content').forEach(c=>c.classList.remove('active'));document.getElementById(t).classList.add('active');document.querySelectorAll('.nav-item').forEach(i=>i.classList.remove('active'));if(e)e.classList.add('active');else document.getElementById(nav-${t}).classList.add('active');}
        function returnToHome(){showTab('home',document.getElementById('nav-home'));}
        let score=parseInt(localStorage.getItem('chubby_score'))||0; document.getElementById('score').innerText=score;
        document.getElementById('tap-zone').addEventListener('click',(e)=>{score+=1;document.getElementById('score').innerText=score;localStorage.setItem('chubby_score',score);createTapEffect(e);});
        function createTapEffect(e){let t=document.createElement('div');t.innerText='+1';t.style.position='absolute';t.style.left=${e.clientX-10}px;t.style.top=${e.clientY-20}px;t.style.color='#ffe066';t.style.fontWeight='bold';t.style.fontSize='32px';t.style.pointerEvents='none';t.style.textShadow='0 2px 5px #000';t.style.transition='transform 0.4s, opacity 0.4s';document.body.appendChild(t);setTimeout(()=>{t.style.transform='translateY(-80px) scale(1.3)';t.style.opacity='0';},10);setTimeout(()=>t.remove(),400);}
        function completeTask(i){if(localStorage.getItem(td_${i})){alert("Already done!");return;}window.open(i==='tg'?'https://t.me':'https://x.com','_blank');setTimeout(()=>{score+=5000;localStorage.setItem('chubby_score',score);document.getElementById('score').innerText=score;localStorage.setItem(td_${i},'1');alert("Success +5,000 Coins! 🎉");},2500);}
        function copyInviteLink(){navigator.clipboard.writeText("https://t.me").then(()=>{alert("Link Copied!");score+=3000;localStorage.setItem('chubby_score',score);document.getElementById('score').innerText=score;});}
    </script>
</body>
</html>
