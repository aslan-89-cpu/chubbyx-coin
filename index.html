<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChubbyX Coin</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { background: #090514 url('image.png.jpeg') no-repeat center fixed; background-size: cover; color: white; font-family: sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; height: 100vh; overflow: hidden; user-select: none; }
        .header { margin-top: 40px; text-align: center; }
        .coin-container { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 25px; }
        .tap-zone { width: 185px; height: 185px; border-radius: 50%; cursor: pointer; background: url('image_okKb6u.png.jpeg') no-repeat center; background-size: contain; box-shadow: 0 0 35px rgba(104, 179, 8, 0.6); }
        .tap-zone:active { transform: scale(0.92); }
        .energy-container { width: 220px; text-align: center; }
        .energy-bar-bg { width: 100%; height: 12px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; border: 1px solid #7b2cbf; }
        .energy-bar-fill { width: 100%; height: 100%; background: #eab308; }
        .nav-bar { width: 100%; background: rgba(13, 8, 27, 0.95); border-top: 2px solid #7b2cbf; display: flex; position: absolute; bottom: 0; padding: 15px 0; }
        .nav-item { font-size: 14px; color: #9d4edd; cursor: pointer; flex: 1; text-align: center; }
        .page { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100vh; background: #090514; padding: 20px; box-sizing: border-box; z-index: 100; }
        .page-header { display: flex; justify-content: space-between; border-bottom: 1px solid #7b2cbf; }
        .close-btn { background: #7b2cbf; color: white; border: none; padding: 5px 15px; border-radius: 5px; }
    </style>
</head>
<body>
    <div class="header"><div>ChubbyX Balance</div><h1 id="score">0</h1></div>
    <div class="coin-container">
        <div class="tap-zone" id="tapCoin"></div>
        <div class="energy-container">
            <div><span id="energyText">500</span>/500</div>
            <div class="energy-bar-bg"><div class="energy-bar-fill" id="energyFill"></div></div>
        </div>
    </div>
    <div id="tasksPage" class="page"><div class="page-header"><h2>Tasks</h2><button class="close-btn" onclick="showMainGame()">X</button></div><p>Tasks coming soon!</p></div>
    <div id="walletPage" class="page"><div class="page-header"><h2>Wallet</h2><button class="close-btn" onclick="showMainGame()">X</button></div><p>Connect TON Wallet coming soon!</p></div>
    <div class="nav-bar">
        <div class="nav-item" onclick="openPage('tasksPage')">Tasks</div>
        <div class="nav-item" onclick="openPage('walletPage')">Wallet</div>
    </div>
    <script>
        var count = parseInt(localStorage.getItem('chubby_coins')) || 0;
        var energy = 500;
        document.getElementById('score').innerText = count;
        document.getElementById('tapCoin').addEventListener('click', function() {
            if (energy > 0) { count++; energy--; document.getElementById('score').innerText = count; updateUI(); localStorage.setItem('chubby_coins', count); }
        });
        function updateUI() { document.getElementById('energyText').innerText = energy; document.getElementById('energyFill').style.width = (energy / 500 * 100) + '%'; }
        setInterval(function() { if (energy < 500) { energy += 3; if (energy > 500) energy = 500; updateUI(); } }, 1000);
        function openPage(id) { document.querySelectorAll('.page').forEach(p => p.style.display = 'none'); document.getElementById(id).style.display = 'block'; }
        function showMainGame() { document.querySelectorAll('.page').forEach(p => p.style.display = 'none'); }
    </script>
</body>
</html>
