<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChubbyX Coin</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('image.png.jpeg');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: white;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }
        .header-container {
            position: relative;
            padding: 20px;
            margin-top: 30px;
        }
        .airdrop-icon {
            position: absolute;
            top: 25px;
            right: 25px;
            text-align: center;
            text-decoration: none;
            color: #ffca28;
            font-size: 14px;
            font-weight: bold;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.8);
        }
        .balance-title {
            font-size: 14px;
            color: #ccc;
            letter-spacing: 1px;
            margin: 0;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .balance-amount {
            font-size: 45px;
            margin: 5px 0 0 0;
            font-weight: bold;
            text-shadow: 0px 2px 4px rgba(0, 0, 0, 0.5);
        }
        .main-avatar {
            width: 250px;
            margin: 20px auto;
            display: block;
            border-radius: 20px;
            box-shadow: 0px 4px 15px rgba(0, 0, 0, 0.6);
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #110722;
            display: flex;
            justify-content: space-around;
            padding: 15px 0;
            border-top: 2px solid #3c1e70;
            z-index: 100;
        }
        .nav-item {
            color: #a29bfe;
            text-decoration: none;
            font-size: 14px;
            font-weight: bold;
        }
        .nav-item.active {
            color: #fdcb6e;
        }
    </style>
</head>
<body>

    <div class="header-container">
        <!-- ناونیشانی تەواوی جزدان بۆ ئەوەی ئایفۆن ڕاستەوخۆ بی کاتەوە -->
        <a href="https://github.io" class="airdrop-icon">AIRDROP</a>
        <p class="balance-title">CHUBBYX BALANCE</p>
        <h1 class="balance-amount">80,135</h1>
    </div>

    <img src="image_okKb6u.png.jpeg" alt="Chubby Avatar" class="main-avatar">

    <div style="height: 100px;"></div>

    <!-- ناونیشانی تەواوی لاپەڕەکان بۆ مینیووی خوارەوە -->
    <div class="bottom-nav">
        <a href="https://github.io" class="nav-item">Tasks</a>
        <a href="https://github.io" class="nav-item">Invite</a>
        <a href="https://github.io" class="nav-item active">Mini Games</a>
        <a href="https://github.io" class="nav-item">Wallet</a>
    </div>

</body>
</html>
