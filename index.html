<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Hub</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            /* ⚠️ لێرەدا پاشگری وێنەکە گۆڕدرا تەنها بۆ background.jpg */
            background: #1c1437 url('background.jpg') no-repeat center top fixed;
            background-size: cover;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            touch-action: none;
        }
        .header {
            margin-top: 35px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        .header div { font-size: 14px; opacity: 0.8; letter-spacing: 1px; }
        .header h1 { font-size: 32px; font-weight: bold; margin-top: 5px; }

        .coin-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            z-index: 5;
        }
        .tap-zone {
            position: absolute;
            top: 25%;
            width: 260px;
            height: 260px;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
            z-index: 999;
            touch-action: manipulation;
            transition: transform 0.05s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .tap-zone-active {
            transform: scale(0.93) !important;
        }
        .floating-text {
            position: absolute;
            color: #eab308;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            z-index: 1000;
            animation: floatUpAndFade 0.6s ease-out forwards;
        }
        @keyframes floatUpAndFade {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-130px) scale(1.2); }
        }
        .energy-container {
            width: 80%;
            text-align: center;
            z-index: 10;
            margin-bottom: 105px;
            pointer-events: none;
        }
        .energy-bar-bg { width: 100%; height: 12px; background: rgba(255,255,255,0.2); border-radius: 6px; margin-top: 8px; overflow: hidden; }
        .energy-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #eab308, #ef4444); border-radius: 6px; transition: width 0.1s ease; }

        /* ناوچەی پیشاندانی لاپەڕە داینامیکییەکان */
        .dynamic-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: calc(100vh - 70px);
            background: #0d081b;
            z-index: 1500;
            padding: 30px 20px;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
        }
        .dynamic-view.active {
            display: flex;
        }

        .nav-bar {
            width: 100%;
            background: rgba(13, 8, 27, 0.96);
            border-top: 2px solid #7b2cbf;
            display: flex;
            position: fixed;
            bottom: 0;
            padding: 15px 15px calc(15px + env(safe-area-inset-bottom));
            z-index: 2000;
        }
        .nav-item { flex: 1; text-align: center; font-size: 12px; color: #8d4add; text-decoration: none; cursor: pointer; padding: 5px 0; font-weight: bold; transition: color 0.2s; }
        .nav-item.active { color: white; }
    </style>
</head>
<body>

    <!-- یاری سەرەکی ئەسڵی خۆت -->
    <div class="header" id="mainHeader">
        <div>CHUBBYX BALANCE</div>
        <h1 id="score">0</h1>
    </div>

    <div class="coin-container" id="coinContainer">
        <div class="tap-zone" id="tapCoin"></div>
    </div>

    <div class="energy-container" id="mainEnergy">
        <div>⚡ <span id="energyText">500</span> / 500</div>
        <div class="energy-bar-bg"><div class="energy-bar-fill" id="energyFill"></div></div>
    </div>

    <!-- لاپەڕە داینامیکییەکان -->
    <div id="tasks-view" class="dynamic-view"></div>
    <div id="invite-view" class="dynamic-view"></div>
    <div id="mini-games-view" class="dynamic-view"></div>
    <div id="wallet-view" class="dynamic-view"></div>

    <div class="nav-bar">
        <div class="nav-item" onclick="openPage('tasks', this)">Tasks</div>
        <div class="nav-item" onclick="openPage('invite', this)">Invite</div>
        <div class="nav-item active" onclick="closeAllPages(this)">Games</div>
        <div class="nav-item" onclick="openPage('mini-games', this)">Mini Games</div>
        <div class="nav-item" onclick="openPage('wallet', this)">Wallet</div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            const webapp = window.Telegram.WebApp;
            webapp.ready();
            webapp.expand();
            webapp.setHeaderColor('#1c1437');
            webapp.setBackgroundColor('#1c1437');
        }

        var count = parseInt(localStorage.getItem('chubby_coins')) || 0;
        var energy = 500;

        document.getElementById('score').innerText = count.toLocaleString();

        var tapElement = document.getElementById('tapCoin');
        var coinContainer = document.getElementById('coinContainer');

        if (tapElement) {
            tapElement.addEventListener('touchstart', function(e) {
                e.preventDefault();
                if (energy > 0) {
                    count++;
                    energy--;
                    document.getElementById('score').innerText = count.toLocaleString();
                    updateUI();
                    localStorage.setItem('chubby_coins', count);

                    playChubbVoice();

                    tapElement.classList.add('tap-zone-active');

                    var touch = e.touches;
                    var rect = coinContainer.getBoundingClientRect();
                    var x = touch.clientX - rect.left;
                    var y = touch.clientY - rect.top;

                    createFloatingText(x, y);
                }
            });

            tapElement.addEventListener('touchend', function(e) {
                setTimeout(() => {
                    tapElement.classList.remove('tap-zone-active');
                }, 50);
            });
        }

        function playChubbVoice() {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                var utterance = new SpeechSynthesisUtterance('Chub');
                utterance.lang = 'en-US';
                utterance.pitch = 1.4;
                utterance.rate = 1.6;
                window.speechSynthesis.speak(utterance);
            }
        }

        function createFloatingText(x, y) {
            var textNode = document.createElement('div');
            textNode.className = 'floating-text';
            textNode.innerText = '+1';
            textNode.style.left = (x - 20) + 'px';
            textNode.style.top = (y - 20) + 'px';

            coinContainer.appendChild(textNode);

            setTimeout(() => { textNode.remove(); }, 600);
        }

        function updateUI() {
            document.getElementById('energyText').innerText = energy;
            document.getElementById('energyFill').style.width = (energy / 500 * 100) + '%';
        }

        setInterval(function() {
            if (energy < 500) { energy += 3; if (energy > 500) energy = 500; updateUI(); }
        }, 1000);

        function openPage(pageId, element) {
            document.querySelectorAll('.dynamic-view').forEach(view => view.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            
            const targetView = document.getElementById(${pageId}-view);
            if (targetView) targetView.classList.add('active');
            if (element) element.classList.add('active');
        }

        function closeAllPages(element) {
            document.querySelectorAll('.dynamic-view').forEach(view => view.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            if (element) element.classList.add('active');
            
            count = parseInt(localStorage.getItem('chubby_coins')) || 0;
            document.getElementById('score').innerText = count.toLocaleString();
        }
    </script>

    <script src="wallet.js"></script>
    <script src="tasks.js"></script>
    <script src="invite.js"></script>
</body>
</html>
