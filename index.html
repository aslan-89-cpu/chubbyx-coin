<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Hub</title>
    <!-- ئەسکریپتی فەرمی و نوێی تێلیگرام -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #0b0c10;
            color: #ffffff;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .hub-box {
            background-color: #1f2833;
            border: 2px solid #45f3ff;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            max-width: 450px;
            width: 100%;
            box-shadow: 0 0 20px rgba(69, 243, 255, 0.2);
        }
        h2 { color: #45f3ff; margin-bottom: 5px; }
        .balance { font-size: 32px; font-weight: bold; margin: 20px 0; color: #15eff2; }
        .coin-btn {
            width: 150px;
            height: 150px;
            background: radial-gradient(#ffb703, #fb8500);
            border-radius: 50%;
            margin: 0 auto 20px auto;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 60px;
            cursor: pointer;
            box-shadow: 0 0 20px rgba(251, 133, 0, 0.5);
            transition: transform 0.1s;
            user-select: none;
        }
        .coin-btn:active { transform: scale(0.93); }
    </style>
</head>
<body>

    <div class="hub-box">
        <h2>CHUBBYX COIN MAIN HUB</h2>
        <div class="balance">Coins: <span id="coin-count">0</span> 🪙</div>
        
        <!-- دوگمەی سەرەکی کلیکەر -->
        <div class="coin-btn" id="click-trigger">🐻</div>
        <p style="color: #c5c6c7; font-size: 14px;">Tap the Chubby to mine coins!</p>
    </div>

    <script>
        let score = parseInt(localStorage.getItem('chubby_coins')) || 0;
        document.getElementById('coin-count').innerText = score.toLocaleString();

        document.getElementById('click-trigger').addEventListener('click', () => {
            score += 1;
            document.getElementById('coin-count').innerText = score.toLocaleString();
            localStorage.setItem('chubby_coins', score);

            if (window.Telegram && window.Telegram.WebApp && window.Telegram.WebApp.HapticFeedback) {
                window.Telegram.WebApp.HapticFeedback.impactOccurred('light');
            }
        });

        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
                window.Telegram.WebApp.expand();
            }
        };
    </script>

</body>
</html>
