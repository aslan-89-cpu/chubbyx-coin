<!DOCTYPE HTML>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChubbyX Hub</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body { 
            /* لێرەدا ڕێکخرا بۆ center top بۆ ئەوەی ئاسمانە نوێیەکە بچێتە بەرزترین خاڵ */
            background: #1c1437 url('background.png.jpeg') no-repeat center top fixed; 
            background-size: cover; 
            color: white; 
            font-family: sans-serif; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            height: 100vh; 
            overflow: hidden; 
            user-select: none;
            touch-action: none; 
        }
        
        .header { 
            margin-top: 35px; 
            text-align: center; 
            z-index: 10; 
            pointer-events: none;
        }
        .header div { font-size: 14px; opacity: 0.8; letter-spacing: 1px; }
        .header h1 { font-size: 44px; font-weight: bold; margin-top: 5px; }

        .coin-container { 
            flex: 1; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            width: 100%;
            position: relative;
            z-index: 5; 
        }
        
        .tap-zone { 
    position: absolute;
    top: 25%; /* جێگیرکردنی بازنەی کلیکەکە ڕێک لەسەر زگی کاراکتەرە مۆرەکە */
    width: 260px; 
    height: 260px; 
    border-radius: 50%; 
    cursor: pointer; 
    background: transparent; 
    -webkit-tap-highlight-color: transparent;
    z-index: 999; /* هێنراوەتە سەروو هەموو شتێک تا دڵنیابین کلیکەکە بە تەواوی دەگرێت */
    touch-action: manipulation;
    transition: transform 0.05s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

/* کاتێک پەنجەی پێدا دەنێیت، کاراکتەرەکە بە نەرمی و بەهێزی دەجوڵێتەوە و بەرز و نزم دەبێت */
.tap-zone:active {
    transform: scale(0.85) translateY(8px);
}
        
        .energy-container { 
            width: 80%; 
            text-align: center; 
            z-index: 10; 
            margin-bottom: 105px; 
            pointer-events: none;
        }
        .energy-bar-bg { width: 100%; height: 12px; background: rgba(255, 255, 255, 0.1); border-radius: 10px; overflow: hidden; border: 1px solid #7b2cbf; margin-top: 8px; }
        .energy-bar-fill { width: 100%; height: 100%; background: #eab308; transition: width 0.1s ease; }
        
        .nav-bar { 
            width: 100%; 
            background: rgba(13, 8, 27, 0.96); 
            border-top: 2px solid #7b2cbf; 
            display: flex; 
            position: fixed; 
            bottom: 0; 
            padding: 15px 0 calc(15px + env(safe-area-inset-bottom)); 
            z-index: 2000; 
        }
        .nav-item { font-size: 12px; color: #9d4edd; text-decoration: none; flex: 1; text-align: center; font-weight: bold; z-index: 2001; cursor: pointer; }
        .nav-item.active { color: white; }

        .app-iframe {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            border: none;
            z-index: 3000;
            background: #090514;
        }
    </style>
</head>
<body>

    <div class="header">
        <div>CHUBBYX BALANCE</div>
        <h1 id="score">0</h1>
    </div>

    <div class="coin-container">
        <div class="tap-zone" id="tapCoin"></div>
    </div>

    <div class="energy-container">
        <div>⚡ <span id="energyText">500</span> / 500</div>
        <div class="energy-bar-bg"><div class="energy-bar-fill" id="energyFill"></div></div>
    </div>
    
    <iframe id="appFrame" class="app-iframe"></iframe>
    
    <div class="nav-bar">
        <div class="nav-item" onclick="loadExternalPage('tasks.html')">Tasks</div>
        <div class="nav-item" onclick="loadExternalPage('invite.html')">Invite</div>
        <div class="nav-item" onclick="loadExternalPage('game.html')">Games</div>
        <div class="nav-item" onclick="loadExternalPage('wallet.html')">Wallet</div>
        <div class="nav-item" onclick="loadExternalPage('withdraw.html')">Withdraw</div>
    </div>
    
    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            const webApp = window.Telegram.WebApp;
            webApp.ready();
            webApp.expand();
            webApp.setHeaderColor('#1c1437');
            webApp.setBackgroundColor('#1c1437');
        }

        var count = parseInt(localStorage.getItem('chubby_coins')) || 0;
        var energy = 500;
        
        document.getElementById('score').innerText = count;

        // دروستکردنی فایلی دەنگی (دەبێت فایلی chubby.mp3 لە گیت هاب دابنێیت)
        var chubbySound = new Audio('chubby.mp3');

        var tapElement = document.getElementById('tapCoin');
        if (tapElement) {
            tapElement.addEventListener('touchstart', function(e) {
                e.preventDefault(); 
                if (energy > 0) { 
                    count++; energy--; 
                    document.getElementById('score').innerText = count; 
                    updateUI(); 
                    localStorage.setItem('chubby_coins', count); 
                    
                    // لێدانی دەنگەکە کاتێک کلیک دەکرێت
                    try {
                        chubbySound.currentTime = 0;
                        chubbySound.play();
                    } catch(err) { console.log("Sound not ready"); }

                    // ١. گۆڕینی باکگراوند بۆ وێنەی چاو داخراوەکە کاتێک دەستی لێدەدەیت
                    document.body.style.background = "#1c1437 url('background.png.jpeg') no-repeat center top fixed";
                    document.body.style.backgroundSize = "cover";

                    // ٢. ئەنیمەیشنی لێدانی زگی کاراکتەرەکە
                    tapElement.style.transform = 'scale(0.92) translateY(5px)';
                }
            }, { passive: false });

            // گەڕانەوە بۆ دۆخی چاو کراوە و قەبارەی ئاسایی کاتێک پەنجە لادەبرێت
            tapElement.addEventListener('touchend', function() {
                setTimeout(() => {
                    document.body.style.background = "#1c1437 url('background.png.jpeg') no-repeat center top fixed";
                    document.body.style.backgroundSize = "cover";
                    tapElement.style.transform = 'scale(1) translateY(0)';
                }, 60);
            });
        }
        function updateUI() { 
            document.getElementById('energyText').innerText = energy; 
            document.getElementById('energyFill').style.width = (energy / 500 * 100) + '%'; 
        }
        
        setInterval(function() { 
            if (energy < 500) { energy += 3; if (energy > 500) energy = 500; updateUI(); } 
        }, 1000);
        
        function loadExternalPage(url) {
            const frame = document.getElementById('appFrame');
            frame.src = url;
            frame.style.display = 'block';
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        window.addEventListener('message', function(event) {
            if (event.data === 'closePage') {
                document.getElementById('appFrame').style.display = 'none';
                document.getElementById('appFrame').src = '';
                document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
                count = parseInt(localStorage.getItem('chubby_coins')) || 0;
                document.getElementById('score').innerText = count;
            }
        });
    </script>
</body>
</html>
