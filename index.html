<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>chubbyx hub</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: #1c1437 url('background.jpg') no-repeat center top -120px fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 0px 20px;
            z-index: 2500;
        }
        .btn-top {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .header {
            margin-top: 25px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        .header div { font-size: 14px; opacity: 0.8; letter-spacing: 1px; }
        .header h1 { font-size: 38px; font-weight: bold; margin-top: 5px; }
        
        .coin-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            z-index: 5;
        }
        .transparent-tap-zone {
            position: absolute;
            top: 25%;
            width: 270px;
            height: 270px;
            border-radius: 50%;
            background: transparent;
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            z-index: 999;
            touch-action: manipulation;
            transition: transform 0.05s ease;
        }
        .transparent-tap-zone:active {
            transform: scale(0.93) !important;
        }
        .floating-text {
            position: absolute;
            color: #eeb308;
            font-weight: bold;
            font-size: 28px;
            pointer-events: none;
            z-index: 1000;
            animation: FloatUp 0.6s ease-out forwards;
            text-shadow: 0 5px 10px rgba(234, 179, 8, 0.3);
        }
        @keyframes FloatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.3); }
        }

        .dynamic-page {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100vw; height: calc(100vh - 85px);
            z-index: 1500;
            background: #0e0s1b;
            padding: 80px 20px 40px 20px;
            flex-direction: column;
            align-items: center;
        }
        .dynamic-page.active { display: flex; }
        .page-title { font-size: 26px; font-weight: bold; margin-bottom: 25px; color: #eeb308; }
        .page-content { width: 100%; flex: 1; overflow-y: auto; }

        .bottom-nav {
            width: 100%;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            background: #05030a;
            display: flex;
            position: fixed;
            bottom: 0;
            padding: 15px 15px calc(15px + env(safe-area-inset-bottom));
            z-index: 2000;
        }
        .nav-link { flex: 1; text-align: center; font-size: 13px; color: #666; text-decoration: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; }
        .nav-link.active { color: #eeb308; font-weight: bold; }
        .nav-icon { font-size: 20px; margin-bottom: 4px; }
    </style>
</head>
<body>

    <div class="header-bar">
        <button class="btn-top" onclick="switchPage('menu')">≡ Menu</button>
        <button class="btn-top" onclick="switchPage('airdrop')">🎁 Airdrop</button>
    </div>

    <!-- Home Layout -->
    <div id="home-layout" style="display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%;">
        <div class="header">
            <div>CHUBBYX BALANCE</div>
            <h1 id="main-score">0</h1>
        </div>
        <div class="coin-container" id="coincontainer">
            <div class="transparent-tap-zone" id="clickcoin"></div>
        </div>
    </div>

    <!-- Dynamic Pages -->
    <div id="tasks-page" class="dynamic-page"></div>
    <div id="invites-page" class="dynamic-page"></div>
    <div id="games-page" class="dynamic-page"></div>
    <div id="wallet-page" class="dynamic-page"></div>
    <div id="menu-page" class="dynamic-page"></div>
    <div id="airdrop-page" class="dynamic-page"></div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-link" onclick="switchPage('tasks', this)"><span class="nav-icon">📋</span>Tasks</div>
        <div class="nav-link" onclick="switchPage('invites', this)"><span class="nav-icon">👥</span>Invites</div>
        <div class="nav-link active" id="default-nav" onclick="switchPage('home', this)"><span class="nav-icon">🏠</span>Home</div>
        <div class="nav-link" onclick="switchPage('games', this)"><span class="nav-icon">🎮</span>Games</div>
        <div class="nav-link" onclick="switchPage('wallet', this)"><span class="nav-icon">💎</span>Wallet</div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        // Tap Tap Functionality & Core Score
        var count = parseInt(localStorage.getItem('chubby_coins')) || 0;
        document.getElementById('main-score').innerText = count.toLocaleString();

        var tapElement = document.getElementById('clickcoin');
        var coinContainer = document.getElementById('coincontainer');

        if (tapElement) {
            tapElement.addEventListener('pointerdown', function(e) {
                e.preventDefault();
                count++;
                document.getElementById('main-score').innerText = count.toLocaleString();
                localStorage.setItem('chubby_coins', count);

                // Sound Effect
                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    var utterance = new SpeechSynthesisUtterance('Chub');
                    utterance.lang = 'en-US';
                    utterance.pitch = 1.4;
                    utterance.rate = 1.6;
                    window.speechSynthesis.speak(utterance);
                }

                // Floating Text
                var textNode = document.createElement('div');
                textNode.className = 'floating-text';
                textNode.innerText = '+1';
                
                var rect = coinContainer.getBoundingClientRect();
                var x = e.clientX - rect.left;
                var y = e.clientY - rect.top;
                
                textNode.style.left = (x - 15) + 'px';
                textNode.style.top = (y - 30) + 'px';
                coinContainer.appendChild(textNode);

                setTimeout(function() { textNode.remove(); }, 600);
                tapElement.classList.add('transparent-tap-zone-active');
            });

            tapElement.addEventListener('pointerup', function() {
                setTimeout(function() { tapElement.classList.remove('transparent-tap-zone-active'); }, 50);
            });
        }

        // Global Page Switching System (Routing)
        function switchPage(pageId, element) {
            // Hide Home Layout and all Dynamic Pages
            document.getElementById('home-layout').style.display = 'none';
            document.querySelectorAll('.dynamic-page').forEach(page => page.classList.remove('active'));

            // Reset navigation active status
            if (element) {
                document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
                element.classList.add('active');
            } else {
                document.querySelectorAll('.nav-link').forEach(link => link.classList.remove('active'));
                if (pageId === 'home') document.getElementById('default-nav').classList.add('active');
            }

            // Show target page
            if (pageId === 'home') {
                document.getElementById('home-layout').style.display = 'flex';
            } else {
                var targetPage = document.getElementById(pageId + '-page');
                if (targetPage) targetPage.classList.add('active');
            }
        }
    </script>

    <!-- Load external feature files -->
    <script src="game.js"></script>
    <script src="tasks.js"></script>
    <script src="invite.js"></script>
    <script src="wallet.js"></script>
    <script src="menu.js"></script>
    <script src="airdrop.js"></script>
</body>
</html>
