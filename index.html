<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>ChubbyX</title>
    <!-- لۆدکردنی فەرمی جاڤاسکریتی تێلیگرام لە بەرزترین خاڵ -->
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            width: 100vw;
            height: 100vh;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            overflow: hidden;
            user-select: none;
            touch-action: none;
            /* ڕەنگی بنەڕەتی شاشە هاوڕەنگی ئاسمانی وێنەکەیە تا بەشە ڕەشەکە ون بێت */
            background: #2b1d52 url('background.png.jpeg') no-repeat center center fixed;
            background-size: 100% 100%;
        }
        .header { 
            margin-top: 25px; 
            text-align: center; 
            z-index: 10; 
            pointer-events: none; /* ناهێڵێت ئەم بەشە کلیک بلۆک بکات */
        }
        .coins-container { 
            flex: 1; 
            width: 100%; 
            position: relative; 
            z-index: 5;
        }
        /* دوگمەی نەبینراوی سەر کۆینی لای چەپ */
        .tap-coin-left {
            position: absolute;
            left: 8%;
            bottom: 24%;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            cursor: pointer;
            background: rgba(255, 0, 0, 0); /* تەواو ڕوون */
            -webkit-tap-highlight-color: transparent;
            z-index: 99;
            transition: transform 0.05s ease;
        }
        /* دوگمەی نەبینراوی سەر کۆینی لای ڕاست */
        .tap-coin-right {
            position: absolute;
            right: 8%;
            bottom: 28%;
            width: 110px;
            height: 110px;
            border-radius: 50%;
            cursor: pointer;
            background: rgba(255, 0, 0, 0); /* تەواو ڕوون */
            -webkit-tap-highlight-color: transparent;
            z-index: 99;
            transition: transform 0.05s ease;
        }
        .tap-coin-left:active, .tap-coin-right:active {
            transform: scale(0.92);
        }
        .energy-container {
            width: 100%;
            text-align: center;
            margin-bottom: 90px; 
            z-index: 10;
            pointer-events: none;
        }
        .energy-bar-bg { 
            width: 80%; 
            background: rgba(255, 255, 255, 0.1); 
            border-radius: 10px; 
            overflow: hidden; 
            border: 1px solid #a48fff; 
            margin: 10px auto; 
        }
        .energy-bar-fill { 
            width: 100%; 
            height: 12px; 
            background: #a48fff; 
            transition: width 0.1s ease; 
        }
        .nav-bar { 
            position: fixed; 
            bottom: 0; 
            width: 100%; 
            display: flex; 
            justify-content: space-around; 
            background: rgba(20, 10, 35, 0.95); 
            padding: 15px 0 calc(15px + env(safe-area-inset-bottom)); 
            border-top: 1px solid #331a5e; 
            z-index: 100; /* هێنراوەتە سەروو هەموو شتێک تا کار بکات */
        }
        .nav-item { 
            color: #a48fff; 
            text-decoration: none; 
            font-size: 14px; 
            cursor: pointer; 
            font-weight: bold; 
            opacity: 0.7; 
        }
        .nav-item.active { 
            opacity: 1; 
            color: white; 
        }
    </style>
</head>
<body>

    <div class="header">
        <h2 style="font-size: 14px; opacity: 0.8; letter-spacing: 1px;">CHUBBYX BALANCE</h2>
        <h1 style="font-size: 42px; font-weight: bold; margin-top: 2px;">713</h1>
    </div>

    <div class="coins-container">
        <div class="tap-coin-left" id="coinLeft"></div>
        <div class="tap-coin-right" id="coinRight"></div>
    </div>

    <div class="energy-container">
        <div style="font-size: 16px; margin-bottom: 5px;">⚡ 500 / 500</div>
        <div class="energy-bar-bg">
            <div class="energy-bar-fill"></div>
        </div>
    </div>

    <div class="nav-bar">
        <a class="nav-item" href="#">Tasks</a>
        <a class="nav-item" href="#">Mini-Game</a>
        <a class="nav-item" href="#">Games</a>
        <a class="nav-item active" href="#">Invite</a>
        <a class="nav-item" href="#">Airdrop</a>
        <a class="nav-item" href="#">Wallet</a>
    </div>

    <script>
        // دڵنیابوون لەوەی کۆدەکان تەنها کاتێک کار دەکەن کە تێلیگرام بە تەواوی ئامادەیە
        if (window.Telegram && window.Telegram.WebApp) {
            const webApp = window.Telegram.WebApp;
            
            webApp.ready();
            webApp.expand();
            
            // گۆڕینی ڕەنگی سەرەوە بۆ وەنەوشەیی ئاسمانی وێنەکە
            webApp.setHeaderColor('#2b1d52'); 
            webApp.setBackgroundColor('#2b1d52');
        }

        const coinLeft = document.getElementById('coinLeft');
        const coinRight = document.getElementById('coinRight');

        function handleTap(e) {
            e.preventDefault();
            console.log("Tapped!");
        }

        if (coinLeft) {
            coinLeft.addEventListener('touchstart', handleTap, { passive: false });
        }
        if (coinRight) {
            coinRight.addEventListener('touchstart', handleTap, { passive: false });
        }
    </script>
</body>
</html>
