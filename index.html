<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Hub</title>
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        body {
            background: #1c1437 url('background.jpg') no-repeat center top -120px fixed;
            background-size: cover;
            color: #ffffff;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 0 20px;
            z-index: 2500;
        }
        .btn-top {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .header {
            margin-top: 25px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        .header div { font-size: 14px; opacity: 0.8; letter-spacing: 1px; }
        .header h1 { font-size: 38px; font-weight: bold; margin-top: 5px; }

        .coin-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            z-index: 5;
        }
        .transparent-tap-zone {
            position: absolute;
            top: 25%;
            width: 270px;
            height: 270px;
            border-radius: 50%;
            background: rgba(0,0,0,0.001); 
            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
            z-index: 999;
            transition: transform 0.05s ease;
        }
        .transparent-tap-zone-active { 
            transform: scale(0.93) !important; 
        }

        .floating-text {
            position: absolute;
            color: #eab308;
            font-weight: bold;
            font-size: 28px;
            pointer-events: none;
            z-index: 1000;
            animation: floatUp 0.6s ease-out forwards;
            text-shadow: 0 0 8px rgba(234, 179, 8, 0.7);
        }
        @keyframes floatUp {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-120px) scale(1.1); }
        }

        .dynamic-page {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: calc(100vh - 85px);
            background: #0d081b;
            z-index: 1500;
            padding: 80px 20px 40px 20px;
            flex-direction: column;
            align-items: center;
        }
        .dynamic-page.active { display: flex; }
        .page-title { font-size: 26px; font-weight: bold; margin-bottom: 25px; color: #eab308; }

        .bottom-nav {
            width: 100%;
            background: #05030a;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            display: flex;
            position: fixed;
            bottom: 0;
            padding: 15px 15px calc(25px + env(safe-area-inset-bottom));
            z-index: 2000;
        }
        .nav-link { flex: 1; text-align: center; font-size: 13px; color: #666; text-decoration: none; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; font-weight: 500; }
        .nav-link.active { color: #eab308; font-weight: bold; }
        .nav-icon { font-size: 20px; }
    </style>
</head>
<body>

    <!-- دوگمەکانی سەرەوە -->
    <div class="header-bar">
        <button class="btn-top" onclick="switchPage('menu')">☰ Menu</button>
        <button class="btn-top" onclick="switchPage('airdrop')">🎁 Airdrop</button>
    </div>

    <!-- 🏠 لاپەڕەی سەرەکی Home -->
    <div class="main-layout" id="home-layout" style="display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%;">
        <div class="header">
            <div>CHUBBYX BALANCE</div>
            <h1 id="main-score">0</h1>
        </div>

        <div class="coin-container" id="coinContainer">
            <div class="transparent-tap-zone" id="clickCoin"></div>
        </div>
    </div>

    <!-- لاپەڕە داینامیکییەکان -->
    <div id="tasks-page" class="dynamic-page"><h2 class="page-title">Tasks List</h2></div>
    <div id="friends-page" class="dynamic-page"><h2 class="page-title">Friends Referral</h2></div>
    <div id="game-page" class="dynamic-page"><h2 class="page-title">ChubbyX Mini Games</h2></div>
    <div id="profile-page" class="dynamic-page"><h2 class="page-title">User Profile</h2></div>
    <div id="menu-page" class="dynamic-page"><h2 class="page-title">Menu Options</h2></div>
    <div id="airdrop-page" class="dynamic-page"><h2 class="page-title">Airdrop Status</h2></div>

    <!-- مینیۆ باری خوارەوە -->
    <div class="bottom-nav">
        <div class="nav-link" onclick="switchPage('tasks', this)">
            <span class="nav-icon">📋</span><span>Tasks</span>
        </div>
        <div class="nav-link" onclick="switchPage('friends', this)">
            <span class="nav-icon">👥</span><span>Friends</span>
        </div>
        <div class="nav-link active" id="default-nav" onclick="switchPage('home', this)">
            <span class="nav-icon">🏠</span><span>Home</span>
        </div>
        <div class="nav-link" onclick="switchPage('game', this)">
            <span class="nav-icon">🎮</span><span>Game</span>
        </div>
        <div class="nav-link" onclick="switchPage('profile', this)">
            <span class="nav-icon">👤</span><span>Profile</span>
        </div>
    </div>

    <script>
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        var count = parseInt(localStorage.getItem('chubby_coins')) || 0;
        document.getElementById('main-score').innerText = count.toLocaleString();

        var tapElement = document.getElementById('clickCoin');
        var coinContainer = document.getElementById('coinContainer');
        
        if (tapElement) {
            tapElement.addEventListener('click', function(e) {
                count++;
                document.getElementById('main-score').innerText = count.toLocaleString();
                localStorage.setItem('chubby_coins', count);

                if ('speechSynthesis' in window) {
                    window.speechSynthesis.cancel();
                    var utterance = new SpeechSynthesisUtterance('Chub');
                    utterance.lang = 'en-US';
                    utterance.pitch = 1.4;
                    utterance.rate = 1.6;
                    window.speechSynthesis.speak(utterance);
                }

                tapElement.classList.add('transparent-tap-zone-active');
                setTimeout(function() { tapElement.classList.remove('transparent-tap-zone-active'); }, 50);

                var rect = coinContainer.getBoundingClientRect();
                var x = e.clientX - rect.left;
                var y = e.clientY - rect.top;
                
                if (!x || x < 0) { x = 135; y = 135; }

                var textNode = document.createElement('div');
                textNode.className = 'floating-text';
                textNode.innerText = '+1';
                textNode.style.left = (x - 15) + 'px';
                textNode.style.top = (y - 30) + 'px';
                coinContainer.appendChild(textNode);
                setTimeout(function() { textNode.remove(); }, 600);
            });
        }

        function switchPage(pageId, element) {
            document.getElementById('home-layout').style.display = 'none';
            document.querySelectorAll('.dynamic-page').forEach(function(page) { page.classList.remove('active'); });
            
            if (element && element.classList.contains('nav-link')) {
                document.querySelectorAll('.nav-link').forEach(function(link) { link.classList.remove('active'); });
                element.classList.add('active');
            } else if (pageId === 'home') {
                document.querySelectorAll('.nav-link').forEach(function(link) { link.classList.remove('active'); });
                var defNav = document.getElementById('default-nav');
                if (defNav) defNav.classList.add('active');
            } else {
                document.querySelectorAll('.nav-link').forEach(function(link) { link.classList.remove('active'); });
            }

            if (pageId === 'home') {
                document.getElementById('home-layout').style.display = 'flex';
                count = parseInt(localStorage.getItem('chubby_coins')) || 0;
                document.getElementById('main-score').innerText = count.toLocaleString();
            } else {
                var targetPage = document.getElementById(pageId + '-page');
                if (targetPage) targetPage.classList.add('active');
            }
        }
    </script>
    <!-- ⚠️ سەرنج بدە: لێرەدا هیچ فایلێکی دەرەکی بار نەکراوە بۆ ئەوەی ئەپەکە ۱۰۰٪ سەلامەت بێت لە بلۆکبوون -->
</body>
</html>
