<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Hub</title>
    <!-- بارکردنی فەرمی و نوێی تێلیگرام SDK -->
    <script src="https://telegram.org"></script>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            background: #1c1437 url('background.jpg') no-repeat center top -120px fixed;
            background-size: cover;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            height: 100vh;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
            touch-action: none;
        }
        .header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 20px 0 20px;
            z-index: 2500;
        }
        .btn-top {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
        }
        .header {
            margin-top: 15px;
            text-align: center;
            z-index: 10;
            pointer-events: none;
        }
        .header div { font-size: 14px; opacity: 0.8; letter-spacing: 1px; }
        .header h1 { font-size: 32px; font-weight: bold; margin-top: 5px; }

        .coin-container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            position: relative;
            z-index: 5;
        }
        /* گەورەکردنی تەواوی ناوچەی کلیک بۆ ئەوەی بە دڵنیایی لێدانی بەرکەوێت */
        .tap-zone {
            position: absolute;
            top: 15%; 
            width: 320px;
            height: 320px;
            border-radius: 50%;
            cursor: pointer;
            background: transparent;
            -webkit-tap-highlight-color: transparent;
            z-index: 999;
            touch-action: manipulation;
            transition: transform 0.05s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .tap-zone-active {
            transform: scale(0.93) !important;
        }
        .floating-text {
            position: absolute;
            color: #eab308;
            font-weight: bold;
            font-size: 24px;
            pointer-events: none;
            z-index: 1000;
            animation: floatUpAndFade 0.6s ease-out forwards;
            text-shadow: 0 0 8px rgba(234, 179, 8, 0.7);
        }
        @keyframes floatUpAndFade {
            0% { opacity: 1; transform: translateY(0) scale(1); }
            100% { opacity: 0; transform: translateY(-130px) scale(1.2); }
        }
        .energy-container {
            width: 80%;
            text-align: center;
            z-index: 10;
            margin-bottom: 125px; 
            pointer-events: none;
        }
        .energy-bar-bg { width: 100%; height: 12px; background: rgba(255,255,255,0.2); border-radius: 6px; margin-top: 8px; overflow: hidden; }
        .energy-bar-fill { height: 100%; width: 100%; background: linear-gradient(90deg, #eab308, #ef4444); border-radius: 6px; transition: width 0.1s ease; }

        .dynamic-view {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: calc(100vh - 85px);
            background: #0d081b;
            z-index: 1500;
            padding: 80px 20px 40px 20px;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
            overflow-y: auto;
        }
        .dynamic-view.active {
            display: flex;
        }

        .nav-bar {
            width: 100%;
            background: rgba(13, 8, 27, 0.96);
            border-top: 2px solid #7b2cbf;
            display: flex;
            position: fixed;
            bottom: 0;
            padding: 15px 15px calc(25px + env(safe-area-inset-bottom)); 
            z-index: 2000;
        }
        .nav-item { flex: 1; text-align: center; font-size: 13px; color: #8d4add; text-decoration: none; cursor: pointer; padding: 5px 0; font-weight: bold; transition: color 0.2s; }
        .nav-item.active { color: white; }
    </style>
</head>
<body>

    <!-- دوگمەکانی سەرەوە -->
    <div class="header-bar">
        <button class="btn-top" onclick="navigateTo('menu')">☰ Menu</button>
        <button class="btn-top" onclick="navigateTo('airdrop')">🎁 Airdrop</button>
    </div>

    <!-- 🏠 لاپەڕەی سەرەکی (Home View) -->
    <div id="home-layout" style="display: flex; flex-direction: column; align-items: center; width: 100%; height: 100%;">
        <div class="header">
            <div>CHUBBYX BALANCE</div>
            <h1 id="score">0</h1>
        </div>

        <div class="coin-container" id="coinContainer">
            <div class="tap-zone" id="tapCoin"></div>
        </div>

        <div class="energy-container">
            <div>⚡ <span id="energyText">500</span> / 500</div>
            <div class="energy-bar-bg"><div class="energy-bar-fill" id="energyFill"></div></div>
        </div>
    </div>

    <!-- شوێنی لاپەڕە داینامیکییەکان -->
    <div id="tasks-view" class="dynamic-view"></div>
    <div id="invite-view" class="dynamic-view"></div>
    <div id="games-view" class="dynamic-view"></div>
    <div id="wallet-view" class="dynamic-view"></div>
    <div id="menu-view" class="dynamic-view"></div>
    <div id="airdrop-view" class="dynamic-view"></div>

    <!-- مینیۆ بارەکەت -->
    <div class="nav-bar">
        <div class="nav-item" onclick="navigateTo('tasks', this)">Tasks</div>
        <div class="nav-item" onclick="navigateTo('invite', this)">Invite</div>
        <div class="nav-item active" id="default-nav" onclick="navigateTo('home', this)">Home</div>
        <div class="nav-item" onclick="navigateTo('games', this)">Games</div>
        <div class="nav-item" onclick="navigateTo('wallet', this)">Wallet</div>
    </div>

    <script>
        // چالاککردنی فەرمی تێلیگرام WebApp بۆ لابردنی بلۆکی شاشە
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
            window.Telegram.WebApp.expand();
        }

        var count = parseInt(localStorage.getItem('chubby_coins')) || 0;
        var energy = parseInt(localStorage.getItem('chubby_energy')) || 500;

        document.getElementById('score').innerText = count.toLocaleString();
        updateUI();

        var tapElement = document.getElementById('tapCoin');
        var coinContainer = document.getElementById('coinContainer');

        // چارەسەری لێدان: گۆڕینی فەرمانەکە بۆ شێوازی گشتی (Pointer Events) کە هەم مۆبایل و هەم کۆمپیوتەر دەخوێنێتەوە
        if (tapElement) {
            tapElement.addEventListener('pointerdown', function(e) {
                e.preventDefault();
                if (energy > 0) {
                    count++;
                    energy--;
                    document.getElementById('score').innerText = count.toLocaleString();
                    updateUI();
                    localStorage.setItem('chubby_coins', count);
                    localStorage.setItem('chubby_energy', energy);

                    // لێدانی دەنگ
                    if ('speechSynthesis' in window) {
                        window.speechSynthesis.cancel();
                        var utterance = new SpeechSynthesisUtterance('Chub');
                        utterance.lang = 'en-US';
                        utterance.pitch = 1.4;
                        utterance.rate = 1.6;
                        window.speechSynthesis.speak(utterance);
                    }

                    tapElement.classList.add('tap-zone-active');

                    // ئەژمارکردنی شوێنی پەنجە بۆ دەقی پۆینتی +1
                    var rect = coinContainer.getBoundingClientRect();
                    var x = e.clientX - rect.left;
                    var y = e.clientY - rect.top;

                    var textNode = document.createElement('div');
                    textNode.className = 'floating-text';
                    textNode.innerText = '+1';
                    textNode.style.left = (x - 20) + 'px';
                    textNode.style.top = (y - 20) + 'px';
                    coinContainer.appendChild(textNode);
                    setTimeout(() => { textNode.remove(); }, 600);
                }
            });

            tapElement.addEventListener('pointerup', function() {
                setTimeout(() => { tapElement.classList.remove('tap-zone-active'); }, 50);
            });
        }

        function updateUI() {
            document.getElementById('energyText').innerText = energy;
            document.getElementById('energyFill').style.width = (energy / 500 * 100) + '%';
        }

        setInterval(function() {
            if (energy < 500) { 
                energy += 3; 
                if (energy > 500) energy = 500; 
                updateUI(); 
                localStorage.setItem('chubby_energy', energy);
            }
        }, 1000);

        function navigateTo(pageId, element) {
            document.getElementById('home-layout').style.display = 'none';
            document.querySelectorAll('.dynamic-view').forEach(view => view.classList.remove('active'));
            
            if (element && element.classList.contains('nav-item')) {
                document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
                element.classList.add('active');
