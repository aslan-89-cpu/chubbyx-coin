<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Invite Friends</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #090514;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }
        h1 { font-size: 28px; font-weight: bold; color: #a855f7; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .subtitle { font-size: 14px; color: #9ca3af; margin-bottom: 25px; text-align: center; }

        .stats-container {
            background: #150f2e;
            border: 1px solid #2e1f5e;
            border-radius: 15px;
            padding: 15px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            margin-bottom: 25px;
        }
        .stat-box { text-align: center; }
        .stat-box div { font-size: 12px; color: #9ca3af; text-transform: uppercase; margin-bottom: 4px; }
        .stat-box h2 { font-size: 20px; color: #eab308; }

        .tier-card {
            background: rgba(123, 44, 191, 0.1);
            border: 1px dashed #7b2cbf;
            border-radius: 12px;
            padding: 12px;
            width: 100%;
            font-size: 13px;
            color: #d8b4fe;
            margin-bottom: 25px;
            line-height: 1.6;
        }

        .input-card {
            background: #150f2e;
            border: 1px solid #2e1f5e;
            border-radius: 15px;
            padding: 20px;
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 20px;
        }
        .input-card h3 { font-size: 15px; font-weight: bold; color: white; }
        .input-field {
            background: #090514;
            border: 1px solid #4c1d95;
            border-radius: 10px;
            padding: 12px;
            color: white;
            font-size: 14px;
            outline: none;
            width: 100%;
        }
        .input-field::placeholder { color: #4b5563; }

        .invite-btn {
            background: #7b2cbf;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 10px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            width: 100%;
            transition: background 0.2s;
        }
        .invite-btn:hover { background: #9d4edd; }

        .back-btn {
            margin-top: auto;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 35px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>

    <h1>Invite Friends</h1>
    <div class="subtitle">Bring your friends and multiply your earnings!</div>

    <!-- REFERRAL SYSTEMS TIERS INFO -->
    <div class="tier-card">
        <strong>🎁 Referral Reward Tiers:</strong><br>
        • 1 - 5 Friends: +2,000 Coins each<br>
        • 6 - 10 Friends: +5,000 Coins each<br>
        • 11 - 20 Friends: +7,500 Coins each<br>
        • 21+ Friends: +12,000 Coins each
    </div>

    <!-- REFS STATS -->
    <div class="stats-container">
        <div class="stat-box">
            <div>Total Invited</div>
            <h2 id="totalInvites">0</h2>
        </div>
        <div class="stat-box">
            <div>Current Tier Bonus</div>
            <h2 id="currentTier">2,000</h2>
        </div>
    </div>

    <!-- ANTI-CHEAT VERIFICATION INPUT CARD -->
    <div class="input-card">
        <h3>Claim Friend Referral</h3>
        <input type="text" id="friendUsername" class="input-field" placeholder="Enter friend's Telegram username (e.g. @alex)">
        <button class="invite-btn" onclick="claimReferral()">Verify & Claim</button>
    </div>

    <!-- BACK TO MAIN MENU BUTTON -->
    <button class="back-btn" onclick="goBack()">Back to Game</button>

    <script>
        // Load count data from database
        let invitedFriends = JSON.parse(localStorage.getItem('chubby_invited_list')) || [];
        
        function updateStatsUI() {
            document.getElementById('totalInvites').innerText = invitedFriends.length;
            
            // Calculate dynamic bonus price based on user tier count
            let nextBonus = 2000;
            if (invitedFriends.length >= 20) { nextBonus = 12000; }
            else if (invitedFriends.length >= 10) { nextBonus = 7500; }
            else if (invitedFriends.length >= 5) { nextBonus = 5000; }
            
            document.getElementById('currentTier').innerText = nextBonus.toLocaleString();
        }

        // Anti-cheat verification function
        function claimReferral() {
            let inputField = document.getElementById('friendUsername');
            let username = inputField.value.trim().toLowerCase();

            if (username === "" || !username.startsWith('@') || username.length < 3) {
                alert("Please enter a valid Telegram username starting with @");
                return;
            }

            // Check if this friend has already been claimed before
            if (invitedFriends.includes(username)) {
                alert("Error: You have already claimed the reward for this friend!");
                return;
            }

            // Dynamic reward calculation algorithm
            let reward = 2000;
            let currentCount = invitedFriends.length + 1; // plus current new one

            if (currentCount > 20) { reward = 12000; }
            else if (currentCount > 10) { reward = 7500; }
            else if (currentCount > 5) { reward = 5000; }

            // Add new friend to memory list database
            invitedFriends.push(username);
            localStorage.setItem('chubby_invited_list', JSON.stringify(invitedFriends));

            // Credit coins to master wallet database
            let currentCoins = parseInt(localStorage.getItem('chubby_coins')) || 0;
            currentCoins += reward;
            localStorage.setItem('chubby_coins', currentCoins);

            updateStatsUI();
            inputField.value = ""; // clear input
            
            alert("Success! " + username + " verified. +" + reward.toLocaleString() + " Coins added!");
        }

        function goBack() {
            window.parent.postMessage('closePage', '*');
        }

        // Initialize UI stats on page load
        window.onload = updateStatsUI;
    </script>
</body>
</html>
