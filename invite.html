<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChubbyX Invite</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #111; color: white; text-align: center; padding: 20px; }
        .btn { background-color: #f39c12; color: white; padding: 12px 24px; border: none; border-radius: 8px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 15px; }
        .status { margin-top: 20px; font-size: 14px; color: #bbb; }
    </style>
</head>
<body>

    <h2>Invite Friends</h2>
    <p>Earn 3,000 coins per friend! (Maximum 20 friends)</p>

    <!-- Button to generate and copy the link -->
    <button class="btn" onclick="generateInviteLink()">Copy Invite Link</button>
    
    <div class="status">
        <p>Friends Invited: <span id="inviteCount">0</span> / 20</p>
    </div>

    <script>
        // Get Telegram User ID
        const tg = window.Telegram?.WebApp;
        const userId = tg?.initDataUnsafe?.user?.id || "test_user"; 

        function generateInviteLink() {
            const botUsername = "chubbyx_bot"; // Put your bot username here
            const inviteLink = https://t.me{botUsername}?start=ref_${userId};
            
            navigator.clipboard.writeText(inviteLink).then(() => {
                alert("Link copied! Send it to your friends.");
            });
        }

        // Get data from server
        async function loadInviteData() {
            try {
                const response = await fetch(/api/invite-status?userId=${userId});
                const data = await response.json();
                document.getElementById("inviteCount").innerText = data.inviteCount;
            } catch (error) {
                console.error("Error loading data", error);
            }
        }

        window.onload = loadInviteData;
    </script>
</body>
</html>
