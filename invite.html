<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Invite Friends</title>
    <script src="https://telegram.org"></script>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            background-color: #131a26; 
            color: #ffffff; 
            text-align: center; 
            padding: 20px; 
        }
        .box { 
            background: #1c2635; 
            padding: 20px; 
            border-radius: 12px; 
            margin-top: 20px; 
        }
        .btn { 
            background: #2481cc; 
            color: white; 
            border: none; 
            padding: 12px 24px; 
            border-radius: 8px; 
            font-size: 16px; 
            cursor: pointer; 
            margin-top: 15px; 
            font-weight: bold;
        }
    </style>
</head>
<body>

    <h2>Invite Friends</h2>
    <p>Share your link and earn rewards instantly!</p>

    <div class="box">
        <p>Total Invites: <span id="inviteCount">0</span></p>
        <p>Coins Earned: <span id="balance">0</span></p>
    </div>

    <button class="btn" onclick="shareInviteLink()">Invite a Friend</button>

    <script src="invite.js"></script>
</body>
</html>
