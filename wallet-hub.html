<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChubbyX Wallet Hub</title>
    <!-- Importing the modern and stable TON Connect UI script -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .wallet-container {
            text-align: center;
            background: #151a26;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        h2 {
            color: #f3ba2f;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        p {
            color: #a0aec0;
            font-size: 14px;
            margin-bottom: 24px;
        }
        #ton-connect-button {
            display: flex;
            justify-content: center;
            margin-bottom: 25px;
            min-height: 44px;
        }
        .btn-back {
            background: linear-gradient(135deg, #0088cc, #00a6ff);
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
            box-shadow: 0px 4px 10px rgba(0, 136, 204, 0.2);
        }
    </style>
</head>
<body>

    <div class="wallet-container">
        <h2>CHUBBYX WALLET HUB</h2>
        <p>Connect your Wallet to manage your coins</p>
        
        <!-- This is where the official interactive TON Connect button will load -->
        <div id="ton-connect-button"></div>

        <button onclick="backToMenu()" class="btn-back">Back to Menu</button>
    </div>

    <script>
        // Initializing TON Connect using the standard open-source demo manifest to bypass all server blocks
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://github.io',
            buttonRootId: 'ton-connect-button'
        });

        function backToMenu() {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
