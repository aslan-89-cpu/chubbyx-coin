<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChubbyX - Connect Wallet</title>
    <!-- Importing TON Connect SDK -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
        }
        h1 { font-size: 28px; margin-bottom: 10px; }
        p { color: #aaaaaa; font-size: 16px; }
        #ton-connect-button { margin-top: 30px; display: inline-block; }
    </style>
</head>
<body>

    <h1>ChubbyX Coin</h1>
    <p>Connect your TON wallet to claim your tokens</p>

    <div id="ton-connect-button"></div>

    <script>
        // Initialize TON Connect UI
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://netlify.app',
            buttonRootId: 'ton-connect-button'
        });

        // Listen for wallet connection
        tonConnectUI.onStatusChange(wallet => {
            if (wallet) {
                const walletAddress = wallet.account.address;
                console.log("Wallet Connected:", walletAddress);
                
                // Sending the wallet address to Netlify Serverless Function
                fetch('/.netlify/functions/save-wallet', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ address: walletAddress })
                })
                .then(res => res.json())
                .then(data => console.log("Response from server:", data))
                .catch(err => console.error("Error saving wallet:", err));
            }
        });
    </script>
</body>
</html>
