<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChubbyX - Connect Wallet</title>
    <!-- Importing TON Connect SDK -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            font-family: 'Arial', sans-serif;
            background-color: #121212;
            color: #ffffff;
            text-align: center;
            padding: 50px 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }
        p {
            color: #aaaaaa;
            font-size: 16px;
        }
        #ton-connect-button {
            margin-top: 30px;
            display: inline-block;
        }
    </style>
</head>
<body>

    <h1>ChubbyX Coin</h1>
    <p>Connect your TON wallet to claim your tokens</p>

    <!-- This div will render the Tonkeeper / TON Connect button -->
    <div id="ton-connect-button"></div>

    <script>
        // Initialize TON Connect UI
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://netlify.app',
            buttonRootId: 'ton-connect-button'
        });
    </script>
</body>
</html>
