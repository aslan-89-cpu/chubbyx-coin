<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Lucky Spin</title>
    <style>
        body { background: #090314; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        h2 { color: #a48fff; margin-top: 20px; text-transform: uppercase; }
        
        .wheel-container { position: relative; margin: 30px auto; width: 300px; height: 300px; display: flex; justify-content: center; align-items: center; }
        
        /* The dynamic canvas wheel */
        #wheelCanvas { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            border: 5px solid #a48fff;
            box-shadow: 0 0 20px rgba(164, 143, 255, 0.4);
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); 
            z-index: 5;
        }
        
        .center-logo {
            position: absolute;
            width: 75px;
            height: 75px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            background: #090314;
            z-index: 10;
            pointer-events: none;
        }

        .pointer {
            position: absolute;
            top: -12px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 22px solid #ffd700;
            z-index: 20;
        }

        .btn-spin { background: #a48fff; color: black; border: none; padding: 12px 40px; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; width: 85%; margin-top: 25px; box-shadow: 0 4px 15px rgba(164, 143, 255, 0.3); }
        .btn-spin:disabled { background: #555; color: #888; cursor: not-allowed; box-shadow: none; }
        .back-btn { background: #1c103a; color: white; padding: 10px 35px; border-radius: 10px; text-decoration: none; display: inline-block; margin-top: 25px; border: 1px solid #331a5e; }
    </style>
    <script src="https://telegram.org"></script>
</head>
<body>

    <h2>ChubbyX Lucky Spin</h2>
    <p style="opacity: 0.8; font-size: 14px;">Spin the purple wheel to win mega rewards!</p>

    <div class="wheel-container">
        <div class="pointer"></div>
        <!-- Dynamic wheel built with HTML5 Canvas -->
        <canvas id="wheelCanvas" width="300" height="300"></canvas>
        <img src="image.png.jpeg" class="center-logo" alt="ChubbyX">
    </div>

    <button id="spinBtn" class="btn-spin" onclick="startSpin()">Spin Now</button>
    <br>
    <a href="index.html" class="back-btn">Back to Game</a>

    <script>
        if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.ready(); }

        const canvas = document.getElementById('wheelCanvas');
        const ctx = canvas.getContext('2d');
        
        // Define explicit reward items matching the visual segments
        const rewards = ["100", "500", "1,000", "2,500", "5,000", "10,000"];
        const colors = ["#3a1d5d", "#5c2e91", "#1f0f33", "#3a1d5d", "#5c2e91", "#1f0f33"];
        const numSegments = rewards.length;
        const arcSize = (2 * Math.PI) / numSegments;

        // Draw the wheel segments and prize texts dynamically
        function drawWheel() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            for (let i = 0; i < numSegments; i++) {
                const angle = i * arcSize;
                
                // Draw slice background
                ctx.fillStyle = colors[i];
                ctx.beginPath();
                ctx.moveTo(150, 150);
                ctx.arc(150, 150, 145, angle, angle + arcSize);
                ctx.lineTo(150, 150);
                ctx.fill();
                ctx.closePath();

                // Overlay English reward text onto slice
                ctx.save();
                ctx.fillStyle = "white";
                ctx.font = "bold 14px sans-serif";
                ctx.translate(150, 150);
                ctx.rotate(angle + arcSize / 2);
                ctx.textAlign = "right";
                ctx.fillText(rewards[i], 130, 5);
                ctx.restore();
            }
        }
        drawWheel();

        let canSpin = true;
        let currentRotation = 0;

        async function startSpin() {
            if (!canSpin) return;
            canSpin = false;
            document.getElementById('spinBtn').disabled = true;

            // Pick a random prize index (0 to 5)
            const prizeIndex = Math.floor(Math.random() * numSegments);
            
            // Calculate exact target angle to line up perfectly under the top pointer (-90 degrees position)
            const targetAngleDeg = 270 - (prizeIndex * (360 / numSegments)) - (180 / numSegments);
            const extraRotations = 3600; // 10 full turns for high speed feel
            
            currentRotation += extraRotations + (targetAngleDeg - (currentRotation % 360));
            canvas.style.transform = rotate(${currentRotation}deg);

            setTimeout(async () => {
                const winAmountStr = rewards[prizeIndex].replace(',', '');
                const winAmount = parseInt(winAmountStr);
                
                alert(Congratulations! You won +${rewards[prizeIndex]} Coins!);

                try {
                    const tgUserId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 12345;
                    await fetch('/api/add-coins', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: tgUserId, amount: winAmount, task: 'lucky_spin' })
                    });
                } catch (e) { 
                    console.error("Backend error syncing spin rewards:", e); 
                }

                canSpin = true;
                document.getElementById('spinBtn').disabled = false;
            }, 4000);
        }
    </script>
</body>
</html>
