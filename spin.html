<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Lucky Spin</title>
    <script src="https://telegram.org"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #131a26;
            color: white;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
        }
        .spin-container {
            margin-top: 50px;
        }
        .wheel-container {
            position: relative;
            width: 250px;
            height: 250px;
            margin: 20px auto;
        }
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 5px solid #9b59b6;
            transition: transform 4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            background-image: url('image.png.jpeg');
            background-size: cover;
            background-position: center;
        }
        .pointer {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 50px;
            height: 50px;
            background-image: url('image_okkB6u.png.jpeg');
            background-size: cover;
            border-radius: 50%;
        }
        .btn {
            background-color: #9b59b6;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 20px;
            width: 80%;
        }
    </style>
</head>
<body>

    <div class="spin-container">
        <h2>ChubbyX Lucky Spin</h2>
        <p>Spin the purple wheel to win mega rewards!</p>
        
        <div class="wheel-container">
            <div class="wheel" id="wheel"></div>
            <div class="pointer"></div>
        </div>
        
        <button class="btn" id="spinBtn" onclick="startSpin()">Spin Now</button>
        <p id="spinstatus"></p>
    </div>

    <script>
        const tg = window.Telegram.WebApp;
        tg.expand();

        // چالاککردنی دوگمەی گەڕانەوەی فەرمی تێلێگرام لە سەرەوە
        tg.BackButton.show();
        tg.BackButton.onClick(function() {
            // دەگەڕێتەوە سەر لاپەڕە ئەسڵییەکە کە مێنووەکەی خوارەوەی تێدایە
            window.location.href = "index.html"; 
            tg.BackButton.hide();
        });

        let canSpin = true;
        function startSpin() {
            if (!canSpin) return;
            canSpin = false;
            const wheel = document.getElementById('wheel');
            const randomDeg = Math.floor(Math.random() * 360) + 1800;
            wheel.style.transform = rotate(${randomDeg}deg);
            
            setTimeout(() => {
                document.getElementById('spinstatus').innerText = "Spin Completed!";
                canSpin = true;
            }, 4000);
        }
    </script>
</body>
</html>
