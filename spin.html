<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChubbyX Lucky Spin</title>
    <style>
        /* لێرەدا ستایلەکانی خۆت دابنێ، بەڵام دڵنیا بەرەوە ئەم بەشانەی خوارەوەت وەک خۆی لێبێت */
        .wheel-wrapper {
            position: relative;
            z-index: 1;
        }
        .segment-text {
            position: absolute;
            pointer-events: none; /* ڕێگری دەکات لەوەی دەقەکان ببنە بەربەست بۆ کلیک کردن */
        }
        .action-btn {
            position: relative;
            z-index: 999 !important; /* دوگمەکە دەخاتە سەرەوەی هەموو شتەکان بۆ ئەوەی کلیکی لێبکرێت */
            cursor: pointer;
            pointer-events: auto !important;
        }
        .back-btn {
            position: relative;
            z-index: 999 !important;
            cursor: pointer;
            pointer-events: auto !important;
        }
    </style>
</head>
<body>

    <div class="game-box">
        <h2 class="title">CHUBBYX LUCKY SPIN</h2>
        <div class="info-text" id="spinstatus">Spin the purple wheel to win mega rewards!</div>
        
        <div class="wheel-wrapper">
            <div class="pointer"></div>
            
            <div class="wheel" id="wheel">
                <div class="segment-text" style="transform: rotate(30deg);">5,000</div>
                <div class="segment-text" style="transform: rotate(90deg);">500</div>
                <div class="segment-text" style="transform: rotate(150deg);">1,000</div>
                <div class="segment-text" style="transform: rotate(210deg);">2,000</div>
                <div class="segment-text" style="transform: rotate(270deg);">500</div>
                <div class="segment-text" style="transform: rotate(330deg);">1,000</div>
            </div>

            <div class="center-circle"><img src="image-png.jpeg" alt="Chubbyx" /></div>
        </div>

        <button class="action-btn" id="spinbtn" onclick="startSpin()">Spin Now</button>
    </div>

    <button class="back-btn" onclick="goBack()">Back to Game</button>

    <script>
        const spinPrizes = [
            { text: "5,000", value: 5000, minAngle: 0, maxAngle: 60 },
            { text: "1,000", value: 1000, minAngle: 60, maxAngle: 120 },
            { text: "500", value: 500, minAngle: 120, maxAngle: 180 },
            { text: "2,000", value: 2000, minAngle: 180, maxAngle: 240 },
            { text: "500", value: 500, minAngle: 240, maxAngle: 300 },
            { text: "1,000", value: 1000, minAngle: 300, maxAngle: 360 }
        ];

        let isSpinning = false;
        let currentRotation = 0;

        function checkSpinLimit() {
            const lastSpin = localStorage.getItem('chubby_last_spin_timestamp');
            const btn = document.getElementById('spinbtn');
            const txt = document.getElementById('spinstatus');
            const twentyFourHours = 86400000; 

            if (lastSpin) {
                const timePassed = new Date().getTime() - parseInt(lastSpin);

                if (timePassed < twentyFourHours) {
                    btn.disabled = true; 
                    btn.style.opacity = "0.5"; 
                    
                    const timeLeft = twentyFourHours - timePassed;
                    const hoursLeft = Math.floor(timeLeft / (1000 * 60 * 60));
                    const minutesLeft = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));

                    txt.innerText = Already spun today! Try again in ${hoursLeft}h ${minutesLeft}m.;
                    return false;
                }
            }

            btn.disabled = false;
            btn.style.opacity = "1";
            return true;
        }

        function startSpin() {
            if (!checkSpinLimit() || isSpinning) return; 
            
            isSpinning = true;
            const wheel = document.getElementById("wheel");
            const statusText = document.getElementById("spinstatus");

            const prizeIndex = Math.floor(Math.random() * spinPrizes.length);
            const selectedPrize = spinPrizes[prizeIndex];
            const randomSliceAngle = Math.floor(Math.random() * (selectedPrize.maxAngle - selectedPrize.minAngle)) + selectedPrize.minAngle;
            
            const extraSpins = 1800; 
            currentRotation += extraSpins + (360 - randomSliceAngle);

            wheel.style.transition = "transform 4s cubic-bezier(0.25, 0.1, 0.25, 1)";
            wheel.style.transform = rotate(${currentRotation}deg);

            setTimeout(() => {
                isSpinning = false;
                statusText.innerText = You won: ${selectedPrize.text}!;
                
                localStorage.setItem('chubby_last_spin_timestamp', new Date().getTime());
                
                // ناردنی خەڵاتەکە بۆ باکئێند
                sendPrizeToBackend(selectedPrize.value);
                
                checkSpinLimit();
            }, 4000); 
        }

        function sendPrizeToBackend(prizeValue) {
            fetch('/api/save-prize', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ prize: prizeValue, timestamp: new Date().getTime() })
            })
            .then(res => res.json())
            .then(data => console.log('Prize saved:', data))
            .catch(err => console.error('Error:', err));
        }

        function goBack() {
            // گەڕانەوە بۆ لاپەڕەی سەرەکی یارییەکە
            window.location.href = "index.html"; 
        }

        window.onload = function() {
            checkSpinLimit();
        };
    </script>
</body>
</html>
