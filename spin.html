<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Lucky Spin</title>
    <style>
        body { background: #090314; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        h2 { color: #a48fff; margin-top: 20px; text-transform: uppercase; }
        
        /* Fixed Wheel Container */
        .wheel-container { position: relative; margin: 30px auto; width: 280px; height: 280px; display: flex; justify-content: center; align-items: center; }
        
        /* The Real Spinning Wheel Image with numbers built-in */
        .wheel-img { 
            width: 100%; 
            height: 100%; 
            border-radius: 50%; 
            border: 4px solid #a48fff;
            box-shadow: 0 0 15px rgba(164, 143, 255, 0.3);
            transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); 
        }
        
        /* Center Character Logo fixed on top */
        .center-logo {
            position: absolute;
            width: 70px;
            height: 70px;
            border-radius: 50%;
            border: 3px solid #ffd700;
            background: #090314;
            z-index: 10;
            pointer-events: none;
        }

        /* Top Pointer Triangle */
        .pointer {
            position: absolute;
            top: -12px;
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 22px solid #ffd700;
            z-index: 20;
        }

        .btn-spin { background: #a48fff; color: black; border: none; padding: 12px 40px; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; width: 85%; margin-top: 25px; box-shadow: 0 4px 15px rgba(164, 143, 255, 0.3); }
        .btn-spin:disabled { background: #555; color: #888; cursor: not-allowed; box-shadow: none; }
        .back-btn { background: #1c103a; color: white; padding: 10px 35px; border-radius: 10px; text-decoration: none; display: inline-block; margin-top: 25px; border: 1px solid #331a5e; }
    </style>
    <script src="https://telegram.org"></script>
</head>
<body>

    <h2>ChubbyX Lucky Spin</h2>
    <p style="opacity: 0.8; font-size: 14px;">Spin the purple wheel to win mega rewards!</p>

    <div class="wheel-container">
        <div class="pointer"></div>
        <!-- Using a stable official crypto spin wheel image with 6 sections (100 to 5000) -->
        <img src="https://imgur.com" id="wheel" class="wheel-img" alt="Lucky Spin">
        <!-- Placing your character image right on top of the center point -->
        <img src="image.png.jpeg" class="center-logo" alt="ChubbyX">
    </div>

    <button id="spinBtn" class="btn-spin" onclick="startSpin()">Spin Now</button>
    <br>
    <a href="index.html" class="back-btn">Back to Game</a>

    <script>
        if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.ready(); }

        let canSpin = true;
        let currentRotation = 0;

        // Reward values built inside the visual image segments (ordered clockwise)
        const rewards =;
        const numSegments = rewards.length;

        async function startSpin() {
            if (!canSpin) return;
            canSpin = false;
            document.getElementById('spinBtn').disabled = true;

            // Pick a random reward index
            const prizeIndex = Math.floor(Math.random() * numSegments);
            
            // Calculate exact angle to position the won slice under the top pointer
            const segmentAngle = 360 / numSegments;
            const targetAngle = 360 - (prizeIndex * segmentAngle);
            const extraRotations = 2880; // 8 full smooth rotations
            
            currentRotation += extraRotations + targetAngle - (currentRotation % 360);
            document.getElementById('wheel').style.transform = rotate(${currentRotation}deg);

            setTimeout(async () => {
                const winAmount = rewards[prizeIndex];
                alert(Congratulations! You won +${winAmount.toLocaleString()} Coins!);

                try {
                    const tgUserId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 12345;
                    await fetch('/api/add-coins', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: tgUserId, amount: winAmount, task: 'lucky_spin' })
                    });
                } catch (e) { 
                    console.error("Backend error syncing spin rewards:", e); 
                }

                canSpin = true;
                document.getElementById('spinBtn').disabled = false;
            }, 4000);
        }
    </script>
</body>
</html>
