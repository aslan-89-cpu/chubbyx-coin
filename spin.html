<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Lucky Spin</title>
    <style>
        body { background: #090314; color: white; font-family: sans-serif; text-align: center; padding: 20px; }
        h2 { color: #a48fff; margin-top: 20px; }
        .wheel-container { position: relative; margin: 30px auto; width: 260px; height: 260px; }
        .wheel-img { width: 100%; height: 100%; border-radius: 50%; transition: transform 4s cubic-bezier(0.1, 0.8, 0.1, 1); }
        .btn-spin { background: #a48fff; color: black; border: none; padding: 12px 40px; border-radius: 25px; font-weight: bold; font-size: 16px; cursor: pointer; width: 80%; margin-top: 20px; }
        .btn-spin:disabled { background: #555; color: #888; cursor: not-allowed; }
        .back-btn { background: #1c103a; color: white; padding: 10px 30px; border-radius: 10px; text-decoration: none; display: inline-block; margin-top: 30px; border: 1px solid #331a5e; }
    </style>
    <script src="https://telegram.org"></script>
</head>
<body>

    <h2>ChubbyX Lucky Spin</h2>
    <p style="opacity: 0.8;">Spin the purple wheel to win mega rewards!</p>

    <div class="wheel-container">
        <!-- Using your official image inside the spinning wheel -->
        <img src="image.png.jpeg" id="wheel" class="wheel-img" alt="Lucky Spin">
    </div>

    <button id="spinBtn" class="btn-spin" onclick="startSpin()">Spin Now</button>
    <br>
    <!-- Back button to return to main game -->
    <a href="game.html" class="back-btn">Back to Game</a>

    <script>
        if (window.Telegram && window.Telegram.WebApp) { window.Telegram.WebApp.ready(); }

        let canSpin = true;
        async function startSpin() {
            if (!canSpin) return;
            canSpin = false;
            document.getElementById('spinBtn').disabled = true;

            const degrees = Math.floor(2000 + Math.random() * 2000);
            document.getElementById('wheel').style.transform = rotate(${degrees}deg);

            setTimeout(async () => {
                const rewards =;
                const winAmount = rewards[Math.floor(Math.random() * rewards.length)];
                
                alert(Congratulations! You won +${winAmount} Coins!);

                // Send reward to server
                try {
                    const tgUserId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 12345;
                    await fetch('/api/add-coins', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: tgUserId, amount: winAmount, task: 'lucky_spin' })
                    });
                } catch (e) { console.error(e); }

                canSpin = true;
                document.getElementById('spinBtn').disabled = false;
            }, 4000);
        }
    </script>
</body>
</html>
