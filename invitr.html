<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Invite Friends</title>
    <style>
        body { 
            background: #090314; 
            color: white; 
            font-family: sans-serif; 
            padding: 20px; 
            text-align: center; 
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #a48fff; margin-top: 30px; text-transform: uppercase; }
        .invite-box { 
            background: #1c103a; 
            border: 1px solid #331a5e; 
            border-radius: 15px; 
            padding: 25px; 
            width: 100%;
            max-width: 380px;
            margin-top: 30px;
            box-sizing: border-box;
        }
        .counter { font-size: 22px; font-weight: bold; margin: 15px 0; color: #ff9800; }
        .reward-text { color: #a48fff; font-size: 14px; margin-bottom: 20px; font-weight: bold; }
        .btn-action { 
            background: #a48fff; 
            color: black; 
            border: none; 
            padding: 12px 25px; 
            border-radius: 10px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%;
            font-size: 16px;
        }
        .btn-action:disabled { background: #444; color: #888; cursor: not-allowed; }
        .back-btn { 
            background: #1c103a; 
            color: white; 
            padding: 12px 35px; 
            border-radius: 10px; 
            border: 1px solid #a48fff; 
            margin-top: 40px; 
            cursor: pointer; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <h2>Invite Friends</h2>
    <p style="opacity: 0.8; font-size: 14px;">Share your link and earn massive rewards!</p>

    <div class="invite-box">
        <div class="reward-text">🎁 +5,000 CHUB for every successful invite</div>
        <div class="counter">Invited: <span id="inviteCount">0</span> / 20</div>
        <button class="btn-action" id="invite-btn" onclick="sendInvite()">Copy Invite Link</button>
    </div>

    <button class="back-btn" onclick="window.location.href='index.html'">Back to Game</button>

    <script>
        let globalCoins = parseInt(localStorage.getItem('chubby_coins')) || 0;
        let currentInvites = parseInt(localStorage.getItem('chubby_invites')) || 0;
        const maxInvites = 20;
        const inviteReward = 5000;

        document.getElementById('inviteCount').innerText = currentInvites;
        if (currentInvites >= maxInvites) {
            document.getElementById('invite-btn').innerText = "Limit Reached (20/20)";
            document.getElementById('invite-btn').disabled = true;
        }

        function sendInvite() {
            // دروستکردنی بەستەری ڕاستەقینەی بۆتەکە
            let botUsername = "chubbyx_bot"; 
            let randomId = Math.floor(Math.random() * 99999);
            let inviteLink = https://t.me{botUsername}?start=r_${randomId};

            navigator.clipboard.writeText(inviteLink).then(() => {
                alert("Invite link copied! Send it to your friend.");
                
                // خەڵاتکردنی بەکارهێنەر ئەگەر هێشتا نەگەیشتبێتە لیمیتی ٢٠ هاوڕێ
                if (currentInvites < maxInvites) {
                    currentInvites++;
                    globalCoins += inviteReward;
                    
                    localStorage.setItem('chubby_invites', currentInvites);
                    localStorage.setItem('chubby_coins', globalCoins);
                    
                    document.getElementById('inviteCount').innerText = currentInvites;
                    
                    if (currentInvites >= maxInvites) {
                        document.getElementById('invite-btn').innerText = "Limit Reached (20/20)";
                        document.getElementById('invite-btn').disabled = true;
                    }
                }
            }).catch(() => {
                alert("Could not copy link automatically. Share this link: " + inviteLink);
            });
        }
    </script>
</body>
</html>
