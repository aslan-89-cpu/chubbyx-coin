<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Coin Catcher</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #090514; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 20px; }
        .game-box { background: #150f2e; border: 1px solid #2e1f5e; border-radius: 20px; padding: 25px 15px; width: 100%; max-width: 400px; display: flex; flex-direction: column; align-items: center; position: relative; }
        h2 { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
        .info-text { font-size: 13px; color: #9ca3af; margin-bottom: 25px; text-align: center; }
        #catcherCanvas { background: #0d081b; border: 2px solid #7b2cbf; border-radius: 12px; width: 100%; height: 300px; margin-bottom: 20px; touch-action: none; }
        .action-btn { background: #7b2cbf; color: white; border: none; padding: 14px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; width: 100%; }
        .action-btn:disabled { background: rgba(255, 255, 255, 0.05); color: #6b7280; cursor: not-allowed; border: 1px solid rgba(255, 255, 255, 0.1); }
        .back-btn { margin-top: 25px; background: rgba(255, 255, 255, 0.05); border: 1px solid rgba(255, 255, 255, 0.1); color: white; padding: 12px 35px; border-radius: 12px; font-size: 15px; cursor: pointer; font-weight: bold; width: 100%; max-width: 400px; text-align: center; }
    </style>
</head>
<body>
    <div class="game-box">
        <h2>ChubbyX Coin Catcher</h2>
        <div class="info-text" id="catcherStatus">Catch falling golden coins with your basket!</div>
        <canvas id="catcherCanvas" width="350" height="300"></canvas>
        <button class="action-btn" id="catcherBtn" onclick="startCatcherGame()">Start Game</button>
    </div>
    <button class="back-btn" onclick="location.href='game.html'">Back to Menu</button>
    <script>
        let canvas, ctx; let basket = { x: 140, y: 270, width: 70, height: 15 }; let fallingCoins = []; let catcherScore = 0; let gameTimer = 0; let catcherRunning = false;
        function checkCatcherLimit() {
            const lastCatcher = localStorage.getItem('chubby_last_catcher'); const btn = document.getElementById('catcherBtn'); const txt = document.getElementById('catcherStatus');
            if (lastCatcher && (new Date().getTime() - parseInt(lastCatcher) < 24*60*60*1000)) { btn.disabled = true; txt.innerText = "Daily catching completed! Come back tomorrow."; return false; }
            btn.disabled = false; txt.innerText = "Catch falling golden coins with your basket!"; return true;
        }
        function initCanvas() {
            canvas = document.getElementById('catcherCanvas'); ctx = canvas.getContext('2d'); drawCanvasStatic();
            canvas.addEventListener('touchmove', function(e) {
                if (!catcherRunning) return; let rect = canvas.getBoundingClientRect(); let touchX = e.touches.clientX - rect.left;
                basket.x = touchX - basket.width / 2; if (basket.x < 0) basket.x = 0; if (basket.x > canvas.width - basket.width) basket.x = canvas.width - basket.width;
            });
        }
        function drawCanvasStatic() { ctx.clearRect(0, 0, canvas.width, canvas.height); ctx.fillStyle = "#7b2cbf"; ctx.fillRect(basket.x, basket.y, basket.width, basket.height); ctx.fillStyle = "#9ca3af"; ctx.font = "14px sans-serif"; ctx.fillText("Press Start to Play (60s)", 100, 140); }
        function startCatcherGame() {
            if (catcherRunning || !checkCatcherLimit()) return; catcherRunning = true; catcherScore = 0; gameTimer = 60; fallingCoins = []; document.getElementById('catcherBtn').disabled = true;
            let gameInterval = setInterval(() => { gameTimer--; if (gameTimer <= 0) { clearInterval(gameInterval); endCatcherGame(); } }, 1000);
            animateCatcher();
        }
        function animateCatcher() {
            if (!catcherRunning) return; ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (Math.random() < 0.05) { fallingCoins.push({ x: Math.random() * (canvas.width - 20) + 10, y: 0, speed: Math.random() * 2 + 2 }); }
            ctx.fillStyle = "#eab308"; ctx.fillRect(basket.x, basket.y, basket.width, basket.height); ctx.fillStyle = "#ffdf00";
            for (let i = fallingCoins.length - 1; i >= 0; i--) {
                let c = fallingCoins[i]; c.y += c.speed; ctx.beginPath(); ctx.arc(c.x, c.y, 8, 0, Math.PI * 2); ctx.fill();
                if (c.y >= basket.y && c.y <= basket.y + basket.height && c.x >= basket.x && c.x <= basket.x + basket.width) { catcherScore += 50; fallingCoins.splice(i, 1); continue; }
                if (c.y > canvas.height) fallingCoins.splice(i, 1);
            }
            ctx.fillStyle = "white"; ctx.font = "12px sans-serif"; ctx.fillText(Score: ${catcherScore}, 15, 25); ctx.fillText(Time: ${gameTimer}s, canvas.width - 75, 25); requestAnimationFrame(animateCatcher);
        }
        function endCatcherGame() {
            catcherRunning = false; let coins = parseInt(localStorage.getItem('chubby_coins')) || 0; localStorage.setItem('chubby_coins', coins + catcherScore); localStorage.setItem('chubby_last_catcher', new Date().getTime());
            alert(Game Over! You earned +${catcherScore} ChubbyX Coins!); checkCatcherLimit(); drawCanvasStatic();
        }
        window.onload = function() { checkCatcherLimit(); initCanvas(); };
    </script>
</body>
</html>
