<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ChubbyX Tasks</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #090514;
            color: white;
            font-family: sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 30px 20px;
        }
        h1 { font-size: 28px; font-weight: bold; color: #a855f7; margin-bottom: 5px; text-transform: uppercase; letter-spacing: 1px; }
        .subtitle { font-size: 14px; color: #9ca3af; margin-bottom: 30px; text-align: center; }
        
        .section-title { font-size: 16px; font-weight: bold; color: #eab308; align-self: flex-start; margin: 15px 0 10px 5px; text-transform: uppercase; }

        .task-container { width: 100%; display: flex; flex-direction: column; gap: 15px; }
        
        .task-card {
            background: #150f2e;
            border: 1px solid #2e1f5e;
            border-radius: 15px;
            padding: 18px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            width: 100%;
        }
        .task-info h3 { font-size: 15px; font-weight: bold; margin-bottom: 4px; }
        .task-info p { font-size: 13px; color: #a855f7; font-weight: 500; }
        
        .task-btn {
            background: #7b2cbf;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            min-width: 90px;
            text-align: center;
        }
        .task-btn.checking { background: #eab308; color: #090514; }
        .task-btn.claim { background: #22c55e; }
        .task-btn.completed { background: rgba(255, 255, 255, 0.1); color: #6b7280; cursor: not-allowed; }

        .back-btn {
            margin-top: 40px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: white;
            padding: 12px 35px;
            border-radius: 12px;
            font-size: 15px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        .back-btn:hover { background: rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body>

    <h1>Daily Tasks</h1>
    <div class="subtitle">Complete tasks honestly to get rewards!</div>

    <!-- MAIN TASKS LIST -->
    <div class="section-title">🔒 Tasks List</div>
    <div class="task-container">
        
        <!-- TASK 1: TELEGRAM CHANNEL WITH REAL LINK -->
        <div class="task-card">
            <div class="task-info">
                <h3>Join Telegram Channel</h3>
                <p>Reward: +5,000 Coins</p>
            </div>
            <button class="task-btn" id="btn-tg" onclick="handleSocialTask('tg', 'https://t.me', 5000)">Join</button>
        </div>

        <!-- TASK 2: X / TWITTER PAGE -->
        <div class="task-card">
            <div class="task-info">
                <h3>Follow ChubbyX on X</h3>
                <p>Reward: +5,000 Coins</p>
            </div>
            <button class="task-btn" id="btn-x" onclick="handleSocialTask('x', 'https://x.com', 5000)">Follow</button>
        </div>

    </div>

    <button class="back-btn" onclick="goBack()">Back to Game</button>

    <script>
        // ANTI-CHEAT TIMER FUNCTION (7 SECONDS TIMER)
        function handleSocialTask(taskId, link, reward) {
            const btn = document.getElementById('btn-' + taskId);
            const status = localStorage.getItem('task_' + taskId);

            if (status === 'completed') return;

            if (!status) {
                window.open(link, '_blank');
                localStorage.setItem('task_' + taskId, 'checking');
                
                let timeLeft = 7;
                btn.innerText = timeLeft + 's...';
                btn.className = 'task-btn checking';
                
                const countdown = setInterval(() => {
                    timeLeft--;
                    if (timeLeft > 0) {
                        btn.innerText = timeLeft + 's...';
                    } else {
                        clearInterval(countdown);
                        btn.innerText = 'Claim';
                        btn.className = 'task-btn claim';
                        localStorage.setItem('task_' + taskId, 'claimable');
                    }
                }, 1000);

            } else if (status === 'claimable') {
                let currentCoins = parseInt(localStorage.getItem('chubby_coins')) || 0;
                currentCoins += reward;
                localStorage.setItem('chubby_coins', currentCoins);
                localStorage.setItem('task_' + taskId, 'completed');
                
                btn.innerText = '✓ Done';
                btn.className = 'task-btn completed';
                alert('Success! +' + reward.toLocaleString() + ' Coins added.');
            }
        }

        // LOAD SAVE STATE FROM DATABASE
        function checkTaskStatuses() {
            const tasks = ['tg', 'x'];
            tasks.forEach(taskId => {
                const btn = document.getElementById('btn-' + taskId);
                const status = localStorage.getItem('task_' + taskId);
                if (status === 'completed') {
                    btn.innerText = '✓ Done';
                    btn.className = 'task-btn completed';
                } else if (status === 'claimable' || status === 'checking') {
                    btn.innerText = 'Claim';
                    btn.className = 'task-btn claim';
                    localStorage.setItem('task_' + taskId, 'claimable');
                }
            });
        }

        function goBack() {
            window.parent.postMessage('closePage', '*');
        }

        window.onload = checkTaskStatuses;
    </script>
</body>
</html>
