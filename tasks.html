<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Tasks</title>
    <style>
        body { 
            background: #090314; 
            color: white; 
            font-family: sans-serif; 
            padding: 20px; 
            text-align: center; 
        }
        h2 { 
            color: #a48fff; 
            margin-top: 20px; 
            text-transform: uppercase; 
        }
        .task-item { 
            background: #1c103a; 
            border: 1px solid #331a5e; 
            border-radius: 12px; 
            padding: 15px; 
            margin-bottom: 15px; 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
        }
        .btn-action { 
            background: #a48fff; 
            color: black; 
            border: none; 
            padding: 10px 20px; 
            border-radius: 20px; 
            font-weight: bold; 
            cursor: pointer; 
            transition: background 0.3s;
        }
        .btn-action:hover {
            background: #bdadff;
        }
        .btn-claim {
            background: #28a745 !important;
            color: white !important;
        }
        .btn-disabled { 
            background: #555 !important; 
            color: #888 !important; 
            cursor: not-allowed; 
        }
        .back-btn { 
            background: #1c103a; 
            color: white; 
            padding: 12px 35px; 
            border-radius: 10px; 
            text-decoration: none; 
            display: inline-block; 
            margin-top: 20px; 
        }
    </style>
    <!-- Include Telegram WebApp Script -->
    <script src="https://telegram.org"></script>
</head>
<body>

    <h2>Daily Tasks</h2>
    <p style="opacity: 0.7; font-size: 14px;">Complete tasks honestly to get rewards!</p>

    <!-- Task 1: Telegram -->
    <div class="task-item">
        <div style="margin: 0; text-align: left;">
            <h4 style="margin: 0;">Join Telegram Channel</h4>
            <p style="color: #a48fff; margin: 5px 0 0 0;">Reward: +5,000 Coins</p>
        </div>
        <button class="btn-action" id="task1" onclick="handleTask('task1', 'https://t.me', 5000)">Join</button>
    </div>

    <!-- Task 2: Twitter / X -->
    <div class="task-item">
        <div style="margin: 0; text-align: left;">
            <h4 style="margin: 0;">Follow ChubbyX on X</h4>
            <p style="color: #a48fff; margin: 5px 0 0 0;">Reward: +5,000 Coins</p>
        </div>
        <button class="btn-action" id="task2" onclick="handleTask('task2', 'https://x.com', 5000)">Follow</button>
    </div>

    <!-- Back Button to Game -->
    <a href="index.html" class="back-btn">Back to Game</a>

    <script>
        // Initialize Telegram WebApp
        if (window.Telegram && window.Telegram.WebApp) {
            window.Telegram.WebApp.ready();
        }

        async function handleTask(taskId, url, rewardAmount) {
            const button = document.getElementById(taskId);
            
            // Step 1: Open link and switch to Claim state
            if (button.innerText === "Join" || button.innerText === "Follow") {
                window.open(url, '_blank');
                button.innerText = "Claim Reward";
                button.classList.add("btn-claim");
                return;
            }
            
            // Step 2: User clicks Claim Reward after coming back
            if (button.innerText === "Claim Reward") {
                
                // Secure Validation via Backend for Telegram Channel
                if (taskId === 'task1') {
                    try {
                        const tgUserId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id;
                        
                        if (!tgUserId) {
                            alert("Telegram User ID not found. Please open via Telegram.");
                            return;
                        }

                        const response = await fetch('/api/check-membership', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ userId: tgUserId })
                        });
                        const data = await response.json();
                        
                        if (!data.isMember) {
                            alert("Verification failed! You haven't joined the channel yet.");
                            button.innerText = "Join";
                            button.classList.remove("btn-claim");
                            return;
                        }
                    } catch (error) {
                        console.error("Verification error:", error);
                        alert("Server error during verification. Please try again later.");
                        return;
                    }
                }

                // Award the coins via Firebase/Backend connection
                try {
                    const tgUserId = window.Telegram?.WebApp?.initDataUnsafe?.user?.id || 12345;
                    
                    const coinResponse = await fetch('/api/add-coins', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ userId: tgUserId, amount: rewardAmount, task: taskId })
                    });

                    if (coinResponse.ok) {
                        alert("Success! +5,000 Coins added to your balance.");
                        button.innerText = "Completed";
                        button.classList.remove("btn-claim");
                        button.classList.add("btn-disabled");
                        button.disabled = true;
                    } else {
                        // Fallback message if balance updates successfully
                        alert("Task completed successfully!"); 
                        button.innerText = "Completed";
                        button.classList.remove("btn-claim");
                        button.classList.add("btn-disabled");
                        button.disabled = true;
                    }
                } catch (err) {
                    console.error("Coin claiming error:", err);
                    alert("Task completed successfully!"); 
                    button.innerText = "Completed";
                    button.classList.remove("btn-claim");
                    button.classList.add("btn-disabled");
                    button.disabled = true;
                }
            }
        }
    </script>
</body>
</html>
