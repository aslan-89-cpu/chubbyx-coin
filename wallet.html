<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChubbyX Wallet Hub</title>
    <!-- Core TON Connect SDK -->
    <script src="https://unpkg.com"></script>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .wallet-container {
            text-align: center;
            background: #151a26;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        h2 {
            color: #f3ba2f;
            margin-bottom: 8px;
        }
        p {
            color: #a0aec0;
            font-size: 14px;
            margin-bottom: 24px;
        }
        #ton-connect-btn {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
            min-height: 40px;
        }
        .btn-back {
            background: #0088cc;
            color: white;
            border: none;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="wallet-container">
        <h2>CHUBBYX WALLET HUB</h2>
        <p>Connect your TON Wallet to manage your coins</p>
        
        <!-- Official Button Root -->
        <div id="ton-connect-btn"></div>

        <button onclick="backToMenu()" class="btn-back">Back to Menu</button>
    </div>

    <script>
        // Injecting the official standard demo manifest directly to ensure it loads anywhere
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://github.io',
            buttonRootId: 'ton-connect-btn'
        });

        function backToMenu() {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
