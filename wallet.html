<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChubbyX Wallet Hub</title>
    <!-- Official Telegram WebApp Script to interact inside the app -->
    <script src="https://telegram.org"></script>
    <style>
        body {
            background-color: #0b0e14;
            color: #ffffff;
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }
        .wallet-container {
            text-align: center;
            background: #151a26;
            padding: 30px;
            border-radius: 20px;
            width: 90%;
            max-width: 360px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.4);
        }
        h2 {
            color: #f3ba2f;
            margin-bottom: 8px;
            text-transform: uppercase;
        }
        p {
            color: #a0aec0;
            font-size: 14px;
            margin-bottom: 24px;
        }
        .btn-connect {
            background: linear-gradient(135deg, #0088cc, #00a6ff);
            color: white;
            border: none;
            padding: 14px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
            margin-bottom: 15px;
            box-shadow: 0px 4px 10px rgba(0, 136, 204, 0.3);
        }
        .btn-back {
            background: transparent;
            color: #a0aec0;
            border: 1px solid #a0aec0;
            padding: 12px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
            width: 100%;
        }
    </style>
</head>
<body>

    <div class="wallet-container">
        <h2>CHUBBYX WALLET HUB</h2>
        <p>Connect your Wallet to manage your coins</p>
        
        <!-- Native Click Button -->
        <button onclick="openWallet()" class="btn-connect">Connect Wallet</button>

        <button onclick="backToMenu()" class="btn-back">Back to Menu</button>
    </div>

    <script>
        // Tell Telegram the webapp is ready
        window.Telegram.WebApp.ready();

        function openWallet() {
            // Using the official SDK method to force open Telegram Wallet deep-link inside the app
            window.Telegram.WebApp.openTelegramLink('https://t.me');
        }

        function backToMenu() {
            window.location.href = "index.html";
        }
    </script>

</body>
</html>
