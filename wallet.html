<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connect Wallet</title>
    <!-- TON Connect SDK فەرمی -->
    <script src="https://unpkg.com"></script>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background: #090514;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
        }
        h2 {
            color: #4a8fff;
            margin-top: 20px;
            text-transform: uppercase;
        }
        .wallet-box {
            background: #1c183a;
            border: 1px solid #331a5e;
            border-radius: 12px;
            padding: 30px 20px;
            margin: 30px 0;
            min-height: 12px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
    </style>
</head>
<body>

    <h2>ChubbyX Wallet</h2>
    <div class="wallet-box">
        <!-- دوگمەی ئۆتۆماتیکی تۆن کۆنێکت لێرە دروست دەبێت -->
        <div id="ton-connect-button"></div>
    </div>

    <script>
        // بەستنەوەی جزدانەکان بە شێوەی فەرمی
        const tonConnectUI = new TONConnectUI.TonConnectUI({
            manifestUrl: 'https://railway.app',
            buttonRootId: 'ton-connect-button'
        });
    </script>
</body>
</html>
