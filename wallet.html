<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connect Wallet</title>
    <!-- Importing Official TON Connect SDK for multi-wallet support (OKX, Tonkeeper, etc.) -->
    <script src="https://unpkg.com"></script>
    <script src="https://telegram.org"></script>
    <style>
        body {
            background: #090514;
            color: white;
            font-family: sans-serif;
            text-align: center;
            padding: 20px;
        }
        h2 {
            color: #4a8fff;
            margin-top: 20px;
            text-transform: uppercase;
        }
        .wallet-box {
            background: #1c183a;
            border: 1px solid #331a5e;
            border-radius: 12px;
            padding: 30px 20px;
            margin: 30px 0;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .ton-connect-btn {
            margin: 10px 0;
        }
        .status-text {
            font-size: 14px;
            opacity: 0.7;
            margin-bottom: 15px;
            max-width: 280px;
        }
        .balance-box {
            margin-top: 15px;
            font-size: 18px;
            font-weight: bold;
            color: #eab308;
        }
        .back-btn {
            background: #1c183a;
            color: white;
            padding: 10px 30px;
            border-radius: 10px;
            text-decoration: none;
            display: inline-block;
            margin-top: 20px;
            border: 1px solid #331a5e;
        }
    </style>
</head>
<body>

    <h2>Connect Wallet</h2>
    <p class="status-text">Connect your Web3 wallet to prepare for Airdrop withdrawal. Multiple wallets supported.</p>

    <div class="wallet-box">
        <div id="ton-connect-btn" class="ton-connect-btn"></div>
        <div class="balance-box" id="chubby-balance">Balance: 0 ChubbyX</div>
    </div>

    <!-- Fixed: redirects perfectly to main game dashboard index.html -->
    <a href="index.html" class="back-btn">Back to Game</a>

    <script>
        // پیشاندانی بڕی کۆینەکانی یارییەکە کە لە سندوقەکان براوەتەوە
        function updateDisplayBalance() {
            let coins = parseInt(localStorage.getItem('chubby_coins')) || 0;
            const balanceEl = document.getElementById('chubby-balance');
            if (balanceEl) {
                balanceEl.innerText = Balance: ${coins.toLocaleString()} ChubbyX;
            }
        }

        // ڕێکخستنی کێتی TON Connect
        const tonConnectUI = new TON_CONNECT_UI.TonConnectUI({
            manifestUrl: 'https://githubusercontent.com',
            buttonRootId: 'ton-connect-btn'
        });

        tonConnectUI.onStatusChange((wallet) => {
            if (wallet) {
                const walletAddress = wallet.account.address;
                console.log("Wallet connected successfully:", walletAddress);
                
                // پاشەکەوتکردنی ئەدرێسی وۆڵێت لە ناو بیرگەی مۆبایلەکەدا
                localStorage.setItem('chubby_wallet_address', walletAddress);
            } else {
                console.log("Wallet disconnected.");
                localStorage.removeItem('chubby_wallet_address');
            }
        });

        window.onload = function() {
            if (window.Telegram && window.Telegram.WebApp) {
                window.Telegram.WebApp.ready();
            }
            updateDisplayBalance();
        };
    </script>
</body>
</html>
