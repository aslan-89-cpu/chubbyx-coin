<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Connect Wallet</title>
    <style>
        body { 
            background: #090314; 
            color: white; 
            font-family: sans-serif; 
            padding: 20px; 
            text-align: center; 
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        h2 { color: #a48fff; margin-top: 30px; text-transform: uppercase; }
        .wallet-box { 
            background: #1c103a; 
            border: 1px solid #331a5e; 
            border-radius: 15px; 
            padding: 30px; 
            width: 100%;
            max-width: 380px;
            margin-top: 40px;
            box-sizing: border-box;
        }
        .btn-wallet { 
            background: #0098ea; 
            color: white; 
            border: none; 
            padding: 14px 20px; 
            border-radius: 12px; 
            font-weight: bold; 
            cursor: pointer; 
            width: 100%;
            font-size: 16px;
            box-shadow: 0 4px 15px rgba(0, 152, 234, 0.3);
        }
        .back-btn { 
            background: #1c103a; 
            color: white; 
            padding: 12px 35px; 
            border-radius: 10px; 
            border: 1px solid #a48fff; 
            margin-top: 40px; 
            cursor: pointer; 
            font-weight: bold; 
        }
    </style>
</head>
<body>

    <h2>Connect Wallet</h2>
    <p style="opacity: 0.8; font-size: 14px;">Connect your Web3 wallet to prepare for Airdrop withdrawal.</p>

    <div class="wallet-box">
        <p style="font-size:15px; opacity:0.7; margin-bottom:25px;">TON Wallet connectivity will be available soon. Stay tuned!</p>
        <button class="btn-wallet" onclick="alert('TON Space integration is loading... Please check back later.')">Connect TON Wallet</button>
    </div>

    <button class="back-btn" onclick="window.location.href='index.html'">Back to Game</button>

</body>
</html>
